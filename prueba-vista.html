<!doctype html><html><head><meta charset="utf-8"><title>prueba vista</title></head><body><pre id="o">…</pre>
<script type="module">
const o=document.getElementById('o'); const L=t=>o.textContent+='\n'+t;
const MPV='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3', MPM='https://storage.googleapis.com/mediapipe-models/';
try{ const M=await import(MPV+'/vision_bundle.mjs'); const F=await M.FilesetResolver.forVisionTasks(MPV+'/wasm'); L('lib ok');
  const c=document.createElement('canvas'); c.width=320; c.height=240; const x=c.getContext('2d'); x.fillStyle='#888'; x.fillRect(0,0,320,240);
  const mk=(C,url,extra)=>C.createFromOptions(F,Object.assign({baseOptions:{modelAssetPath:url,delegate:'CPU'},runningMode:'VIDEO'},extra||{}));
  const g=await mk(M.GestureRecognizer,MPM+'gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',{numHands:2}); L('gest ok '+JSON.stringify(Object.keys(g.recognizeForVideo(c,1))));
  const p=await mk(M.PoseLandmarker,MPM+'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',{numPoses:2}); L('pose ok '+JSON.stringify(Object.keys(p.detectForVideo(c,2))));
  const d=await mk(M.ObjectDetector,MPM+'object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite',{scoreThreshold:.45,maxResults:8}); L('obj ok '+JSON.stringify(Object.keys(d.detectForVideo(c,3))));
  const e=await mk(M.ImageEmbedder,MPM+'image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite',{quantize:true,l2Normalize:true}); const r=e.embedForVideo(c,4); L('emb ok '+(r.embeddings[0].quantizedEmbedding||[]).length);
  L('FIN'); }catch(err){ L('ERROR '+err.message); }
</script></body></html>
