<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Prueba voz Mor</title></head><body style="font-family:sans-serif;background:#081428;color:#fff;padding:20px">
<h2>Prueba de voz (Supertonic)</h2><div id="o">cargando…</div><div id="b"></div>
<script type="module">
const o=document.getElementById('o'); const L=t=>{ o.innerHTML+='<br>'+t; console.log('[PV] '+t); };
window.PV={log:[],audios:{}};
try{
  const T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2');
  const t0=performance.now(); let dev=navigator.gpu?'webgpu':'wasm';
  let tts; try{ tts=await T.pipeline('text-to-speech','onnx-community/Supertonic-TTS-2-ONNX',{device:dev,dtype:'fp32',progress_callback:p=>{ if(p.status==='done') L('bajado '+p.file); }}); }
  catch(e){ L('webgpu falla: '+e.message); dev='wasm'; tts=await T.pipeline('text-to-speech','onnx-community/Supertonic-TTS-2-ONNX',{device:'wasm',dtype:'fp32'}); }
  L('cargado en '+Math.round(performance.now()-t0)+' ms con '+dev);
  for(const v of ['M1','M2','M3','M4','M5','F1','F2','F3','F4','F5']){
    const t1=performance.now();
    const a=await tts('<es>¡Hola! Soy Mor, el robot de la familia. ¿Qué tal estás hoy? Me alegro mucho de verte.</es>',{speaker_embeddings:'https://huggingface.co/onnx-community/Supertonic-TTS-2-ONNX/resolve/main/voices/'+v+'.bin',num_inference_steps:5,speed:1.05});
    const ms=Math.round(performance.now()-t1); const dur=(a.audio.length/a.sampling_rate).toFixed(2);
    let s=0; for(const x of a.audio) s+=x*x; const rms=Math.sqrt(s/a.audio.length).toFixed(3);
    L(v+': '+ms+' ms para '+dur+' s de audio, rms '+rms);
    const url=URL.createObjectURL(a.toBlob()); const b=document.createElement('button'); b.textContent='▶ '+v; b.onclick=()=>new Audio(url).play(); document.getElementById('b').appendChild(b);
  }
  L('FIN');
}catch(e){ L('ERROR '+e.message); }
</script></body></html>
