<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>JUEGO</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:system-ui,sans-serif;user-select:none}canvas{display:block}
#hud{position:fixed;top:10px;left:12px;color:#fff;font-weight:700;font-size:18px;text-shadow:0 2px 4px #000}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;background:rgba(0,0,0,.55);z-index:5}
#ui.oculto{display:none}button{font:inherit;font-size:20px;padding:12px 28px;border-radius:14px;border:0;background:#ffcc33;color:#222;cursor:pointer}
#pausa{position:fixed;top:10px;right:10px;background:rgba(255,255,255,.2);color:#fff;font-size:18px;padding:6px 12px;z-index:4}
#joy{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);display:none;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
.ab{position:fixed;right:24px;bottom:30px;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:30px;display:none;align-items:center;justify-content:center;z-index:4}
@media (pointer:coarse){#joy{display:block}.ab{display:flex}}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="hud">Puntos: <span id="puntos">0</span> · Récord: <span id="record">0</span></div>
<div id="ui"><h1 id="titulo">JUEGO</h1><p id="texto">Cargando…</p><button id="bJugar" style="display:none">Jugar</button></div>
<button id="pausa">II</button>
<div id="joy"><div id="knob"></div></div>
<div class="ab" id="bSaltar" data-k="Space">⤒</div>
<!-- más botones táctiles: <div class="ab" data-k="KeyE" style="bottom:120px">✋</div> -->
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ---------- ESCENA, LUCES, SOMBRAS ----------
const R=new THREE.WebGLRenderer({antialias:true}); R.setPixelRatio(Math.min(devicePixelRatio,2)); R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap; R.toneMapping=THREE.ACESFilmicToneMapping; document.body.appendChild(R.domElement);
const escena=new THREE.Scene(); escena.background=new THREE.Color(0x9fd3ff); escena.fog=new THREE.Fog(0x9fd3ff,40,170);
const camara=new THREE.PerspectiveCamera(60,1,.1,600);
escena.add(new THREE.HemisphereLight(0xffffff,0x557744,1.1));
const sol=new THREE.DirectionalLight(0xffffff,2.2); sol.castShadow=true; sol.shadow.mapSize.set(2048,2048); Object.assign(sol.shadow.camera,{left:-50,right:50,top:50,bottom:-50,far:200}); sol.shadow.bias=-.0005; escena.add(sol,sol.target);
// ---------- TEXTURAS (las crea Mor; si falta alguna se usa el color) ----------
// pon aquí las texturas del juego:  nombre: 'textures/nombre.jpg'   (la de «suelo» se pone sola en el suelo)
const TEXTURAS={};
const cargadorTex=new THREE.TextureLoader();
function textura(nombre,repetir=1){ const r=TEXTURAS[nombre]; if(!r) return null; const t=cargadorTex.load(r); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repetir,repetir); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
const suelo=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x6aa84f,roughness:1})); suelo.rotation.x=-Math.PI/2; suelo.receiveShadow=true; escena.add(suelo);
{ const ts=textura('suelo',90); if(ts){ suelo.material.map=ts; suelo.material.color.set(0xffffff); } }
function ajustar(){ R.setSize(innerWidth,innerHeight); camara.aspect=innerWidth/innerHeight; camara.updateProjectionMatrix(); } addEventListener('resize',ajustar); ajustar();

// ---------- MODELOS 3D (GLB o FBX; si falta el archivo se usa una forma de color) ----------
// pon aquí TODOS los modelos del juego:  nombre: 'models/nombre.glb'
const MODELOS={ jugador:'models/jugador.glb' };
const gltf=new GLTFLoader(), fbx=new FBXLoader(), cache={};
function leer(ruta){ if(!ruta) return Promise.reject(new Error('sin ruta'));
  if(!cache[ruta]) cache[ruta]=fetch(ruta).then(r=>{ if(!r.ok) throw new Error('no está '+ruta); return r.arrayBuffer(); }).then(ab=>{
    const cab=new TextDecoder().decode(new Uint8Array(ab,0,Math.min(24,ab.byteLength)));
    if(/Kaydara|FBX/.test(cab)){ const o=fbx.parse(ab,''); return {scene:o,animations:o.animations||[]}; }
    return new Promise((ok,ko)=>gltf.parse(ab,'',g=>ok({scene:g.scene,animations:g.animations||[]}),ko)); });
  return cache[ruta]; }
// escala el modelo a la altura pedida, lo centra y lo apoya en el suelo (y=0)
function caja(obj){ obj.updateMatrixWorld(true); const b=new THREE.Box3(); let piel=false;
  obj.traverse(o=>{ if(o.isSkinnedMesh){ piel=true; o.skeleton&&o.skeleton.update(); o.computeBoundingBox(); b.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld)); } });
  if(!piel||b.isEmpty()) b.setFromObject(obj); return b; }
function encajar(obj,altura){ const s=new THREE.Vector3(); caja(obj).getSize(s); obj.scale.multiplyScalar(altura/(s.y||1));
  const b2=caja(obj), c=new THREE.Vector3(); b2.getCenter(c); obj.position.x-=c.x; obj.position.z-=c.z; obj.position.y-=b2.min.y;
  obj.traverse(o=>{ if(o.isMesh){ o.castShadow=o.receiveShadow=true; } }); }
// devuelve un Group listo para añadir a la escena (el modelo mira hacia +Z)
async function cargarModelo(nombre,{altura=1,color=0xcccccc,forma='caja'}={}){
  const g=new THREE.Group(); g.name=nombre; g.userData.anims=[];
  try{ const d=await leer(MODELOS[nombre]); const m=SkeletonUtils.clone(d.scene); encajar(m,altura); g.add(m); g.userData.real=m; g.userData.anims=d.animations; }
  catch(e){ const geo=forma==='capsula'?new THREE.CapsuleGeometry(altura*.22,altura*.56,6,16):forma==='esfera'?new THREE.SphereGeometry(altura/2,24,16):forma==='cilindro'?new THREE.CylinderGeometry(altura*.35,altura*.35,altura,20):new THREE.BoxGeometry(altura,altura,altura);
    const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,roughness:.7})); m.position.y=altura/2; m.castShadow=m.receiveShadow=true; g.add(m); }
  return g; }
// personaje animado: models/NOMBRE.glb y, opcionales, models/NOMBRE_quieto|andar|correr|saltar.glb (p. ej. de Mixamo, «In Place»)
const SIN={quieto:['quieto','idle','stand','breath','fly'],andar:['andar','walk','fly'],correr:['correr','run','sprint','gallop','fly'],saltar:['saltar','jump'],atacar:['atacar','attack','punch','slash','kick'],golpe:['golpe','hit','hurt'],morir:['morir','death','die'],bailar:['bailar','danc']};
async function cargarPersonaje(nombre,{altura=1.8,color=0x3366ff,anims=['quieto','andar','correr','saltar']}={}){
  const g=await cargarModelo(nombre,{altura,color,forma:'capsula'}), clips={};
  g.userData.anims.forEach(c=>clips[c.name.toLowerCase()]=c);
  for(const a of anims){ try{ const d=await leer(MODELOS[nombre+'_'+a]); if(d.animations[0]) clips[a]=d.animations[0]; }catch(e){} }
  const mixer=g.userData.real?new THREE.AnimationMixer(g.userData.real):null; let actual=null;
  const buscar=n=>clips[n]||(Object.entries(clips).find(([k])=>(SIN[n]||[n]).some(s=>k.includes(s)))||[])[1];
  g.userData.anim=(n,fundido=.2)=>{ if(!mixer) return; const c=buscar(n); if(!c) return; const acc=mixer.clipAction(c); if(acc===actual) return; acc.reset().fadeIn(fundido).play(); if(actual) actual.fadeOut(fundido); actual=acc; };
  g.userData.mixer=mixer; g.userData.anim('quieto'); MIXERS.push(mixer); return g; }
const MIXERS=[];

// ---------- ENTRADA: teclado, joystick táctil, botones y arrastrar para girar la cámara ----------
const K={}; addEventListener('keydown',e=>{ K[e.code]=true; if(['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault(); }); addEventListener('keyup',e=>K[e.code]=false);
document.querySelectorAll('.ab').forEach(b=>{ const k=b.dataset.k; b.addEventListener('pointerdown',e=>{ e.preventDefault(); K[k]=true; }); ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>K[k]=false)); });
const JOY={x:0,y:0}, joy=document.getElementById('joy'), knob=document.getElementById('knob'); let jid=null;
function mover(e){ const r=joy.getBoundingClientRect(), dx=(e.clientX-r.left-r.width/2)/(r.width/2), dy=(e.clientY-r.top-r.height/2)/(r.height/2), l=Math.min(1,Math.hypot(dx,dy)), a=Math.atan2(dy,dx); JOY.x=Math.cos(a)*l; JOY.y=Math.sin(a)*l; knob.style.transform=`translate(${JOY.x*35}px,${JOY.y*35}px)`; }
joy.addEventListener('pointerdown',e=>{ jid=e.pointerId; try{ joy.setPointerCapture(jid); }catch(e){} mover(e); }); joy.addEventListener('pointermove',e=>{ if(e.pointerId===jid) mover(e); });
['pointerup','pointercancel'].forEach(t=>joy.addEventListener(t,()=>{ jid=null; JOY.x=JOY.y=0; knob.style.transform=''; }));
const CAM={ang:0,dist:6,alto:2.6}; let arr=null;
R.domElement.addEventListener('pointerdown',e=>{ arr={x:e.clientX,id:e.pointerId}; }); addEventListener('pointermove',e=>{ if(arr&&e.pointerId===arr.id){ CAM.ang-=(e.clientX-arr.x)*.008; arr.x=e.clientX; } }); addEventListener('pointerup',()=>arr=null);
// dirección pedida (-1..1) en x (derecha) y z (atrás)
function entrada(){ let x=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0), z=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0); if(JOY.x||JOY.y){ x=JOY.x; z=JOY.y; } const l=Math.hypot(x,z); return l>1?{x:x/l,z:z/l}:{x,z}; }

// ---------- FÍSICA SENCILLA: gravedad, suelo, obstáculos (cajas) ----------
const GRAVEDAD=24, OBST=[];
function obstaculo(obj){ obj.updateMatrixWorld(true); const o={obj,caja:new THREE.Box3().setFromObject(obj)}; OBST.push(o); return o; }
// cuerpo = {obj, vel:Vector3, radio, alto, enSuelo}
function moverCuerpo(c,dt){ const p=c.obj.position; c.vel.y-=GRAVEDAD*dt; p.x+=c.vel.x*dt; p.z+=c.vel.z*dt; p.y+=c.vel.y*dt; c.enSuelo=false;
  if(p.y<=0){ p.y=0; c.vel.y=0; c.enSuelo=true; }
  for(const o of OBST){ const b=o.caja, m=c.radio*.6, dentro=p.x>b.min.x-m&&p.x<b.max.x+m&&p.z>b.min.z-m&&p.z<b.max.z+m;
    if(dentro&&c.vel.y<=0&&p.y>=b.max.y-.35&&p.y<=b.max.y+.05){ p.y=b.max.y; c.vel.y=0; c.enSuelo=true; continue; }   // aterriza encima
    if(p.y>=b.max.y-.05||p.y+c.alto<=b.min.y) continue;                                                                 // pasa por encima/debajo
    const cx=Math.max(b.min.x,Math.min(p.x,b.max.x)), cz=Math.max(b.min.z,Math.min(p.z,b.max.z)), dx=p.x-cx, dz=p.z-cz, d=Math.hypot(dx,dz);
    if(d<c.radio){ if(d>1e-4){ p.x=cx+dx/d*c.radio; p.z=cz+dz/d*c.radio; } else p.x=b.max.x+c.radio; } } }
const cerca=(a,b,dist)=>a.position.distanceTo(b.position)<dist;

// ---------- SONIDO (WebAudio, sin archivos) ----------
let AC=null; function sonido(f=440,dur=.12,tipo='square',vol=.12){ try{ AC=AC||new AudioContext(); const o=AC.createOscillator(), g=AC.createGain(); o.type=tipo; o.frequency.value=f; g.gain.setValueAtTime(vol,AC.currentTime); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur); }catch(e){} }

// ---------- CÁMARA EN TERCERA PERSONA ----------
function seguirCamara(obj,dt){ const t=obj.position, q=new THREE.Vector3(t.x+Math.sin(CAM.ang)*CAM.dist,t.y+CAM.alto,t.z+Math.cos(CAM.ang)*CAM.dist);
  camara.position.lerp(q,1-Math.exp(-8*dt)); camara.lookAt(t.x,t.y+1.2,t.z); sol.position.set(t.x+25,t.y+45,t.z+18); sol.target.position.copy(t); }

// ---------- JUGADOR ----------
let jugador=null;
function controlarJugador(dt){ const e=entrada(), corre=K.ShiftLeft||Math.hypot(JOY.x,JOY.y)>.9, v=corre?9:5;
  const s=Math.sin(CAM.ang), c=Math.cos(CAM.ang), dx=e.x*c+e.z*s, dz=-e.x*s+e.z*c, mov=Math.hypot(dx,dz)>.05;
  jugador.vel.x=dx*v; jugador.vel.z=dz*v;
  if(mov){ const obj=Math.atan2(dx,dz); let d=obj-jugador.obj.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); jugador.obj.rotation.y+=d*Math.min(1,dt*12); }
  if(K.Space&&jugador.enSuelo){ jugador.vel.y=9; sonido(520,.12); }
  moverCuerpo(jugador,dt);
  const a=jugador.obj.userData.anim; if(a) a(!jugador.enSuelo?'saltar':mov?(corre?'correr':'andar'):'quieto'); }

// ---------- ESTADO Y PANTALLAS ----------
let S=null, estado='cargando', RECORD=+(localStorage.getItem('record_JUEGO')||0);
const $=id=>document.getElementById(id);
function mostrarUI(t,txt,b){ $('titulo').textContent=t; $('texto').textContent=txt; $('bJugar').textContent=b; $('bJugar').style.display=''; $('ui').classList.remove('oculto'); }
async function preparar(){   // crea el mundo y carga los modelos (una sola vez)
  jugador={obj:await cargarPersonaje('jugador',{altura:1.8,color:0x3b82f6}),vel:new THREE.Vector3(),radio:.4,alto:1.8,enSuelo:true}; escena.add(jugador.obj);
  /* mundo: árboles, casas, plataformas… con cargarModelo(...) y obstaculo(...) */ }
function nuevaPartida(){ S={t:0,puntos:0}; jugador.obj.position.set(0,0,0); jugador.vel.set(0,0,0); }
function empezar(){ nuevaPartida(); estado='jugando'; $('ui').classList.add('oculto'); sonido(660,.15); }
function finPartida(){ estado='fin'; if(S.puntos>RECORD){ RECORD=S.puntos; localStorage.setItem('record_JUEGO',RECORD); } sonido(140,.4,'sawtooth'); mostrarUI('¡Fin!','Puntos: '+Math.floor(S.puntos)+' · Récord: '+Math.floor(RECORD),'Otra vez'); }
$('bJugar').onclick=()=>{ if(estado==='pausa'){ estado='jugando'; $('ui').classList.add('oculto'); } else empezar(); };
$('pausa').onclick=()=>{ if(estado==='jugando'){ estado='pausa'; mostrarUI('Pausa','','Seguir'); } };
addEventListener('keydown',e=>{ if(e.code==='Escape') $('pausa').onclick(); });

// ---------- LÓGICA (solo datos) ----------
function update(dt){ S.t+=dt; controlarJugador(dt); /* enemigos, objetos, puntos, dificultad, fin de partida… */ $('puntos').textContent=Math.floor(S.puntos); $('record').textContent=Math.floor(RECORD); }

// ---------- BUCLE (paso fijo) ----------
const reloj=new THREE.Clock(), PASO=1/60; let acum=0;
function bucle(){ const dt=Math.min(.1,reloj.getDelta());
  if(estado==='jugando'){ acum+=dt; while(acum>=PASO){ update(PASO); acum-=PASO; if(estado!=='jugando') break; } }
  MIXERS.forEach(m=>m&&m.update(dt)); if(jugador) seguirCamara(jugador.obj,dt); R.render(escena,camara); requestAnimationFrame(bucle); }
requestAnimationFrame(bucle);
preparar().then(()=>{ nuevaPartida(); estado='menu'; mostrarUI('JUEGO','Cómo se juega…','Jugar'); }).catch(e=>{ $('texto').textContent='Error al cargar: '+e.message; });
</script></body></html>
