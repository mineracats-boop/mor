<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vértice 3D</title>
<style>
:root{
  --border:#161616; --top:#232323; --panel:#303030; --panel2:#2b2b2b; --head:#3a3a3a;
  --field:#545454; --fieldh:#656565; --text:#e5e5e5; --dim:#9a9a9a; --accent:#4772b3;
  --sel:#ff9f1a; --act:#ffcc66; --row:#334d80; --vpbg:#393939;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--border);color:var(--text);font:12px/1.35 "Segoe UI","Noto Sans","DejaVu Sans",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:28px 1fr 22px;height:100%;gap:2px}
#topbar{display:flex;align-items:center;background:var(--top);padding:0 6px;gap:2px}
.logo{width:22px;height:22px;display:grid;place-items:center;margin-right:4px}
.mbtn{padding:3px 8px;border-radius:3px;cursor:default;white-space:nowrap}
.mbtn:hover,.mbtn.open{background:#454545}
#workspaces{display:flex;margin-left:14px;gap:1px}
.ws{padding:4px 10px;border-radius:3px 3px 0 0;cursor:default;color:var(--dim)}
.ws:hover{color:var(--text)}
.ws.on{background:var(--panel);color:var(--text)}
.spacer{flex:1}
.scenebox{display:flex;gap:6px;align-items:center;color:var(--dim)}
.scenebox span{background:#1d1d1d;padding:2px 10px;border-radius:3px;color:var(--text)}
#main{display:grid;grid-template-columns:1fr 310px;gap:2px;min-height:0}
#left{display:grid;grid-template-rows:1fr 150px;gap:2px;min-height:0;min-width:0}
#left.anim{grid-template-rows:1fr 260px}
#left.notl{grid-template-rows:1fr 0}
#left.notl #tl{display:none}
#vp{display:grid;grid-template-rows:28px 1fr;background:var(--panel);border-radius:4px;overflow:hidden;min-height:0}
#vphead,#tlhead,.ahead{display:flex;align-items:center;gap:3px;padding:0 6px;background:var(--head);white-space:nowrap;overflow:hidden}
.drop{background:var(--field);border-radius:3px;padding:3px 8px;cursor:default;display:flex;align-items:center;gap:5px}
.drop:hover{background:var(--fieldh)}
.seg{display:flex;border-radius:3px;overflow:hidden;gap:1px}
.seg button{background:var(--field);border:0;padding:3px 7px;cursor:default;height:22px;display:grid;place-items:center}
.seg button:hover{background:var(--fieldh)}
.seg button.on{background:var(--accent)}
#vpbody{position:relative;min-height:0;overflow:hidden;background:var(--vpbg)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#toolbar{position:absolute;left:6px;top:42px;display:flex;flex-direction:column;gap:1px;background:#2a2a2acc;border-radius:5px;padding:2px}
#toolbar button{width:32px;height:32px;border:0;background:transparent;border-radius:4px;display:grid;place-items:center;cursor:default}
#toolbar button:hover{background:#4a4a4a}
#toolbar button.on{background:var(--accent)}
#toolbar .sep{height:6px}
#navgizmo{position:absolute;right:8px;top:8px;width:96px;height:96px;cursor:grab}
#navbtns{position:absolute;right:38px;top:110px;display:flex;flex-direction:column;gap:4px}
#navbtns button{width:30px;height:30px;border-radius:50%;border:0;background:#2a2a2acc;display:grid;place-items:center;cursor:default}
#navbtns button:hover{background:#555}
#navbtns button.on{background:var(--accent)}
#vpinfo{position:absolute;left:50px;top:8px;color:#d8d8d8;text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.5}
#modalhint{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#1d1d1dee;padding:4px 12px;border-radius:4px;display:none;pointer-events:none;font-variant-numeric:tabular-nums}
#npanel{position:absolute;right:140px;top:8px;width:230px;background:#2b2b2bf2;border-radius:5px;display:none;max-height:calc(100% - 16px);overflow:auto;padding-bottom:6px}
#npanel.on{display:block}
#boxsel{position:absolute;border:1px dashed #fff;background:#ffffff14;display:none;pointer-events:none}
#tl{display:grid;grid-template-rows:28px 1fr;background:var(--panel);border-radius:4px;overflow:hidden;min-height:0}
#tlcanvas{width:100%;height:100%;display:block;cursor:col-resize}
#tlwrap{position:relative;min-height:0}
#right{display:grid;grid-template-rows:38% 1fr;gap:2px;min-height:0}
#outliner,#props{background:var(--panel);border-radius:4px;overflow:hidden;display:grid;min-height:0}
#outliner{grid-template-rows:28px 1fr}
#olist{overflow:auto;padding:3px 0}
.orow{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 10px;height:22px;cursor:default}
.orow:nth-child(even){background:#2c2c2c}
.orow:hover{background:#3b3b3b}
.orow.sel{background:#3c4e70}
.orow.act{background:var(--row)}
.orow .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.orow .nm input{width:100%;background:#1d1d1d;border:1px solid var(--accent);color:var(--text);font:inherit;padding:0 3px}
.orow .eye{opacity:.8;border:0;background:none;padding:0 2px;cursor:default}
.orow.hid .nm{color:#777}
.collrow{padding-left:8px;color:var(--dim)}
#props{grid-template-columns:30px 1fr}
#ptabs{background:#252525;display:flex;flex-direction:column;gap:2px;padding:4px 2px}
#ptabs button{width:26px;height:26px;border:0;border-radius:4px;background:transparent;display:grid;place-items:center;cursor:default}
#ptabs button:hover{background:#3d3d3d}
#ptabs button.on{background:var(--panel)}
#pbody{overflow:auto;padding:4px 6px 20px}
.ptitle{display:flex;align-items:center;gap:6px;padding:6px 4px 8px;font-weight:600}
.sec{background:var(--panel2);border-radius:4px;margin-bottom:4px}
.sech{padding:5px 8px;display:flex;gap:6px;align-items:center;cursor:default}
.sech:before{content:"▾";color:var(--dim);font-size:10px}
.sec.closed .sech:before{content:"▸"}
.sec.closed .secb{display:none}
.secb{padding:2px 8px 8px}
.row{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:6px;margin:2px 0}
.row>label{text-align:right;color:#cfcfcf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trio{display:flex;flex-direction:column;gap:1px}
.nf{background:var(--field);border-radius:3px;height:21px;display:flex;align-items:center;padding:0 7px;cursor:ew-resize;position:relative;font-variant-numeric:tabular-nums}
.trio .nf{border-radius:0}.trio .nf:first-child{border-radius:3px 3px 0 0}.trio .nf:last-child{border-radius:0 0 3px 3px}
.nf:hover{background:var(--fieldh)}
.nf .l{color:#bdbdbd;margin-right:auto}
.nf.key{background:#b5a52f;color:#111}.nf.key .l{color:#222}
.nf.anim{background:#4f7a3d}
.nf input{position:absolute;inset:0;width:100%;background:#1d1d1d;border:1px solid var(--accent);border-radius:3px;color:var(--text);font:inherit;padding:0 6px;outline:none}
.tf{background:#1d1d1d;border:1px solid #3d3d3d;border-radius:3px;color:var(--text);font:inherit;height:21px;padding:0 6px;width:100%;outline:none}
.tf:focus{border-color:var(--accent)}
.colorf{width:100%;height:21px;border:0;padding:0;background:none;border-radius:3px;cursor:pointer}
.chk{display:flex;align-items:center;gap:6px;cursor:default}
.chk input{accent-color:var(--accent)}
.btn{background:var(--field);border:0;border-radius:3px;height:22px;padding:0 10px;cursor:default;width:100%}
.btn:hover{background:var(--fieldh)}
.btn.blue{background:var(--accent)}
.mod{background:#383838;border-radius:4px;margin:6px 0;border:1px solid #262626}
.modh{display:flex;align-items:center;gap:6px;padding:4px 6px;background:#404040;border-radius:4px 4px 0 0}
.modh b{flex:1;font-weight:500}
.modh button{border:0;background:none;cursor:default;padding:0 3px}
.modb{padding:4px 8px 8px}
.axes3{display:flex;gap:1px}.axes3 button{flex:1;border:0;background:var(--field);height:21px;cursor:default}
.axes3 button.on{background:var(--accent)}
.axes3 button:first-child{border-radius:3px 0 0 3px}.axes3 button:last-child{border-radius:0 3px 3px 0}
select.tf{appearance:auto}
.empty{color:var(--dim);padding:20px 10px;line-height:1.6}
#status{display:flex;align-items:center;gap:16px;background:var(--top);padding:0 10px;color:var(--dim);white-space:nowrap;overflow:hidden}
#status b{color:var(--text);font-weight:500}
#status .r{margin-left:auto}
.kb{display:inline-block;border:1px solid #555;border-radius:3px;padding:0 4px;font-size:11px;color:#ccc;margin-right:3px}
/* menus */
#menus{position:fixed;inset:0;pointer-events:none;z-index:50}
.menu{position:fixed;background:#181818f5;border:1px solid #2e2e2e;border-radius:5px;padding:4px 0;min-width:200px;pointer-events:auto;box-shadow:0 6px 18px #0008}
.menu .mt{padding:3px 12px 5px;color:var(--dim);border-bottom:1px solid #2e2e2e;margin-bottom:3px}
.mi{display:flex;gap:16px;align-items:center;padding:3px 12px;cursor:default}
.mi:hover,.mi.hi{background:var(--accent)}
.mi .k{margin-left:auto;color:#999;font-size:11px}
.mi:hover .k{color:#ddd}
.mi.sub:after{content:"▸";margin-left:auto;color:#999}
.mi.dis{color:#666;pointer-events:none}
.msep{height:1px;background:#2e2e2e;margin:3px 0}
.pie{position:fixed;pointer-events:auto}
.pie button{position:absolute;transform:translate(-50%,-50%);background:#181818f0;border:1px solid #333;border-radius:4px;padding:5px 14px;white-space:nowrap;cursor:default}
.pie button:hover,.pie button.on{background:var(--accent)}
.pie .ring{position:absolute;width:44px;height:44px;border:3px solid #ffffff30;border-radius:50%;transform:translate(-50%,-50%)}
#search{position:fixed;z-index:60;background:#181818f8;border:1px solid #333;border-radius:6px;width:340px;display:none;box-shadow:0 8px 24px #000a}
#search input{width:100%;background:#2b2b2b;border:0;border-bottom:1px solid #333;color:var(--text);font:inherit;padding:8px 10px;outline:none;border-radius:6px 6px 0 0}
#slist{max-height:300px;overflow:auto;padding:3px 0}
#renderwin{position:fixed;inset:5%;background:#1d1d1d;border:1px solid #444;border-radius:6px;display:none;grid-template-rows:30px 1fr;z-index:70;box-shadow:0 10px 40px #000c}
#renderwin .ahead{justify-content:space-between}
#renderwin .ri{display:grid;place-items:center;overflow:hidden;background:repeating-conic-gradient(#2a2a2a 0 25%,#232323 0 50%) 0 0/24px 24px}
#renderwin img{max-width:100%;max-height:100%}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#202020;border:1px solid #444;padding:6px 14px;border-radius:4px;display:none;z-index:80}

#course{position:absolute;left:48px;bottom:10px;width:350px;max-height:calc(100% - 20px);overflow:auto;background:#222222f4;border:1px solid #3a3a3a;border-radius:8px;box-shadow:0 8px 28px #0009;z-index:5}
#course.min{max-height:none;overflow:hidden}#course.min #cbody{display:none}
#course .ch{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#2c3a52;border-radius:8px 8px 0 0;position:sticky;top:0;z-index:1;cursor:default}
#course .ch b{font-size:13px}#cprog{color:#b9c7dd;font-size:11px;margin-right:auto}
#course .ch button{border:0;background:#ffffff14;border-radius:4px;width:22px;height:22px;cursor:default}
#course .ch button:hover{background:#ffffff30}
#cbody{padding:10px 12px 12px}
.cbar{height:4px;background:#3a3a3a;border-radius:2px;margin:8px 0 10px;overflow:hidden}.cbar div{height:100%;background:#5fb35f;transition:width .3s}
.cintro{line-height:1.55;color:#d6d6d6;margin-bottom:10px;font-size:12.5px}
.cintro code{background:#111;padding:0 4px;border-radius:3px}
.csteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.csteps li{display:flex;gap:9px;padding:7px 8px;border-radius:5px;line-height:1.5;color:#8d8d8d}
.csteps li.cur{background:#30405e;color:#f0f0f0;outline:1px solid #4772b3}
.csteps li.done{color:#9bbf9b}
.csteps li.flash{animation:cfl .9s}
@keyframes cfl{from{background:#3f7a3f}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.csteps li.flash{animation:none}.cbar div{transition:none}}
.cdot{flex:none;width:20px;height:20px;border-radius:50%;background:#3a3a3a;display:grid;place-items:center;font-size:11px;color:#ddd}
li.cur .cdot{background:#4772b3}li.done .cdot{background:#3f7a3f}
.cact{margin-top:6px}.cact .btn{width:auto}
.clink{background:none;border:0;color:#8fb0e6;cursor:pointer;padding:2px 0;font-size:11.5px}
.clink:hover{text-decoration:underline}
.cdone{background:#2f4a2f;border-radius:6px;padding:10px;margin-top:10px;display:flex;flex-direction:column;gap:8px;line-height:1.5}
.cnav{display:flex;margin-top:10px;border-top:1px solid #333;padding-top:8px}
@media (max-width:800px){#main{grid-template-columns:1fr}#right{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo" title="Vértice 3D"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1.5 16 6v6.5L9 16.5 2 12.5V6z" fill="none" stroke="#e8e8e8" stroke-width="1.4"/><circle cx="9" cy="9" r="2.4" fill="#ff9f1a"/></svg></div>
    <div id="mainmenu" style="display:flex"></div>
    <div id="workspaces"></div>
    <div class="mbtn" id="courseBtn" style="margin-left:10px;background:#4772b3">🎓 Curso</div>
    <div class="spacer"></div>
    <div class="scenebox">Escena <span>Escena</span> Capa <span>Capa de vista</span></div>
  </div>
  <div id="main">
    <div id="left">
      <div id="vp">
        <div id="vphead">
          <div class="drop" id="modeDrop">Modo objeto ▾</div>
          <div class="mbtn" data-vm="view">Vista</div>
          <div class="mbtn" data-vm="select">Seleccionar</div>
          <div class="mbtn" data-vm="add">Añadir</div>
          <div class="mbtn" data-vm="object" id="objMenuBtn">Objeto</div>
          <div class="spacer"></div>
          <div class="seg" style="margin-right:6px"><button id="ovBtn" class="on" title="Superposiciones">⊙</button><button id="xrayBtn" title="Rayos X (Alt+Z)">▣</button></div>
          <div class="seg" id="shadeSeg"></div>
        </div>
        <div id="vpbody">
          <canvas id="c" tabindex="0"></canvas>
          <div id="vpinfo"></div>
          <div id="toolbar"></div>
          <canvas id="navgizmo" width="192" height="192"></canvas>
          <div id="navbtns">
            <button id="nbZoom" title="Zoom (arrastrar)">🔍</button>
            <button id="nbPan" title="Desplazar (arrastrar)">✋</button>
            <button id="nbCam" title="Vista de cámara (Numpad 0)">🎥</button>
            <button id="nbOrtho" title="Perspectiva / ortográfica (Numpad 5)">▦</button>
          </div>
          <div id="npanel"></div>
          <div id="boxsel"></div>
          <div id="modalhint"></div>
          <div id="course"><div class="ch"><b>🎓 Curso</b><span id="cprog"></span><button id="cmin" title="Minimizar">–</button><button id="cclose" title="Cerrar">✕</button></div><div id="cbody"></div></div>
        </div>
      </div>
      <div id="tl">
        <div id="tlhead"></div>
        <div id="tlwrap"><canvas id="tlcanvas"></canvas></div>
      </div>
    </div>
    <div id="right">
      <div id="outliner">
        <div class="ahead"><span style="color:var(--dim)">Esquema</span><div class="spacer"></div><input class="tf" id="ofilter" placeholder="Filtrar" style="width:120px;height:20px"></div>
        <div id="olist"></div>
      </div>
      <div id="props">
        <div id="ptabs"></div>
        <div id="pbody"></div>
      </div>
    </div>
  </div>
  <div id="status"></div>
</div>
<div id="menus"></div>
<div id="search"><input id="sinput" placeholder="Buscar comando…"><div id="slist"></div></div>
<div id="renderwin"><div class="ahead"><span>Imagen renderizada</span><div style="display:flex;gap:6px"><button class="btn" id="rsave" style="width:auto">Guardar imagen</button><button class="btn" id="rclose" style="width:auto">Cerrar</button></div></div><div class="ri"><img id="rimg" alt="Render"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);

THREE.Object3D.DefaultUp.set(0,0,1);

const evLog=[];function ev(t,d){evLog.push({t,d});if(window.courseTick)window.courseTick();}
// ================= STATE =================
const S={sel:new Set(),active:null,mode:'OBJECT',shading:'SOLID',frame:1,start:1,end:250,fps:24,playing:false,
  tool:'select',cursor:new THREE.Vector3(),editSel:new Set(),overlays:true,xray:false,camView:false,ortho:false,
  world:{color:'#4a4a4a',strength:1},render:{w:1920,h:1080},sceneCam:null,ptab:'object',workspace:'Layout'};

// ================= RENDERER / SCENE =================
const canvas=$('#c'), vpbody=$('#vpbody');

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

perspCam.position.set(9.5,-9.5,7);
const orthoCam=new THREE.OrthographicCamera(-1,1,1,-1,-5000,5000);
scene.add(perspCam); scene.add(orthoCam);
let viewCam=perspCam;
const controls=new THREE.OrbitControls(perspCam,canvas);
controls.mouseButtons={LEFT:-1,MIDDLE:THREE.MOUSE.ROTATE,RIGHT:-1};
controls.screenSpacePanning=true; controls.zoomSpeed=1.3; controls.rotateSpeed=0.9;
controls.target.set(0,0,0.5); controls.update();
vpbody.addEventListener('pointerdown',e=>{controls.mouseButtons.LEFT=(e.altKey&&e.button===0)?THREE.MOUSE.ROTATE:-1;},true);
let navStart=null;
controls.addEventListener('start',()=>{if(S.camView)exitCamView();navStart={d:viewCam.position.distanceTo(controls.target),z:viewCam.zoom,t:controls.target.clone(),dir:viewCam.position.clone().sub(controls.target).normalize()};});
controls.addEventListener('end',()=>{if(!navStart)return;const n=navStart;navStart=null;const d=viewCam.position.distanceTo(controls.target);
  if(Math.abs(d-n.d)/n.d>0.02||Math.abs(viewCam.zoom-n.z)>0.01)ev('zoom');else if(controls.target.distanceTo(n.t)>1e-4)ev('pan');else if(viewCam.position.clone().sub(controls.target).normalize().distanceTo(n.dir)>0.01)ev('orbit');});

// grid & axes
const grid=new THREE.GridHelper(200,200,0x4f4f4f,0x444444); grid.rotation.x=Math.PI/2; grid.material.transparent=true; grid.material.opacity=.9; overlay.add(grid);
const grid10=new THREE.GridHelper(200,20,0x555555,0x555555); grid10.rotation.x=Math.PI/2; overlay.add(grid10);
function axisLine(a,b,c){const g=new THREE.BufferGeometry().setFromPoints([a,b]);return new THREE.Line(g,new THREE.LineBasicMaterial({color:c}));}
overlay.add(axisLine(new THREE.Vector3(-100,0,0.001),new THREE.Vector3(100,0,0.001),0xb3394a));
overlay.add(axisLine(new THREE.Vector3(0,-100,0.001),new THREE.Vector3(0,100,0.001),0x6a9a2a));

// 3D cursor
const cursor3d=new THREE.Group();

function compact(p,idx){const used=new Int32Array(p.length/3).fill(-1);const np=[];const ni=new Array(idx.length);let c=0;

function combine(list){let np=[],ni=[],off=0;for(const a of list){for(let k=0;k<a.p.length;k++)np.push(a.p[k]);for(const v of a.i)ni.push(v+off);off+=a.p.length/3;}return mk(new Float32Array(np),ni);}

    if(selSet&&selSet.size&&!(selSet.has(x)&&selSet.has(y)&&selSet.has(z))){ni.push(x,y,z);continue;}

  closeMenus();const pivot=selCenter();const t=new THREE.Vector3();
  modal={type,axis:-1,num:'',pivot,start:{x:mouse.x,y:mouse.y},extr:!!fromExtrude,orig:[]};

function planeHit(x,y){ray.setFromCamera(ndc(x,y),renderCam());const n=new THREE.Vector3();renderCam().getWorldDirection(n);const pl=new THREE.Plane().setFromNormalAndCoplanarPoint(n,modal.pivot);const o=new THREE.Vector3();return ray.ray.intersectPlane(pl,o)||modal.pivot.clone();}

  const w0=P.clone().sub(O);const a=d.dot(d),b=d.dot(D),c=D.dot(D),dd=d.dot(w0),e=D.dot(w0);const den=a*c-b*b;if(Math.abs(den)<1e-8)return 0;return (b*e-c*dd)/den;}

let ctrlHeld=false,shiftHeld=false;
function updateModal(){const m=modal;if(!m)return;const num=m.num!==''&&m.num!=='-'?parseFloat(m.num):null;let info='';

    else if(m.axis>=0){const ax=AX[m.axis];const t0=axisT(m.start.x,m.start.y,ax),t1=axisT(mouse.x,mouse.y,ax);let dv=t1-t0;if(ctrlHeld)dv=Math.round(dv);if(shiftHeld)dv=dv;d=ax.clone().multiplyScalar(dv);}

    if(S.mode==='OBJECT')m.orig.forEach(r=>r.o.position.copy(r.p).add(d));else m.orig.forEach(r=>setVert(r.i,r.w.clone().add(d)));}
  else if(m.type==='R'){let ang;let axis=m.axis>=0?AX[m.axis].clone():viewDir.clone();
    if(num!=null)ang=num*D2R;else{const a0=Math.atan2(m.start.y-m.ps.y,m.start.x-m.ps.x),a1=Math.atan2(mouse.y-m.ps.y,mouse.x-m.ps.x);ang=a1-a0;if(m.axis>=0&&axis.dot(viewDir)<0)ang=-ang;

    editWire=new THREE.LineSegments(new THREE.WireframeGeometry(S.active.userData.base),new THREE.LineBasicMaterial({color:0,transparent:true,opacity:.75,depthTest:!S.xray}));editWire.raycast=()=>{};S.active.add(editWire);

  setStatus(`<span><span class="kb">Clic</span>Confirmar</span><span><span class="kb">Esc</span>/<span class="kb">Clic der.</span>Cancelar</span><span><span class="kb">X</span><span class="kb">Y</span><span class="kb">Z</span>Restringir eje</span><span><span class="kb">Ctrl</span>Ajustar</span><span>Escribe un número para un valor exacto</span>`);
  refreshValues();}

function insertKey(){const list=S.mode==='OBJECT'?[...S.sel]:[S.active];if(!list.length||!list[0]){toast('Nada seleccionado');return;}
  list.forEach(o=>{o.userData.keys[S.frame]={p:o.position.toArray(),r:[o.rotation.x,o.rotation.y,o.rotation.z],s:o.scale.toArray()};});
  pushUndo();drawTimeline();refreshValues();toast('Fotograma clave insertado en '+S.frame);}
function deleteKey(){let n=0;S.sel.forEach(o=>{if(o.userData.keys[S.frame]){delete o.userData.keys[S.frame];n++;}});if(n){pushUndo();drawTimeline();refreshValues();toast('Fotograma clave eliminado');}}
function clearKeys(){S.sel.forEach(o=>o.userData.keys={});pushUndo();drawTimeline();refreshValues();}
function evalKeys(o,f){const ks=Object.keys(o.userData.keys||{}).map(Number).sort((a,b)=>a-b);if(!ks.length)return null;const K=o.userData.keys;
  if(f<=ks[0])return K[ks[0]];if(f>=ks[ks.length-1])return K[ks[ks.length-1]];
  for(let i=0;i<ks.length-1;i++)if(f>=ks[i]&&f<=ks[i+1]){const a=K[ks[i]],b=K[ks[i+1]];let t=(f-ks[i])/(ks[i+1]-ks[i]);t=t*t*(3-2*t);
    const L=(x,y)=>x.map((v,j)=>v+(y[j]-v)*t);return {p:L(a.p,b.p),r:L(a.r,b.r),s:L(a.s,b.s)};}return null;}
function setFrame(f){S.frame=Math.round(f);objs().forEach(o=>{const k=evalKeys(o,S.frame);if(k){o.position.fromArray(k.p);o.rotation.set(k.r[0],k.r[1],k.r[2]);o.scale.fromArray(k.s);}});drawTimeline();refreshValues();const fi=$('#frameCur');if(fi)fi._show();}

let bound=[];
function fmt(v,prec,unit){if(typeof v!=='number'||!isFinite(v))return'—';return (Math.abs(v)<1e-9?0:v).toFixed(prec)+(unit||'');}
function numField(label,get,set,o={}){const step=o.step??0.01,prec=o.prec??3,unit=o.unit||'';const el=h('div','nf',`<span class="l">${label}</span><span class="v"></span>`);const v=el.querySelector('.v');
  const show=()=>{if(el.querySelector('input'))return;v.textContent=fmt(get(),prec,unit);if(o.state){const st=o.state();el.classList.toggle('key',st==='key');el.classList.toggle('anim',st==='anim');}};
  el._show=show;bound.push(el);show();
  let sx=0,sv=0,moved=false,down=false;
  el.addEventListener('pointerdown',e=>{if(e.target.tagName==='INPUT')return;down=true;moved=false;sx=e.clientX;sv=get();el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>3)moved=true;if(moved){let val=sv+dx*step*(e.shiftKey?0.1:1);if(e.ctrlKey)val=Math.round(val/(step*10))*step*10;if(o.min!=null)val=Math.max(o.min,val);if(o.max!=null)val=Math.min(o.max,val);if(o.int)val=Math.round(val);set(val);show();refreshValues();}});
  el.addEventListener('pointerup',e=>{if(!down)return;down=false;if(moved){pushUndo();return;}
    const inp=h('input');inp.value=+get().toFixed(prec);el.appendChild(inp);inp.focus();inp.select();
    const done=ok=>{if(!inp.parentNode)return;if(ok){const s=inp.value.replace(',','.');if(/^[\d+\-*/().\s]+$/.test(s)){try{let val=Function('return ('+s+')')();if(isFinite(val)){if(o.min!=null)val=Math.max(o.min,val);if(o.max!=null)val=Math.min(o.max,val);if(o.int)val=Math.round(val);set(val);pushUndo();}}catch(_){}}}inp.remove();show();refreshValues();};
    inp.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Enter')done(true);if(ev.key==='Escape')done(false);});inp.addEventListener('blur',()=>done(true));});
  return el;}
function row(label,ctrl){const r=h('div','row');r.appendChild(h('label','',label));r.appendChild(ctrl);return r;}
function trio(labels,getters,setters,o){const t=h('div','trio');labels.forEach((l,i)=>t.appendChild(numField(l,getters[i],setters[i],o&&o[i]?o[i]:o)));return t;}
function colorField(get,set){const i=h('input','colorf');i.type='color';i.value=get();i.addEventListener('input',()=>set(i.value));i.addEventListener('change',()=>pushUndo());return i;}
function check(label,get,set){const l=h('label','chk');const i=h('input');i.type='checkbox';i.checked=get();i.addEventListener('change',()=>{set(i.checked);pushUndo();});l.append(i,document.createTextNode(label));return l;}
function button(label,f,cls){const b=h('button','btn'+(cls?' '+cls:''),label);b.addEventListener('click',f);return b;}
function section(title,build,closed){const s=h('div','sec'+(closed?' closed':''));const hd=h('div','sech',title);hd.addEventListener('click',()=>s.classList.toggle('closed'));const b=h('div','secb');build(b);s.append(hd,b);return s;}

function keyState(o,comp){const K=o.userData.keys||{};if(!Object.keys(K).length)return null;return K[S.frame]?'key':'anim';}
function transformBlock(o,b){const kf=()=>keyState(o);
  b.appendChild(row('Ubicación',trio(['X','Y','Z'],[0,1,2].map(i=>()=>o.position.getComponent(i)),[0,1,2].map(i=>v=>o.position.setComponent(i,v)),{step:.02,prec:3,unit:' m',state:kf})));
  b.appendChild(row('Rotación',trio(['X','Y','Z'],['x','y','z'].map(a=>()=>o.rotation[a]*R2D),['x','y','z'].map(a=>v=>o.rotation[a]=v*D2R),{step:.5,prec:1,unit:'°',state:kf})));
  b.appendChild(row('Escala',trio(['X','Y','Z'],[0,1,2].map(i=>()=>o.scale.getComponent(i)),[0,1,2].map(i=>v=>o.scale.setComponent(i,v)),{step:.01,prec:3,state:kf})));
  if(o.userData.kind==='MESH'){const dim=i=>{o.geometry.computeBoundingBox();const s=new THREE.Vector3();o.geometry.boundingBox.getSize(s);return s.getComponent(i)*Math.abs(o.scale.getComponent(i));};
    b.appendChild(row('Dimensiones',trio(['X','Y','Z'],[0,1,2].map(i=>()=>dim(i)),[0,1,2].map(i=>v=>{const cur=dim(i)/Math.abs(o.scale.getComponent(i)||1);if(cur>1e-9)o.scale.setComponent(i,v/cur);}),{step:.02,prec:3,unit:' m'})));}}

function buildOutliner(){const l=$('#olist');const q=$('#ofilter').value.toLowerCase();l.innerHTML='';
  const coll=h('div','orow collrow','▾ <svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="3" width="10" height="8" rx="1" fill="none" stroke="#ccc"/></svg> Colección de escena');l.appendChild(coll);
  objs().filter(o=>o.name.toLowerCase().includes(q)).forEach(o=>{const r=h('div','orow'+(S.sel.has(o)?' sel':'')+(S.active===o?' act':'')+(o.visible?'':' hid'));r.style.paddingLeft='28px';
    r.innerHTML=OL_ICON[o.userData.kind]+`<span class="nm">${esc(o.name)}</span>`+(S.sceneCam===o?'<span title="Cámara activa" style="color:#9fc1e6">●</span>':'')+(Object.keys(o.userData.keys||{}).length?'<span title="Animado" style="color:#d9c36a">◆</span>':'');
    const eye=h('button','eye',o.visible?'👁':'<span style="opacity:.4">👁</span>');eye.title='Mostrar/ocultar en la vista (H)';
    eye.addEventListener('click',e=>{e.stopPropagation();o.visible=!o.visible;if(!o.visible){S.sel.delete(o);}updateAllSel();pushUndo();refreshUI();});r.appendChild(eye);
    r.addEventListener('click',e=>{if(S.mode==='EDIT')setMode('OBJECT');if(e.shiftKey||e.ctrlKey)selectObj(o,true);else selectObj(o,false);});
    r.addEventListener('dblclick',()=>{const nm=r.querySelector('.nm');const inp=h('input');inp.value=o.name;nm.innerHTML='';nm.appendChild(inp);inp.focus();inp.select();
      const fin=()=>{const v=inp.value.trim();if(v&&v!==o.name){o.name='';o.name=uniqueName(v);pushUndo();ev('rename',o.name);}refreshUI();};inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')fin();if(e.key==='Escape')refreshUI();});inp.addEventListener('blur',fin);});
    l.appendChild(r);});}
$('#ofilter').addEventListener('input',buildOutliner);$('#ofilter').addEventListener('keydown',e=>e.stopPropagation());
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

      const ap=h('button','','✓');ap.title='Aplicar';ap.onclick=()=>{const mods=o.userData.mods;o.userData.mods=[m];const g=evaluate(o);o.userData.mods=mods.filter(x=>x!==m);o.userData.base=posOnly(g);rebuild(o);pushUndo();buildProps();toast('Modificador aplicado');};

      if(m.type==='MIRROR'){const ax=h('div','axes3');['X','Y','Z'].forEach((l,k)=>{const b=h('button',m.axes[k]?'on':'',l);b.onclick=()=>{m.axes[k]=!m.axes[k];rebuildMods(o);pushUndo();buildProps();};ax.appendChild(b);});bd.appendChild(row('Eje',ax));}

        bd.appendChild(row('',check('Fusionar',()=>m.merge,v=>{m.merge=v;rebuildMods(o);})));}

      box.append(hd,bd);pb.appendChild(box);});}
  else if(S.ptab==='data'){const k=o.userData.kind;title(PT_ICON.data,o.name);

      b.appendChild(row('Color',colorField(()=>L.color,v=>{L.color=v;o._light.color.set(v);})));

      if(L.type!=='SUN')b.appendChild(row('Alcance',numField('',()=>L.dist,v=>{L.dist=v;o._light.distance=v;},{step:.05,prec:2,min:0,unit:' m'})));
      if(L.type==='SPOT')b.appendChild(row('Ángulo',numField('',()=>L.angle,v=>{L.angle=v;buildLight(o);},{step:.3,prec:1,min:1,max:179,unit:'°'})));
      b.appendChild(h('div','',`<div style="color:var(--dim);margin-top:6px">Las luces se ven en las vistas Material y Renderizado.</div>`));}));}

    pb.appendChild(section('Ajustes rápidos',b=>{const pres=[['Plástico','#d24a3c',0,.4],['Metal','#c9c9c9',1,.25],['Oro','#e0b44a',1,.2],['Goma','#2a2a2a',0,.9],['Vidrio','#bfe3ff',0,.05]];

function rebuildMods(o){if(S.mode==='EDIT'&&o===S.active)return;rebuild(o);}
function camsLens(){objs().forEach(o=>{if(o.userData.kind==='CAMERA')updateCamLens(o);});}
function buildN(){const n=$('#npanel');if(!n.classList.contains('on'))return;n.innerHTML='';const o=S.active;
  const hd=h('div','ptitle','<span>Elemento</span>');n.appendChild(hd);
  if(S.mode==='EDIT'&&o){n.appendChild(section('Vértice (mediana)',b=>{const c=()=>{if(!S.editSel.size)return null;const p=o.userData.base.attributes.position;const v=new THREE.Vector3();S.editSel.forEach(i=>v.add(V(p.getX(i),p.getY(i),p.getZ(i))));return v.divideScalar(S.editSel.size);};
    b.appendChild(trio(['X','Y','Z'],[0,1,2].map(k=>()=>{const v=c();return v?v.getComponent(k):NaN;}),[0,1,2].map(k=>val=>{const v=c();if(!v)return;const d=val-v.getComponent(k);const p=o.userData.base.attributes.position;S.editSel.forEach(i=>{const arr_=[p.getX(i),p.getY(i),p.getZ(i)];arr_[k]+=d;p.setXYZ(i,...arr_);});refreshEdit(false);}),{step:.02,prec:4,unit:' m'}));}));}
  else if(o)n.appendChild(section('Transformación',b=>transformBlock(o,b)));
  else n.appendChild(h('div','empty','Nada seleccionado'));
  n.appendChild(section('Vista',b=>{b.appendChild(row('Distancia focal',numField('',()=>18/Math.tan(perspCam.fov*D2R/2),v=>{perspCam.fov=2*Math.atan(18/v)*R2D;perspCam.updateProjectionMatrix();},{step:.2,prec:0,min:5,max:300,unit:' mm'})));
    b.appendChild(row('Cursor 3D',trio(['X','Y','Z'],[0,1,2].map(k=>()=>S.cursor.getComponent(k)),[0,1,2].map(k=>v=>S.cursor.setComponent(k,v)),{step:.02,prec:3,unit:' m'})));},true));}

function buildInfo(){const o=S.active;$('#vpinfo').innerHTML=`${S.camView?'Vista de cámara':S.ortho?'Ortográfica':'Perspectiva de usuario'}<br>(${S.frame}) Colección de escena${o?' | '+esc(o.name):''}`;}

function setStatusDefault(){if(modal)return;const e=S.mode==='EDIT';
  setStatus(`<span><span class="kb">Clic</span>Seleccionar</span><span><span class="kb">Rueda</span>/<span class="kb">Alt+Clic</span>Orbitar</span><span><span class="kb">Shift</span>+rueda Desplazar</span><span><span class="kb">Clic der.</span>Menú contextual</span>${e?'<span><span class="kb">E</span>Extruir</span>':'<span><span class="kb">Shift A</span>Añadir</span>'}<span><span class="kb">F3</span>Buscar</span>`);}

  return `Objetos ${S.sel.size}/${objs().length} | Triángulos ${Math.round(t).toLocaleString('es')} | Vértice 3D`;}

// ================= TIMELINE =================
const tlc=$('#tlcanvas');const tlx=tlc.getContext('2d');
function buildTlHead(){const hd=$('#tlhead');hd.innerHTML='';
  hd.appendChild(h('span','','<span style="color:var(--dim);margin-right:6px">Línea de tiempo</span>'));
  const seg=h('div','seg');const B=(t,f,ti,id)=>{const b=h('button','',t);b.title=ti;if(id)b.id=id;b.onclick=f;seg.appendChild(b);};
  B('⏮',()=>setFrame(S.start),'Ir al inicio (Shift ←)');B('◀◀',()=>jumpKey(-1),'Fotograma clave anterior (↓)');B('▶',()=>togglePlay(),'Reproducir (Espacio)','playBtn');B('▶▶',()=>jumpKey(1),'Fotograma clave siguiente (↑)');B('⏭',()=>setFrame(S.end),'Ir al final (Shift →)');hd.appendChild(seg);
  const cur=numField('',()=>S.frame,v=>setFrame(v),{step:.2,prec:0,int:true});cur.id='frameCur';cur.style.width='70px';cur.style.marginLeft='10px';hd.appendChild(cur);
  const sp=h('div','spacer');hd.appendChild(sp);
  const k=h('button','btn','◆ Insertar clave');k.style.width='auto';k.onclick=()=>insertKey();hd.appendChild(k);
  const st=numField('Inicio',()=>S.start,v=>{S.start=Math.min(v,S.end-1);drawTimeline();},{step:.2,prec:0,int:true,min:0});st.style.width='92px';st.style.marginLeft='8px';

function importObj(obj,yUp,fname){const wrap=new THREE.Group();wrap.add(obj);if(yUp)wrap.rotation.x=Math.PI/2;wrap.updateMatrixWorld(true);const neu=[];
  obj.traverse(m=>{if(!m.isMesh)return;const g=m.geometry.clone();g.applyMatrix4(m.matrixWorld);const base=posOnly(g);base.computeBoundingBox();const c=new THREE.Vector3();base.boundingBox.getCenter(c);base.translate(-c.x,-c.y,-c.z);
    const o=makeMesh(base,uniqueName(m.name||'Importado'));o.position.copy(c);o.userData.smooth=true;const mm=Array.isArray(m.material)?m.material[0]:m.material;
    if(mm&&mm.color){o.userData.mat.color='#'+mm.color.getHexString();if(mm.metalness!=null)o.userData.mat.metal=mm.metalness;if(mm.roughness!=null)o.userData.mat.rough=mm.roughness;}applyMat(o);rebuild(o);applyShadingTo(o);root.add(o);neu.push(o);});

function buildExport(){const sc=new THREE.Scene();const holder=new THREE.Group();holder.name='Escena';holder.rotation.x=-Math.PI/2;sc.add(holder);const tracks=[];
  objs().forEach(o=>{if(!o.visible)return;let c;
    if(o.userData.kind==='MESH'){const g=evaluate(o);const mat=o._real.clone();mat.polygonOffset=false;c=new THREE.Mesh(g,mat);}
    else if(o.userData.kind==='EMPTY'){c=new THREE.Object3D();}
    else return;c.name=o.name.replace(/[^\w\-]/g,'_');c.position.copy(o.position);c.quaternion.copy(o.quaternion);c.scale.copy(o.scale);holder.add(c);
    const ks=Object.keys(o.userData.keys||{}).map(Number).sort((a,b)=>a-b);if(ks.length>1){const times=[],P=[],Q=[],Sc=[];
      for(let f=ks[0];f<=ks[ks.length-1];f++){const k=evalKeys(o,f);times.push((f-S.start)/S.fps);P.push(...k.p);Sc.push(...k.s);const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(k.r[0],k.r[1],k.r[2]));Q.push(q.x,q.y,q.z,q.w);}
      tracks.push(new THREE.VectorKeyframeTrack(c.name+'.position',times,P),new THREE.QuaternionKeyframeTrack(c.name+'.quaternion',times,Q),new THREE.VectorKeyframeTrack(c.name+'.scale',times,Sc));}});
  return {sc,anims:tracks.length?[new THREE.AnimationClip('Animacion',-1,tracks)]:[]};}
function exportGLB(){if(S.mode==='EDIT')setMode('OBJECT');const {sc,anims}=buildExport();if(!sc.children[0].children.length){toast('No hay mallas visibles para exportar');return;}
  new THREE.GLTFExporter().parse(sc,async res=>{const zip=new JSZip();zip.file('modelo.glb',res);const blob=await zip.generateAsync({type:'blob'});saveFile('modelo-glb.zip',blob);},{binary:true,animations:anims,onlyVisible:true});}
async function exportOBJ(){if(S.mode==='EDIT')setMode('OBJECT');const {sc}=buildExport();sc.updateMatrixWorld(true);const txt=new THREE.OBJExporter().parse(sc);const zip=new JSZip();zip.file('modelo.obj',txt);saveFile('modelo-obj.zip',await zip.generateAsync({type:'blob'}));}

// ================= RENDER IMAGE =================
let rRenderer=null,lastRender=null;
function renderImage(){if(S.mode==='EDIT')setMode('OBJECT');const cam=S.sceneCam||objs().find(o=>o.userData.kind==='CAMERA');if(!cam){toast('Añade una cámara (Shift A ▸ Cámara) para renderizar');return;}
  const scale=Math.min(1,2048/Math.max(S.render.w,S.render.h));const W=Math.round(S.render.w*scale),H=Math.round(S.render.h*scale);
  if(!rRenderer){rRenderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});rRenderer.shadowMap.enabled=true;rRenderer.shadowMap.type=THREE.PCFSoftShadowMap;rRenderer.outputEncoding=THREE.sRGBEncoding;}
  rRenderer.setSize(W,H,false);const prevSh=S.shading,prevOv=S.overlays;S.shading='RENDERED';S.overlays=false;applyShading();tc.visible=false;
  const hidden=[];objs().forEach(o=>{if(o._draw&&o._draw.visible){o._draw.visible=false;hidden.push(o._draw);}});
  updateCamLens(cam);cam.updateMatrixWorld(true);rRenderer.render(scene,cam._cam);const url=rRenderer.domElement.toDataURL('image/png');
  hidden.forEach(x=>x.visible=true);S.shading=prevSh;S.overlays=prevOv;applyShading();updateGizmo();
  $('#rimg').src=url;lastRender=url;$('#renderwin').style.display='grid';}
$('#rclose').onclick=()=>$('#renderwin').style.display='none';
$('#rsave').onclick=async()=>{if(!lastRender)return;const b=await (await fetch(lastRender)).blob();saveFile('render.png',b);};

// ================= MISC =================
let toastT=0;function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',2200);}
function showShortcuts(){const list=[['Clic izq.','Seleccionar (Shift: añadir)'],['Rueda pulsada / Alt+clic','Orbitar'],['Shift + rueda pulsada','Desplazar'],['Rueda','Zoom'],['G / R / S','Mover / Rotar / Escalar (luego X, Y, Z o un número)'],['Shift A','Añadir objeto'],['X / Supr','Eliminar'],['Shift D','Duplicar'],['Tab','Modo edición'],['E','Extruir (edición)'],['A / Alt A','Seleccionar todo / nada'],['H / Alt H','Ocultar / mostrar'],['Z','Menú de sombreado'],['N / T','Barra lateral / herramientas'],['1 3 7 5 0','Vistas frontal, derecha, superior, orto, cámara'],['I / Alt I','Insertar / borrar fotograma clave'],['Espacio','Reproducir'],['F3','Buscar comando'],['F12','Renderizar'],['Ctrl Z','Deshacer'],['Ctrl S','Guardar proyecto'],['Shift + clic der.','Colocar cursor 3D']];
  showMenu(list.map(([k,d])=>({l:d,k,dis:false,f:()=>{}})),innerWidth/2-170,80,'Atajos de teclado');}
function resize(){const {w,h}=vpSize();if(!w||!h)return;renderer.setSize(w,h,false);perspCam.aspect=w/h;perspCam.updateProjectionMatrix();
  if(orthoCam.userData.base){const hh=orthoCam.userData.base;orthoCam.top=hh;orthoCam.bottom=-hh;orthoCam.left=-hh*w/h;orthoCam.right=hh*w/h;orthoCam.updateProjectionMatrix();}drawTimeline();}
new ResizeObserver(resize).observe(vpbody);new ResizeObserver(drawTimeline).observe($('#tlwrap'));

function defaultScene(){tc.detach();while(root.children.length)root.remove(root.children[0]);S.sel.clear();S.active=null;S.sceneCam=null;S.frame=1;S.cursor.set(0,0,0);
  const cube=makeMesh(prim('cube'),'Cubo');root.add(cube);applyShadingTo(cube);
  const L=makeLight('POINT','Luz');L.position.set(4.1,1,5.9);root.add(L);buildLight(L);
  const C=makeCamera('Cámara');C.position.set(7.36,-6.93,4.96);C.rotation.set(63.6*D2R,0,46.7*D2R);root.add(C);S.sceneCam=C;
  S.sel.add(cube);S.active=cube;updateAllSel();applyShading();refreshUI();}

// ================= LOOP =================
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=(now-last)/1000;last=now;
  if(S.playing){S._acc=(S._acc||0)+dt*S.fps;if(S._acc>=1){const n=Math.floor(S._acc);S._acc-=n;let f=S.frame+n;if(f>S.end)f=S.start;setFrame(f);}}
  const cam=renderCam();
  if(S.camView&&S.sceneCam){const {w,h}=vpSize();S.sceneCam._cam.aspect=w/h;S.sceneCam._cam.updateProjectionMatrix();}
  tc.camera=cam;
  stDir.position.copy(viewCam.position).add(V(2,-1,3));stDir.target.position.copy(controls.target);
  cursor3d.position.copy(S.cursor);const d=cam.position.distanceTo(S.cursor);const sc=S.ortho?1/orthoCam.zoom*orthoCam.userData.base/8:d/12;cursor3d.scale.setScalar(Math.max(sc,.05));cursor3d.quaternion.copy(cam.quaternion);
  renderer.render(scene,cam);drawNav();
  if(S.camView)buildInfoOnce();}
let infoShown=false;function buildInfoOnce(){if(!infoShown){infoShown=true;buildInfo();setTimeout(()=>infoShown=false,500);}}

// ================= INIT =================
buildToolbar();buildWorkspaces();buildTlHead();
defaultScene();pushUndo();resize();
requestAnimationFrame(loop);
setTimeout(()=>toast('Pulsa Shift A para añadir objetos · F3 para buscar cualquier comando'),600);
getDl();
</script>
<script>
"use strict";
// ================= CURSO =================
// envolver funciones para registrar acciones
(function(){
  const wrap=(name,before,after)=>{const f=window[name]||eval(name);const w=function(...a){const pre=before?before(...a):undefined;const r=f.apply(this,a);if(after)after(pre,...a);return r;};eval(name+'=w');};
  wrap('viewAxis',k=>ev('view',k));
  wrap('toggleOrtho',null,()=>ev('ortho'));
  wrap('orbitStep',null,()=>ev('orbit'));
  wrap('endModal',ok=>{if(ok&&modal)return {type:modal.type,axis:modal.axis,num:modal.num,mode:S.mode,extr:modal.extr};},pre=>{if(pre)ev('transform',pre);});
  wrap('addPrim',t=>ev('add',t));wrap('addLight',t=>ev('add',t));wrap('addCamera',()=>ev('add','camera'));
  wrap('setMode',null,()=>ev('mode',S.mode));
  wrap('deleteSel',()=>ev('delete'));wrap('duplicateSel',()=>ev('duplicate'));
  wrap('opExtrude',()=>ev('extrude'));wrap('insertKey',null,()=>ev('key',S.frame));
  wrap('togglePlay',null,()=>{if(S.playing)ev('play');});
  wrap('exportGLB',()=>ev('export'));wrap('exportOBJ',()=>ev('export'));wrap('renderImage',()=>ev('render'));
  wrap('undo',()=>ev('undo'));wrap('setSmooth',v=>ev('smooth',v));wrap('hideSel',()=>ev('hide'));wrap('unhideAll',()=>ev('unhide'));
  wrap('frameObjects',()=>ev('frame'));wrap('saveProject',()=>ev('save'));
})();

const O=n=>objs().find(o=>o.name===n);
const P=p=>objs().filter(o=>o.name.toLowerCase().startsWith(p.toLowerCase())&&o.userData.kind==='MESH');
const meshes=()=>objs().filter(o=>o.userData.kind==='MESH');
const near=(a,b,t)=>Math.abs(a-b)<=t;
const K=t=>`<span class="kb">${t}</span>`;
const pair=(list,test)=>list.some(a=>a.position.x>0.05&&test(a))&&list.some(b=>b.position.x<-0.05&&test(b));
function hasKey(o,f){return o&&o.userData.keys&&o.userData.keys[f];}
function emptyScene(){if(S.mode==='EDIT')setMode('OBJECT',true);defaultScene();objs().filter(o=>o.userData.kind==='MESH').forEach(o=>root.remove(o));S.sel.clear();S.active=null;updateAllSel();pushUndo();refreshUI();setFrame(1);}
function cubeScene(){if(S.mode==='EDIT')setMode('OBJECT',true);defaultScene();S.shading='SOLID';applyShading();pushUndo();setFrame(1);}

const COURSE=[
{title:'Bienvenida: qué es modelar',prep:null,
 intro:`Modelar es construir objetos 3D a partir de <b>mallas</b>. Una malla está hecha de <b>vértices</b> (puntos), <b>aristas</b> (líneas entre puntos) y <b>caras</b> (las superficies). Los personajes de casi todos los videojuegos son mallas.<br><br>Empezaremos con lo básico (moverte, seleccionar, transformar) y terminaremos con un <b>personaje propio, animado caminando y exportado</b> para tu juego. Cada paso se marca solo cuando lo haces.`,
 steps:[{t:'Lee la introducción y pulsa <b>Entendido</b>.',manual:'Entendido'}]},
{title:'1 · Moverte por la escena',prep:cubeScene,
 intro:`Antes de modelar tienes que poder mirar el objeto desde cualquier ángulo. En 3D usarás estos movimientos todo el rato.`,
 steps:[
  {t:`<b>Orbita</b>: mantén pulsada la rueda del ratón y arrastra. Sin rueda: ${K('Alt')} + clic izquierdo, o arrastra el círculo de ejes de arriba a la derecha.`,done:c=>c.since('orbit')},
  {t:`<b>Zoom</b>: gira la rueda del ratón (o arrastra el botón 🔍).`,done:c=>c.since('zoom')},
  {t:`<b>Desplaza</b> la vista: ${K('Shift')} + rueda pulsada y arrastra (o arrastra el botón ✋).`,done:c=>c.since('pan')},
  {t:`Pulsa ${K('1')} para la vista <b>frontal</b>.`,done:c=>c.since('view',k=>k==='front')},
  {t:`Pulsa ${K('3')} para la vista <b>derecha</b> y ${K('7')} para la vista <b>superior</b>.`,done:c=>c.since('view',k=>k==='top')&&c.since('view',k=>k==='right')},
  {t:`Pulsa ${K('5')} para cambiar a vista <b>ortográfica</b> (sin perspectiva, ideal para medir).`,done:()=>S.ortho},
  {t:`Pulsa ${K('5')} otra vez para volver a perspectiva.`,done:()=>!S.ortho},
  {t:`Pulsa ${K('Inicio')} (Home) para encuadrar toda la escena. Si te pierdes, este es tu botón de rescate.`,done:c=>c.since('frame')}]},
{title:'2 · Seleccionar y transformar',prep:cubeScene,
 intro:`Las tres operaciones básicas son <b>mover (G)</b>, <b>rotar (R)</b> y <b>escalar (S)</b>. Se pulsa la tecla, se mueve el ratón y se confirma con clic. Para cancelar: ${K('Esc')} o clic derecho.<br><br>Truco profesional: después de la tecla puedes pulsar un eje (${K('X')} ${K('Y')} ${K('Z')}) y escribir un número exacto.`,
 steps:[
  {t:`Haz <b>clic en el cubo</b> para seleccionarlo (se ve el contorno naranja).`,done:()=>S.active&&S.active.userData.kind==='MESH'&&S.sel.has(S.active)},
  {t:`Pulsa ${K('G')}, mueve el ratón y haz <b>clic</b> para confirmar.`,done:c=>c.since('transform',d=>d.type==='G')},
  {t:`Pulsa ${K('G')} y luego ${K('Z')}: ahora solo se mueve en vertical (eje Z azul). Confirma con clic.`,done:c=>c.since('transform',d=>d.type==='G'&&d.axis===2)},
  {t:`Rota exacto: pulsa ${K('R')} ${K('Z')}, escribe <b>45</b> y pulsa ${K('Intro')}.`,done:c=>c.since('transform',d=>d.type==='R'&&d.axis===2&&near(parseFloat(d.num),45,0.01))},
  {t:`Escala: pulsa ${K('S')}, escribe <b>0.5</b> y ${K('Intro')}. El cubo queda a la mitad.`,done:c=>c.since('transform',d=>d.type==='S'&&parseFloat(d.num)<1)},
  {t:`Deshaz el último cambio con ${K('Ctrl')} + ${K('Z')}.`,done:c=>c.since('undo')},
  {t:`También hay gizmos con flechas: elige <b>Mover</b> en la barra de herramientas de la izquierda y arrastra una flecha de color.`,done:c=>c.since('transform',d=>d.gizmo)},
  {t:`Vuelve a la herramienta <b>Seleccionar</b> (la flecha de arriba, o ${K('W')}). Las teclas G, R, S son más rápidas y las usaremos siempre.`,done:()=>S.tool==='select'}]},
{title:'3 · Añadir, duplicar y organizar',prep:cubeScene,
 intro:`Los objetos nuevos aparecen en el <b>cursor 3D</b> (el círculo rojo y blanco). En el panel <b>Esquema</b> (arriba a la derecha) ves todos los objetos. Ponerles buen nombre es clave en un videojuego: el motor los reconocerá por su nombre.`,
 steps:[
  {t:`Con el ratón sobre la vista 3D, pulsa ${K('Shift')} + ${K('A')} ▸ Malla ▸ <b>Esfera UV</b>.`,done:c=>c.since('add',t=>t==='uvsphere')},
  {t:`Muévela a un lado: ${K('G')} ${K('X')} <b>3</b> ${K('Intro')}.`,done:c=>c.since('transform',d=>d.type==='G'&&d.axis===0)},
  {t:`Duplícala con ${K('Shift')} + ${K('D')}, mueve la copia y haz clic para soltarla.`,done:c=>c.since('duplicate')&&c.since('transform',d=>d.type==='G')},
  {t:`Cambia el nombre: haz <b>doble clic</b> en el nombre de la esfera en el Esquema, escribe <b>Pelota</b> e ${K('Intro')}.`,done:c=>c.since('rename')},
  {t:`Selecciona la otra esfera y bórrala con ${K('X')}.`,done:c=>c.since('delete')},
  {t:`Oculta la Pelota con ${K('H')} y vuelve a mostrarla con ${K('Alt')} + ${K('H')}. Útil cuando una pieza te tapa otra.`,done:c=>c.since('hide')&&c.since('unhide')}]},
{title:'4 · Modo edición: tocar los vértices',prep:cubeScene,
 intro:`Hasta ahora movíamos objetos enteros. En <b>modo edición</b> cambias la forma moviendo sus vértices. Así se modela de verdad.<br><br><b>Extruir</b> (${K('E')}) es la herramienta estrella: saca geometría nueva de una cara, como estirar plastilina. Con ella se crean brazos, piernas, dedos…`,
 steps:[
  {t:`Selecciona el cubo y pulsa ${K('Tab')} para entrar en modo edición. Verás los vértices como puntos.`,done:()=>S.mode==='EDIT'},
  {t:`Haz <b>clic en un vértice</b> (se vuelve naranja).`,done:()=>S.mode==='EDIT'&&S.editSel.size>=1},
  {t:`Muévelo con ${K('G')} y confirma con clic. Has deformado el cubo.`,done:c=>c.since('transform',d=>d.type==='G'&&d.mode==='EDIT')},
  {t:`Deshaz con ${K('Ctrl')}+${K('Z')}, vuelve a entrar con ${K('Tab')} si hace falta, y pulsa ${K('Alt')} + ${K('A')} para no tener nada seleccionado.`,done:()=>S.mode==='EDIT'&&S.editSel.size===0},
  {t:`Pulsa ${K('1')} (vista frontal) y ${K('Alt')} + ${K('Z')} para activar <b>rayos X</b> (así se seleccionan también los vértices de detrás).`,done:()=>S.xray&&S.mode==='EDIT'},
  {t:`Arrastra un <b>rectángulo</b> alrededor de la fila de vértices de <b>arriba</b> del cubo. Deben quedar 4 seleccionados (mira la barra de estado abajo).`,done:()=>S.mode==='EDIT'&&S.editSel.size>=4},
  {t:`Pulsa ${K('E')} para extruir, luego ${K('Z')}, escribe <b>1</b> e ${K('Intro')}. ¡El cubo ha crecido hacia arriba con caras nuevas!`,done:c=>c.since('extrude')&&c.since('transform',d=>d.mode==='EDIT')},
  {t:`Con esos vértices aún seleccionados, pulsa ${K('S')}, escribe <b>0.5</b> e ${K('Intro')}: la parte de arriba se estrecha.`,done:c=>c.since('transform',d=>d.type==='S'&&d.mode==='EDIT')},
  {t:`Desactiva los rayos X (${K('Alt')}+${K('Z')}) y sal del modo edición con ${K('Tab')}.`,done:()=>S.mode==='OBJECT'&&!S.xray}]},
{title:'5 · Modificadores: formas suaves sin esfuerzo',prep:cubeScene,
 intro:`Un <b>modificador</b> cambia la forma sin destruir la malla original: lo puedes apagar o quitar cuando quieras. El más usado en personajes es <b>Subdivisión</b>, que redondea los bloques. Otro muy útil es <b>Espejo</b>: modelas una mitad y la otra se copia sola.`,
 steps:[
  {t:`Selecciona el cubo y abre la pestaña de <b>Modificadores</b> (la llave azul, en el panel de la derecha).`,done:()=>S.ptab==='modifiers'},
  {t:`En <b>Añadir modificador…</b> elige <b>Subdivisión de superficie</b>.`,done:c=>c.since('modifier',t=>t==='SUBSURF')},
  {t:`Sube <b>Niveles</b> a 2: haz clic en el número, escribe 2 e ${K('Intro')} (o arrástralo).`,done:()=>S.active&&S.active.userData.mods.some(m=>m.type==='SUBSURF'&&m.levels>=2)},
  {t:`Clic derecho en la vista ▸ <b>Sombreado suave</b>. Adiós a las caras marcadas.`,done:c=>c.since('smooth',v=>v===true)},
  {t:`Prueba otro: añade <b>Matriz</b> y pon <b>Cantidad</b> en 4. Copias en fila automáticas.`,done:()=>S.active&&S.active.userData.mods.some(m=>m.type==='ARRAY'&&m.count>=4)},
  {t:`Quita la Matriz con su botón <b>✕</b>. La malla original sigue intacta.`,done:()=>S.active&&!S.active.userData.mods.some(m=>m.type==='ARRAY')}]},
{title:'6 · Materiales, luz y render',prep:cubeScene,
 intro:`El <b>material</b> decide el color y cómo refleja la luz: <b>Metálico</b> (0 = plástico, 1 = metal) y <b>Rugosidad</b> (0 = espejo, 1 = mate). Para verlo necesitas el modo de vista <b>Material</b>.`,
 steps:[
  {t:`Pulsa ${K('Z')} con el ratón sobre la vista y elige <b>Vista material</b> (o el tercer botón de esfera arriba a la derecha).`,done:()=>S.shading==='MATERIAL'||S.shading==='RENDERED'},
  {t:`Selecciona el cubo, abre la pestaña <b>Material</b> (esfera roja) y cambia el <b>Color base</b>.`,done:()=>S.active&&S.active.userData.kind==='MESH'&&S.active.userData.mat.color.toLowerCase()!=='#cccccc'},
  {t:`Pulsa el ajuste rápido <b>Oro</b> o <b>Metal</b>.`,done:()=>S.active&&S.active.userData.mat&&S.active.userData.mat.metal>0.5},
  {t:`Añade un sol: ${K('Shift')}+${K('A')} ▸ Luz ▸ <b>Sol</b>. Rótalo con ${K('R')} para cambiar la dirección de las sombras.`,done:c=>c.since('add',t=>t==='SUN')},
  {t:`Pulsa ${K('F12')} para hacer un <b>render</b> desde la cámara. Ciérralo con ${K('Esc')}.`,done:c=>c.since('render')}]},
{title:'7 · Proyecto: tu primer personaje',prep:emptyScene,prepLabel:'Preparar escena vacía',
 intro:`Vamos a crear un personaje <b>chibi</b> (cabeza grande, cuerpo pequeño), un estilo muy usado en juegos porque se lee bien desde lejos. Medirá unos 3,2 m y estará hecho de piezas con nombre, perfectas para animar.<br><br>Escribe los números exactamente como se indican. Si algo sale raro: ${K('Ctrl')}+${K('Z')}.`,
 steps:[
  {t:`Pulsa <b>Preparar escena vacía</b> (arriba) o borra todas las mallas con ${K('X')}. La cámara y la luz se quedan.`,done:()=>meshes().length===0},
  {t:`<b>Torso</b>: ${K('Shift')}+${K('A')} ▸ Malla ▸ Cubo. Doble clic en su nombre en el Esquema y llámalo <b>Torso</b>.`,done:()=>O('Torso')&&O('Torso').userData.kind==='MESH'},
  {t:`Dale tamaño: ${K('S')} <b>0.5</b> ${K('Intro')}, después ${K('S')} ${K('Z')} <b>1.2</b> ${K('Intro')}, y súbelo: ${K('G')} ${K('Z')} <b>1.4</b> ${K('Intro')}.`,done:()=>{const t=O('Torso');return t&&t.scale.z>t.scale.x*1.1&&t.position.z>1.1&&t.position.z<1.7;}},
  {t:`Forma de cuerpo: ${K('Tab')}, ${K('1')}, ${K('Alt')}+${K('Z')}. Selecciona con un rectángulo la fila de vértices de <b>abajo</b>, ${K('S')} <b>0.75</b> ${K('Intro')}. Desactiva rayos X y sal con ${K('Tab')}.`,done:c=>c.since('transform',d=>d.type==='S'&&d.mode==='EDIT')&&S.mode==='OBJECT'},
  {t:`Redondéalo: con el Torso seleccionado añade el modificador <b>Subdivisión</b> (pestaña llave) y haz clic derecho ▸ <b>Sombreado suave</b>.`,done:()=>{const t=O('Torso');return t&&t.userData.mods.some(m=>m.type==='SUBSURF')&&t.userData.smooth;}},
  {t:`<b>Cabeza</b>: ${K('Shift')}+${K('A')} ▸ Esfera UV, llámala <b>Cabeza</b>, ${K('S')} <b>0.6</b> ${K('Intro')} y ${K('G')} ${K('Z')} <b>2.6</b> ${K('Intro')}.`,done:()=>{const h=O('Cabeza');return h&&h.position.z>2.2&&h.scale.x>0.4&&h.scale.x<0.8;}},
  {t:`<b>Ojo</b>: añade una Esfera UV, llámala <b>Ojo.L</b> y escribe: ${K('S')} <b>0.12</b> ${K('Intro')} · ${K('G')} ${K('X')} <b>0.22</b> ${K('Intro')} · ${K('G')} ${K('Y')} <b>-0.52</b> ${K('Intro')} · ${K('G')} ${K('Z')} <b>2.7</b> ${K('Intro')}.`,done:()=>P('Ojo').some(o=>o.position.y<-0.3&&o.position.z>2.4)},
  {t:`El otro ojo: con Ojo.L seleccionado, ${K('Shift')}+${K('D')}, ${K('X')}, <b>-0.44</b>, ${K('Intro')}. (Si quieres, renómbralo <b>Ojo.R</b>.)`,done:()=>pair(P('Ojo'),o=>o.position.z>2.4)},
  {t:`<b>Pierna</b>: añade un Cubo llamado <b>Pierna.L</b>: ${K('S')} <b>0.18</b> ${K('Intro')} · ${K('S')} ${K('Z')} <b>2.2</b> ${K('Intro')} · ${K('G')} ${K('X')} <b>0.25</b> ${K('Intro')} · ${K('G')} ${K('Z')} <b>0.4</b> ${K('Intro')}.`,done:()=>P('Pierna').some(o=>o.position.x>0.05&&o.position.z<0.7)},
  {t:`Segunda pierna: ${K('Shift')}+${K('D')}, ${K('X')}, <b>-0.5</b>, ${K('Intro')}. Renómbrala <b>Pierna.R</b>.`,done:()=>pair(P('Pierna'),o=>o.position.z<0.7)},
  {t:`<b>Brazo</b>: añade un Cilindro llamado <b>Brazo.L</b>: ${K('S')} <b>0.12</b> ${K('Intro')} · ${K('S')} ${K('Z')} <b>3</b> ${K('Intro')} · ${K('G')} ${K('X')} <b>0.65</b> ${K('Intro')} · ${K('G')} ${K('Z')} <b>1.45</b> ${K('Intro')}.`,done:()=>P('Brazo').some(o=>o.position.x>0.3&&o.position.z>1)},
  {t:`Segundo brazo: ${K('Shift')}+${K('D')}, ${K('X')}, <b>-1.3</b>, ${K('Intro')}. Renómbralo <b>Brazo.R</b>.`,done:()=>pair(P('Brazo'),o=>o.position.z>1)},
  {t:`<b>Colores</b>: pasa a Vista material (${K('Z')}). Da color al Torso (ropa), a la Cabeza (piel), a los ojos (ajuste <b>Goma</b>) y a piernas y brazos.`,done:()=>{const t=O('Torso'),h=O('Cabeza');return (S.shading==='MATERIAL'||S.shading==='RENDERED')&&t&&h&&t.userData.mat.color.toLowerCase()!=='#cccccc'&&h.userData.mat.color.toLowerCase()!=='#cccccc';}},
  {t:`Encuadra a tu personaje con ${K('Inicio')}, coloca la cámara: pulsa ${K('0')} para ver por ella, sal orbitando, busca un buen ángulo y usa Vista ▸ <b>Alinear cámara activa a la vista</b>. Después ${K('F12')}.`,done:c=>c.since('render')},
  {t:`Guarda tu trabajo: ${K('Ctrl')}+${K('S')}. Así podrás seguir otro día.`,done:c=>c.since('save')}]},
{title:'8 · Animación: hacer que camine',prep:null,
 intro:`Animar es guardar <b>poses</b> en distintos momentos (fotogramas clave, ${K('I')}) y el programa rellena el movimiento entre ellas. Un ciclo de caminar básico tiene 3 poses: pierna izquierda delante, pierna derecha delante, y otra vez la primera para que el bucle encaje.<br><br>Primero hay que poner el <b>origen</b> (el punto sobre el que gira cada pieza) en la cadera y en los hombros. Si no, las piernas girarían por la mitad.`,
 steps:[
  {t:`Pulsa ${K('N')} para abrir la barra lateral. En <b>Vista ▸ Cursor 3D</b> pon <b>Z = 0.8</b> (altura de la cadera) y X e Y a 0.`,done:()=>near(S.cursor.z,0.8,0.05)&&near(S.cursor.x,0,0.05)},
  {t:`Selecciona las dos piernas (clic en una, ${K('Shift')}+clic en la otra) ▸ clic derecho ▸ <b>Origen al cursor 3D</b>.`,done:()=>{const l=P('Pierna');return l.length>=2&&l.every(o=>near(o.position.z,0.8,0.06));}},
  {t:`Ahora los hombros: pon el cursor en <b>Z = 1.8</b>, selecciona los dos brazos ▸ clic derecho ▸ <b>Origen al cursor 3D</b>.`,done:()=>{const l=P('Brazo');return l.length>=2&&l.every(o=>near(o.position.z,1.8,0.06));}},
  {t:`<b>Pose 1</b>, en el fotograma 1 (${K('Shift')}+${K('←')}). Rota cada pieza con ${K('R')} ${K('X')} y un número: Pierna.L <b>25</b>, Pierna.R <b>-25</b>, Brazo.L <b>-25</b>, Brazo.R <b>25</b>. Luego selecciona las 4 piezas y pulsa ${K('I')}.`,done:()=>{const l=[...P('Pierna'),...P('Brazo')];return l.length>=4&&l.every(o=>hasKey(o,1))&&P('Pierna').some(o=>Math.abs(o.userData.keys[1].r[0])>0.2);}},
  {t:`<b>Pose 2</b>: escribe <b>13</b> en el campo de fotograma de la línea de tiempo. Rota al revés: Pierna.L <b>-50</b>, Pierna.R <b>50</b>, Brazo.L <b>50</b>, Brazo.R <b>-50</b>. Selecciona las 4 y ${K('I')}.`,done:()=>{const l=[...P('Pierna'),...P('Brazo')];return l.length>=4&&l.every(o=>hasKey(o,13));}},
  {t:`<b>Pose 3</b>: fotograma <b>25</b>, vuelve a rotar como en el paso anterior pero con el signo cambiado (Pierna.L <b>50</b>, Pierna.R <b>-50</b>, Brazo.L <b>-50</b>, Brazo.R <b>50</b>). Selecciona las 4 y ${K('I')}.`,done:()=>{const l=[...P('Pierna'),...P('Brazo')];return l.length>=4&&l.every(o=>hasKey(o,25));}},
  {t:`En la línea de tiempo pon <b>Fin = 24</b> para que el bucle sea perfecto y pulsa ${K('Espacio')}. ¡Tu personaje camina!`,done:c=>S.end<=25&&c.since('play')}]},
{title:'9 · Llevarlo a tu videojuego',prep:null,
 intro:`El formato estándar para juegos es <b>glTF binario (.glb)</b>: guarda mallas, colores y la animación juntos, y se convierte automáticamente al eje Y hacia arriba que usan los motores.<br><br>• <b>Godot</b>: arrastra el .glb a la carpeta del proyecto.<br>• <b>Unity</b>: con el paquete glTFast, arrastra el .glb a Assets.<br>• <b>Three.js</b> (como tus juegos en HTML): <code>GLTFLoader</code>, y la animación se reproduce con <code>AnimationMixer</code>.<br>• <b>Roblox Studio</b>: usa la exportación <b>.obj</b> desde el Importador 3D (la animación hay que rehacerla dentro de Roblox).`,
 steps:[
  {t:`Archivo ▸ Exportar ▸ <b>glTF 2.0 binario (.glb)</b>. Se descarga un .zip con <b>modelo.glb</b> dentro.`,done:c=>c.since('export')},
  {t:`Repasa: ¿qué harías distinto en tu próximo personaje? Prueba a darle orejas, un sombrero o una mochila con lo que ya sabes (cubos, esferas, extruir y subdivisión). Pulsa <b>Terminado</b> cuando quieras.`,manual:'Terminado'}]}
];

// ---------- estado del curso ----------
let C={m:0,s:0,open:true,min:false,start:0,flash:-1};
try{const sv=JSON.parse(localStorage.getItem('v3d-course')||'null');if(sv){C.m=Math.min(sv.m||0,COURSE.length-1);C.s=sv.s||0;C.open=sv.open!==false;}}catch(_){}
function saveC(){try{localStorage.setItem('v3d-course',JSON.stringify({m:C.m,s:C.s,open:C.open}));}catch(_){}}
const ctx={since:(t,pred)=>evLog.slice(C.start).some(e=>e.t===t&&(!pred||pred(e.d)))};
function curStep(){return COURSE[C.m].steps[C.s];}
window.courseTick=function(){if(!C.open)return;let changed=false,guard=0;
  while(guard++<20){const st=curStep();if(!st||st.manual)break;let ok=false;try{ok=st.done(ctx);}catch(_){ok=false;}if(!ok)break;advance(false);changed=true;}
  if(changed)renderCourse();};
function advance(render=true){C.flash=C.s;C.s++;C.start=evLog.length;saveC();if(C.s>=COURSE[C.m].steps.length)toast('¡Módulo completado!');if(render)renderCourse();}
function goModule(i){C.m=Math.max(0,Math.min(COURSE.length-1,i));C.s=0;C.start=evLog.length;saveC();renderCourse();}
function openCourse(){C.open=true;C.min=false;$('#course').style.display='block';saveC();renderCourse();}
const cEl=$('#course');
function renderCourse(){if(!C.open){cEl.style.display='none';return;}cEl.style.display='block';cEl.classList.toggle('min',C.min);
  const M=COURSE[C.m];const total=M.steps.length;const doneAll=C.s>=total;
  $('#cprog').textContent=`Módulo ${C.m}/${COURSE.length-1} · paso ${Math.min(C.s+1,total)}/${total}`;
  const b=$('#cbody');b.innerHTML='';
  const sel=h('select','tf');COURSE.forEach((m,i)=>{const o=h('option','',m.title);o.value=i;if(i===C.m)o.selected=true;sel.appendChild(o);});sel.addEventListener('change',()=>goModule(+sel.value));sel.addEventListener('keydown',e=>e.stopPropagation());b.appendChild(sel);
  const bar=h('div','cbar');const fillEl=h('div');fillEl.style.width=(Math.min(C.s,total)/total*100)+'%';bar.appendChild(fillEl);b.appendChild(bar);
  b.appendChild(h('div','cintro',M.intro));
  if(M.prep){const pb=button(M.prepLabel||'Preparar escena para este módulo',()=>{if(meshes().length&&!confirm('Esto reemplaza la escena actual. ¿Continuar?'))return;M.prep();C.start=evLog.length;window.courseTick();renderCourse();});pb.style.marginBottom='8px';b.appendChild(pb);}
  const ol=h('ol','csteps');M.steps.forEach((st,i)=>{const li=h('li',i<C.s?'done':i===C.s?'cur':'');if(i===C.flash)li.classList.add('flash');li.innerHTML=`<span class="cdot">${i<C.s?'✓':i+1}</span><div>${st.t}</div>`;
    if(i===C.s){const act=h('div','cact');if(st.manual){const mb=button(st.manual,()=>advance(),'blue');act.appendChild(mb);}else{const sk=h('button','clink','Saltar este paso');sk.onclick=()=>advance();act.appendChild(sk);}li.lastChild.appendChild(act);}
    ol.appendChild(li);});b.appendChild(ol);C.flash=-1;
  if(doneAll){const d=h('div','cdone',C.m<COURSE.length-1?'<b>¡Módulo completado!</b> Ya dominas esta parte.':'<b>¡Curso terminado!</b> Ya sabes crear, animar y exportar personajes. Ahora a practicar con diseños propios.');
    if(C.m<COURSE.length-1)d.appendChild(button('Siguiente módulo ▸',()=>goModule(C.m+1),'blue'));b.appendChild(d);
    const r=h('button','clink','Repetir este módulo');r.onclick=()=>goModule(C.m);b.appendChild(r);}
  const nav=h('div','cnav');const pv=h('button','clink','◂ Anterior');pv.onclick=()=>goModule(C.m-1);const nx=h('button','clink','Siguiente ▸');nx.onclick=()=>goModule(C.m+1);
  if(C.m>0)nav.appendChild(pv);nav.appendChild(h('span','spacer'));if(C.m<COURSE.length-1)nav.appendChild(nx);b.appendChild(nav);}
$('#cmin').onclick=()=>{C.min=!C.min;renderCourse();};
$('#cclose').onclick=()=>{C.open=false;saveC();renderCourse();};
$('#course .ch').addEventListener('dblclick',()=>{C.min=!C.min;renderCourse();});
$('#courseBtn').addEventListener('click',()=>{if(C.open&&!C.min){C.open=false;saveC();renderCourse();}else openCourse();});
setInterval(()=>window.courseTick(),400);
C.start=evLog.length;renderCourse();
</script>
<script>
/* ===== Puente con M.O.R. (Mor puede pasar modelos, ver la escena, guiarte y guardar copias) ===== */
(function(){ if(window.parent===window) return;
  const send=m=>parent.postMessage(Object.assign({__app:'vertice'},m),'*');
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const dar=(blob,name)=>{ const dt=new DataTransfer(); dt.items.add(new File([blob],name)); const fi=document.getElementById('fileIn'); fi.files=dt.files; fi.dispatchEvent(new Event('change')); };
  const estado=()=>({modo:S.mode,objetos:objs().map(o=>o.name+' ('+(o.userData.kind||'')+')').slice(0,40),seleccion:[...S.sel].map(o=>o.name),activo:S.active?S.active.name:null,
    curso:(typeof C!=='undefined'&&typeof COURSE!=='undefined'&&C.open)?{leccion:COURSE[C.m].title,paso:(COURSE[C.m].steps[C.s]||{}).t?String(COURSE[C.m].steps[C.s].t).replace(/<[^>]+>/g,''):''}:null});
  window.addEventListener('message',e=>{ const d=e.data||{}; if(!d.__mor) return; const ok=x=>send(Object.assign({id:d.id},x));
    try{
      if(d.cmd==='importar'){ if(S.mode==='EDIT') setMode('OBJECT'); fileMode='gltf'; dar(new Blob([b64(d.data)]),d.name||'modelo.glb'); ok({hecho:true}); }
      else if(d.cmd==='exportar'){ if(S.mode==='EDIT') setMode('OBJECT'); const {sc,anims}=buildExport(); if(!sc.children[0].children.length) return ok({error:'No hay mallas visibles para exportar'});
        new THREE.GLTFExporter().parse(sc,res=>ok({glb:res}),{binary:true,animations:anims,onlyVisible:true}); }
      else if(d.cmd==='ver'){ renderer.render(scene,viewCam); ok({img:canvas.toDataURL('image/jpeg',.7),estado:estado()}); }
      else if(d.cmd==='manual'){ ok({manual:COURSE.map((l,i)=>`${i}. ${l.title}: `+l.steps.map(s=>String(s.t).replace(/<[^>]+>/g,'')).join(' / ')).join('\n').slice(0,9000)}); }
      else if(d.cmd==='restaurar'){ if(S.mode==='EDIT') setMode('OBJECT',true); restore(d.snap); pushUndo(); toast('Copia de seguridad recuperada'); ok({hecho:true}); }
    }catch(err){ ok({error:String(err&&err.message||err)}); } });
  // copia de seguridad automática cada 30 s si hay cambios
  let ultima=''; setInterval(()=>{ try{ const s=JSON.stringify(snapshot()); if(s!==ultima){ ultima=s; send({copia:s,nombre:(objs().length+' objetos')}); } }catch(e){} },30000);
  send({listo:true});
})();
</script>
