let lessonIdx = 0;
function renderCourses(){
  const p = $('#pane-cursos');
  p.innerHTML = '<div class="courses"><div id="ll"></div><div class="lb" id="lb"></div></div>';
  const ll = $('#ll'); let lastG = null;
  LESSONS.forEach((l, i) => {
    if (l.g !== lastG) { lastG = l.g; const h = el('<div class="lbl"></div>'); h.textContent = l.g; ll.appendChild(h); }
    const d = el('<div class="lesson' + (i === lessonIdx ? ' on' : '') + '"><b></b><small></small></div>');
    d.querySelector('b').textContent = l.t; d.querySelector('small').textContent = l.s;
    d.onclick = () => { lessonIdx = i; renderCourses(); };
    ll.appendChild(d);
  });
  const l = LESSONS[lessonIdx];
  $('#lb').innerHTML = '<h3></h3><p></p><ol>' + l.steps.map(s => '<li>' + s + '</li>').join('') + '</ol>' +
    '<div class="sub" style="max-width:70ch"><h4>Consejo</h4><div style="color:#AEBAD0;line-height:1.6;font-size:11.5px">' + l.tip + '</div></div>';
  $('#lb h3').textContent = l.t; $('#lb p').textContent = l.p;
}

let importTarget = 'scene';

function download(name, content, type){
  const b = new Blob([content], { type:type || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
$('#btnSaveFile').onclick = () => {
  doAutosave();
  download((P.name || 'juego').replace(/[^\w\-]+/g, '_') + '.u3d', JSON.stringify(P, null, 1), 'application/json');
  toast('Proyecto descargado');
};
$('#btnLoadFile').onclick = () => { importTarget = 'scene'; $('#fileIn').click(); };
$('#btnNew').onclick = () => {
  modal('Empezar de cero',
    '<p style="color:#AEBAD0;line-height:1.6;margin-bottom:14px">Se borrará el proyecto actual. ' +
    'Si quieres conservarlo, cierra esto y pulsa Guardar antes.</p>' +
    '<button class="act warn" id="cfNew">Proyecto nuevo y vacío</button>' +
    '<button class="act" id="cfDemo">Cargar el nivel de ejemplo</button>');
  $('#cfNew').onclick = () => {
    P = { name:'Mi juego', version:VERSION, objects:[], models:[], sounds:[], world:Object.assign({}, DEFAULT_WORLD) };
    curModelId = null; ensureModel(); rebuildAll(); applyWorld(); select(null);
    renderTree(); renderModelLib(); markDirty(); $('#modal').classList.remove('on');
  };
  $('#cfDemo').onclick = () => { demoScene(); $('#modal').classList.remove('on'); };
};

$('#fileIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  const name = f.name.replace(/\.[^.]+$/, '');
  if (/\.(png|jpe?g|webp|gif)$/i.test(f.name)) {
    r.onload = () => addTexture(name, r.result);
    r.readAsDataURL(f); e.target.value = ''; return;
  }
  if (/\.js$/i.test(f.name) || importTarget === 'ext') {
    r.onload = () => Ext.añadir(name, r.result);
    r.readAsText(f); e.target.value = ''; return;
  }
  if (/\.(mp3|wav|ogg|m4a)$/i.test(f.name)) {
    r.onload = () => addAudio(name, r.result);
    r.readAsDataURL(f); e.target.value = ''; return;
  }
  r.onload = () => {
    try {
      if (/\.u3da$/i.test(f.name)) importClipData(JSON.parse(r.result), name);
      else if (/\.obj$/i.test(f.name)) addImported(parseOBJ(r.result), name);
      else if (/\.glb$/i.test(f.name)) {
        const res = parseGLB(r.result, true);
        const skin = gltfSkinned(res.json, res.bufs);
        if (skin && importTarget !== 'anim') {
          const m = { id:uid(), name:name || 'Modelo', parts:[], anims:[], skin:skin, color:'#c2ccdd' };
          P.models.push(m); openModel(m.id); renderModelLib(); markDirty();
          log('Modelo con esqueleto importado: ' + name + ' · ' + skin.bones.length + ' huesos · ' +
            skin.clips.length + ' animaciones', 'ok');
          modal('Modelo con esqueleto importado',
            '<p style="color:#AEBAD0;line-height:1.7">Se ha leído <b>' + (name || 'el modelo') + '</b> con <b>' +
            skin.bones.length + '</b> huesos, deformación de malla y <b>' + skin.clips.length +
            '</b> animaciones: ' + (skin.clips.map(c => c.name).join(', ') || 'ninguna') + '.</p>' +
            '<p style="color:#AEBAD0;line-height:1.7;margin-top:10px">Insértalo en la escena desde la pestaña Modelos ' +
            'y dale la mecánica <b>Animación de esqueleto</b> o <b>Esqueleto según el movimiento</b>.</p>');
          e.target.value = ''; return;
        }
        const anims = gltfAnimations(res.json, res.bufs);
        if (importTarget === 'anim') { if (!offerAnimations(anims)) toast('Ese archivo no trae animaciones'); }
        else { addImported(res.verts, name); if (anims.length) offerAnimations(anims); }
      }
      else if (/\.gltf$/i.test(f.name)) {
        const json = JSON.parse(r.result), bufs = gltfBuffers(json);
        const anims = gltfAnimations(json, bufs);
        if (importTarget === 'anim') { if (!offerAnimations(anims)) toast('Ese archivo no trae animaciones'); }
        else { addImported(gltfGeometry(json, bufs), name); if (anims.length) offerAnimations(anims); }
      }
      else if (/\.u3dm$/i.test(f.name)) {
        const m = JSON.parse(r.result); m.id = uid(); m.parts.forEach(p => p.id = uid());
        P.models.push(m); openModel(m.id); setMode('model'); renderModelLib(); markDirty(); toast('Modelo importado');
      } else if (importTarget === 'merge') {
        const d = JSON.parse(r.result);
        if (!d.objects) throw new Error('No es un proyecto de ULTIMATE3D');
        mergeDialog(d, f.name);
      } else {
        const d = JSON.parse(r.result);
        if (!d.objects) throw new Error('No es un proyecto de ULTIMATE3D');
        P = Object.assign({ name:'Juego', objects:[], models:[], sounds:[], world:{} }, d);
        P.world = Object.assign({}, DEFAULT_WORLD, P.world || {});
        P.models = P.models || []; P.vars = P.vars || []; P.ui = P.ui || { elements:[] };
        P.objects.forEach(o => { o.behaviors = o.behaviors || []; o.params = o.params || {}; o.mat = o.mat || {}; });
        curModelId = null; ensureModel(); rebuildAll(); applyWorld(); select(null);
        renderTree(); renderModelLib(); renderSndLib(); markDirty();
        log('Proyecto abierto: ' + f.name, 'ok'); toast('Proyecto cargado');
      }

function fitScale(v, target){
  let mx = 0;
  for (let i = 0; i < v.length; i++) mx = Math.max(mx, Math.abs(v[i]));
  return mx > 0 ? +(target / (mx * 2)).toFixed(3) : 1;
}

function parseOBJ(txt){
  const vs = [], out = [];
  txt.split('\n').forEach(line => {
    const p = line.trim().split(/\s+/);
    if (p[0] === 'v') vs.push([+p[1], +p[2], +p[3]]);
    else if (p[0] === 'f') {
      const idx = p.slice(1).map(x => parseInt(x.split('/')[0], 10) - 1);
      for (let i = 1; i < idx.length - 1; i++)
        [idx[0], idx[i], idx[i + 1]].forEach(k => { const v = vs[k]; if (v) out.push(v[0], v[1], v[2]); });
    }
  });
  return out;
}

/* ---- glTF / GLB ---- */
function parseGLB(buf, full){
  const dv = new DataView(buf);
  if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('El archivo no es un GLB válido');
  let off = 12, json = null, bin = null;
  while (off < dv.byteLength) {
    const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true);
    const data = buf.slice(off + 8, off + 8 + len);
    if (type === 0x4E4F534A) json = JSON.parse(new TextDecoder().decode(data));
    else if (type === 0x004E4942) bin = new Uint8Array(data);
    off += 8 + len + ((4 - (len % 4)) % 4 === 4 ? 0 : 0);
    if (len % 4) off += 0;
  }
  if (!json) throw new Error('GLB sin datos');
  if (full) return { json:json, bufs:[bin], verts:gltfGeometry(json, [bin]) };
  return gltfGeometry(json, [bin]);
}
function gltfBuffers(json){
  return (json.buffers || []).map(b => {
    if (b.uri && b.uri.indexOf('base64,') >= 0) {
      const bin = atob(b.uri.split('base64,')[1]);
      const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    }
    return null;
  });
}
function gltfGeometry(json, bufs){
  const out = [];
  const readAcc = i => {
    const acc = json.accessors[i];
    const bv = json.bufferViews[acc.bufferView];
    const buf = bufs[bv.buffer || 0]; if (!buf) return null;
    const comps = { SCALAR:1, VEC2:2, VEC3:3, VEC4:4 }[acc.type] || 1;
    const start = (bv.byteOffset || 0) + (acc.byteOffset || 0);
    const n = acc.count * comps;
    const ab = buf.buffer.slice(buf.byteOffset + start, buf.byteOffset + start + n * bytesPer(acc.componentType));
    switch (acc.componentType) {
      case 5126: return new Float32Array(ab);
      case 5125: return new Uint32Array(ab);
      case 5123: return new Uint16Array(ab);
      case 5121: return new Uint8Array(ab);
      default: return null;
    }
  };
  const bytesPer = t => (t === 5126 || t === 5125) ? 4 : (t === 5123 ? 2 : 1);
  const nodeMatrix = node => {
    const m = new THREE.Matrix4();
    if (node.matrix) m.fromArray(node.matrix);
    else {
      const t = node.translation || [0,0,0], r = node.rotation || [0,0,0,1], s = node.scale || [1,1,1];
      m.compose(new THREE.Vector3().fromArray(t), new THREE.Quaternion().fromArray(r), new THREE.Vector3().fromArray(s));
    }
    return m;
  };
  const visit = (idx, parent) => {
    const node = json.nodes[idx];
    const world = parent.clone().multiply(nodeMatrix(node));
    if (node.mesh !== undefined) {
      (json.meshes[node.mesh].primitives || []).forEach(pr => {
        if (pr.mode !== undefined && pr.mode !== 4) return;
        const pos = readAcc(pr.attributes.POSITION); if (!pos) return;
        const idxs = pr.indices !== undefined ? readAcc(pr.indices) : null;
        const push = i => {
          const v = new THREE.Vector3(pos[i*3], pos[i*3+1], pos[i*3+2]).applyMatrix4(world);
          out.push(v.x, v.y, v.z);
        };
        if (idxs) for (let i = 0; i < idxs.length; i++) push(idxs[i]);
        else for (let i = 0; i < pos.length / 3; i++) push(i);
      });
    }
    (node.children || []).forEach(c => visit(c, world));
  };
  const scene = json.scenes ? json.scenes[json.scene || 0] : null;
  const roots = scene ? scene.nodes : json.nodes.map((n, i) => i);
  roots.forEach(i => visit(i, new THREE.Matrix4()));
  return out;
}

const History = {
  stack:[], idx:-1, timer:null, lock:false,
  init(){ this.stack = [JSON.stringify(P)]; this.idx = 0; },
  schedule(){ if (this.lock) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 700); },
  push(){
    const s = JSON.stringify(P);
    if (this.stack[this.idx] === s) return;
    this.stack = this.stack.slice(0, this.idx + 1);
    this.stack.push(s);
    if (this.stack.length > 40) this.stack.shift();
    this.idx = this.stack.length - 1;
  },
  undo(){ if (this.idx <= 0) { toast('No hay nada que deshacer'); return; } this.idx--; this.restore('Deshecho'); },
  redo(){ if (this.idx >= this.stack.length - 1) { toast('No hay nada que rehacer'); return; } this.idx++; this.restore('Rehecho'); },
  restore(msg){
    this.lock = true;
    clearTimeout(this.timer);
    try {
      P = JSON.parse(this.stack[this.idx]);
      P.models = P.models || []; P.sounds = P.sounds || [];
      if (!P.models.some(m => m.id === curModelId)) curModelId = P.models.length ? P.models[0].id : null;
      selId = null; selIds = []; selPart = null;
      rebuildAll(); applyWorld(); rebuildStage();
      renderTree(); renderModelLib(); renderSndLib(); refreshInspector();
      if (mode === 'model') { renderPartList(); }
      if (mode === 'anim') { renderClipList(); renderPartList(true); renderTimeline(); }
      attachGizmo(null);
      toast(msg + ' · paso ' + (this.idx + 1) + ' de ' + this.stack.length);
    } catch (e) { log('Error al restaurar: ' + e.message, 'er'); }
    this.lock = false;
    doAutosave();
  }
};

const Clip = { objects:[], behaviors:null };
function copySel(){
  if (mode !== 'scene') return;
  const ids = selIds.length ? selIds : (selId ? [selId] : []);
  if (!ids.length) { toast('Nada que copiar'); return; }
  Clip.objects = ids.map(id => JSON.parse(JSON.stringify(P.objects.find(o => o.id === id)))).filter(Boolean);
  toast(Clip.objects.length + ' objeto(s) copiados');
}
function pasteClip(){
  if (mode !== 'scene' || !Clip.objects.length) { toast('El portapapeles está vacío'); return; }
  const nuevos = [];
  Clip.objects.forEach(src => {
    const c = JSON.parse(JSON.stringify(src)); c.id = uid();
    c.pos = [c.pos[0] + 2, c.pos[1], c.pos[2]];
    const n = P.objects.filter(x => x.name.split(' ')[0] === c.name.split(' ')[0]).length;
    if (n) c.name = c.name.split(' copia')[0] + ' copia';
    P.objects.push(c); const m = buildObject(c); meshes[c.id] = m; root.add(m); nuevos.push(c.id);
  });

/* ---------- Vistas de camara ---------- */
function setView(v){
  if (v === 'front') { orbit.yaw = 0; orbit.pitch = 0; }
  else if (v === 'side') { orbit.yaw = Math.PI / 2; orbit.pitch = 0; }
  else if (v === 'top') { orbit.pitch = 1.44; }
  else if (v === 'reset') { orbit.yaw = .72; orbit.pitch = .55; orbit.dist = 22; orbit.target.set(0, 1, 0); }
  updateEditorCam();
}
function frameAll(){
  const list = mode === 'scene' ? Object.keys(meshes).map(k => meshes[k]) : (stageModel ? [stageModel] : []);
  if (!list.length) return;
  const box = new THREE.Box3();
  list.forEach(m => box.expandByObject(m));
  if (box.isEmpty()) return;
  const c = new THREE.Vector3(), s = new THREE.Vector3();
  box.getCenter(c); box.getSize(s);
  orbit.target.copy(c);
  orbit.dist = clamp(Math.max(s.x, s.y, s.z) * 1.6, 4, 600);
  updateEditorCam();
}
function focusSel(){
  if (mode === 'scene') {
    const o = P.objects.find(x => x.id === selId); if (!o) return frameAll();
    orbit.target.fromArray(o.pos); orbit.dist = Math.max(5, Math.max.apply(null, o.scl) * 4);
  } else {
    const g = selPart && partGroup(selPart);
    if (g) g.getWorldPosition(orbit.target); else orbit.target.set(0, 1.2, 0);
    orbit.dist = 5;
  }
  updateEditorCam();
}
function groundSel(){
  if (mode !== 'scene') return;
  (selIds.length ? selIds : [selId]).forEach(id => {
    const o = P.objects.find(x => x.id === id); if (!o || !meshes[id]) return;
    o.pos[1] = o.scl[1] / 2; meshes[id].position.y = o.pos[1];
  });
  attachGizmo(selId ? meshes[selId] : null); refreshInspector(); markDirty();
}

  snapOn = !snapOn;

}

const KEYNAME = { ' ':'espacio', 'delete':'supr', 'escape':'esc', 'home':'inicio', 'arrowup':'arriba',
  'arrowdown':'abajo', 'arrowleft':'izquierda', 'arrowright':'derecha' };
function comboOf(e){
  let k = e.key.toLowerCase();
  k = KEYNAME[k] || k;
  const mods = (e.ctrlKey || e.metaKey ? 'ctrl+' : '') + (e.altKey ? 'alt+' : '') + (e.shiftKey ? 'shift+' : '');
  return mods + k;
}
function prettyCombo(k){
  return k.split('+').map(x => ({ ctrl:'Ctrl', alt:'Alt', shift:'Mayús' }[x] || (x.length === 1 ? x.toUpperCase() : x.charAt(0).toUpperCase() + x.slice(1))))
    .map(x => '<kbd>' + x + '</kbd>').join(' + ');
}
window.addEventListener('keydown', e => {
  const typing = ['INPUT','TEXTAREA','SELECT'].indexOf(e.target.tagName) >= 0;
  if (typing) return;
  const combo = comboOf(e);
  if ($('#palette').classList.contains('on')) return;
  if (playing) {
    if (combo === 'esc') { stopGame(); e.preventDefault(); }
    return;
  }
  const c = CMD.find(x => x.k === combo || x.alt === combo);
  if (c) { e.preventDefault(); c.run(); }
});

  items.forEach(it => {

      '<span class="t"></span>' + (it.k ? '<span class="sc">' + it.k + '</span>' : '');
    b.querySelector('.t').textContent = it.l;
    if (it.disabled) b.disabled = true;
    else b.onclick = () => { closeCtx(); it.run(); };

  m.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';

/* ---------- Paleta de comandos ---------- */
let palIdx = 0, palRows = [];
function openPalette(){
  $('#palette').classList.add('on');
  const inp = $('#palIn'); inp.value = ''; palIdx = 0;
  drawPalette('');
  setTimeout(() => inp.focus(), 20);
}
function closePalette(){ $('#palette').classList.remove('on'); }
function drawPalette(q){
  const list = $('#palList'); list.innerHTML = '';
  const ql = q.toLowerCase();
  palRows = CMD.filter(c => !ql || (c.l + ' ' + c.g).toLowerCase().includes(ql));
  palIdx = clamp(palIdx, 0, Math.max(0, palRows.length - 1));
  palRows.forEach((c, i) => {
    const r = el('<div class="palrow' + (i === palIdx ? ' on' : '') + '"><span class="g"></span><span class="t"></span><span class="sc"></span></div>');
    r.querySelector('.g').textContent = c.g;
    r.querySelector('.t').textContent = c.l;
    r.querySelector('.sc').textContent = c.k;
    r.onclick = () => { closePalette(); c.run(); };
    list.appendChild(r);
  });
}
function initPalette(){
  const inp = $('#palIn');
  inp.oninput = () => { palIdx = 0; drawPalette(inp.value); };
  inp.onkeydown = e => {
    if (e.key === 'Escape') { closePalette(); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { palIdx = Math.min(palIdx + 1, palRows.length - 1); drawPalette(inp.value); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { palIdx = Math.max(palIdx - 1, 0); drawPalette(inp.value); e.preventDefault(); }
    else if (e.key === 'Enter') { const c = palRows[palIdx]; closePalette(); if (c) c.run(); e.preventDefault(); }
  };
  $('#palette').onclick = e => { if (e.target.id === 'palette') closePalette(); };
  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
    if (e.key === 'F1') { e.preventDefault(); showShortcuts(); }
  });
}

const BLK = {}; BLOCKS.forEach(b => BLK[b.op] = b);
const BCATS = [['ev','Eventos','b-ev'],['mov','Movimiento','b-mov'],['look','Aspecto','b-look'],
  ['game','Juego','b-game'],['snd','Sonido','b-snd'],['ctrl','Control','b-ctrl'],['var','Variables','b-var']];
const catClass = c => (BCATS.find(x => x[0] === c) || [,, 'b-ctrl'])[2];

let scriptObjId = null, selBlk = null, blkDrag = null;

function scriptObj(){ return P.objects.find(o => o.id === scriptObjId) || null; }
function ensureScript(o){ if (!o.script) o.script = []; return o.script; }
function newBlock(op){
  const d = BLK[op], b = { id:uid(), op:op, args:{} };
  (d.args || []).forEach(a => b.args[a.k] = a.d);
  if (d.body) b.body = [];
  return b;
}
function findBlock(list, id, parent){
  for (let i = 0; i < list.length; i++) {
    if (list[i].id === id) return { list:list, i:i, b:list[i], parent:parent };
    if (list[i].body) { const r = findBlock(list[i].body, id, list[i]); if (r) return r; }
  }
  return null;
}
function addBlock(op){
  const o = scriptObj();
  if (!o) { toast('Elige antes un objeto en la lista de la izquierda'); return; }
  const script = ensureScript(o), d = BLK[op], b = newBlock(op);
  if (d.evt) { script.push(b); }
  else {
    if (!script.length) script.push(newBlock('al_empezar'));
    let target = null;
    if (selBlk) {
      const r = findBlock(script, selBlk);
      if (r) { if (r.b.body) target = { list:r.b.body, i:r.b.body.length }; else target = { list:r.list, i:r.i + 1 }; }
    }
    if (!target) { const last = script[script.length - 1]; target = { list:last.body, i:last.body.length }; }
    target.list.splice(target.i, 0, b);
  }
  selBlk = b.id;
  renderBlocks(); markDirty();
}
function deleteBlock(id){
  const o = scriptObj(); if (!o) return;
  const r = findBlock(o.script, id); if (!r) return;
  r.list.splice(r.i, 1);
  if (selBlk === id) selBlk = null;
  renderBlocks(); markDirty();
}
function dupBlock(id){
  const o = scriptObj(); if (!o) return;
  const r = findBlock(o.script, id); if (!r) return;
  const copy = JSON.parse(JSON.stringify(r.b));
  (function reid(b){ b.id = uid(); (b.body || []).forEach(reid); })(copy);
  r.list.splice(r.i + 1, 0, copy);
  renderBlocks(); markDirty();
}

/* ---------- Dibujar el guion ---------- */
function renderBlocks(){
  const host = $('#blockScroll'); if (!host) return;
  host.innerHTML = '';
  const o = scriptObj();
  if (!o) {
    host.innerHTML = '<div id="blkEmpty">Elige un objeto en la lista de la izquierda y arrástrale bloques ' +
      'desde la paleta de abajo. Cada pila empieza con un bloque naranja de evento.</div>';
    return;
  }
  const script = ensureScript(o);
  if (!script.length) {
    host.innerHTML = '<div id="blkEmpty">Este objeto todavía no tiene guion.<br>' +
      'Empieza pulsando un bloque naranja de la paleta, como <b>al empezar la partida</b>.</div>';
    return;
  }
  script.forEach((st, si) => {
    const wrap = el('<div class="stack"></div>');
    const head = el('<div class="stackhead"><span></span></div>');
    head.querySelector('span').textContent = 'Pila ' + (si + 1);
    wrap.appendChild(head);
    wrap.appendChild(blockEl(st, script, si));
    host.appendChild(wrap);
  });
  host.appendChild(slotEl(script, script.length));
}
function slotEl(list, i){
  const s = el('<div class="slot"></div>');
  s._list = list; s._i = i;
  return s;
}
function blockEl(b, list, i){
  const d = BLK[b.op] || { l:b.op, cat:'ctrl' };
  const box = el('<div class="wrapblk"></div>');
  const blk = el('<div class="blk ' + catClass(d.cat) + (selBlk === b.id ? ' sel' : '') + '"></div>');
  if (selBlk === b.id) blk.style.boxShadow = '0 0 0 2px #F59E42';
  const parts = String(d.l).split(/(\{\w+\})/);
  parts.forEach(p => {
    const m = p.match(/^\{(\w+)\}$/);
    if (!m) { if (p.trim()) { const s = el('<span class="lbl2"></span>'); s.textContent = p.trim(); blk.appendChild(s); } return; }
    const def = (d.args || []).find(a => a.k === m[1]); if (!def) return;
    let inp;
    if (def.t === 'sel') {
      inp = document.createElement('select');
      (def.opts || []).forEach(op => { const o2 = document.createElement('option'); o2.value = op[0]; o2.textContent = op[1]; inp.appendChild(o2); });
    } else {
      inp = document.createElement('input');
      inp.type = def.t === 'num' ? 'number' : (def.t === 'color' ? 'color' : 'text');
      if (def.t === 'num') inp.step = '0.1';
      inp.size = 5;
    }
    inp.value = b.args[def.k] !== undefined ? b.args[def.k] : def.d;
    inp.onchange = inp.oninput = () => { b.args[def.k] = def.t === 'num' ? num(inp.value, def.d) : inp.value; markDirty(); };
    inp.onpointerdown = ev => ev.stopPropagation();
    blk.appendChild(inp);
  });
  const tools = el('<div class="tools"></div>');
  const bd = el('<button title="Duplicar"></button>'); bd.innerHTML = icon('copiar', 11);
  bd.onclick = ev => { ev.stopPropagation(); dupBlock(b.id); };
  const bx = el('<button title="Borrar"></button>'); bx.innerHTML = icon('cerrar', 11);
  bx.onclick = ev => { ev.stopPropagation(); deleteBlock(b.id); };
  tools.appendChild(bd); tools.appendChild(bx);
  blk.appendChild(tools);
  blk.onclick = ev => { ev.stopPropagation(); selBlk = b.id; renderBlocks(); };
  blk.oncontextmenu = ev => { ev.preventDefault(); ev.stopPropagation(); blockMenu(ev, b); };
  blk.onpointerdown = ev => startBlockDrag(ev, b);
  box.appendChild(blk);
  if (d.body) {
    const body = el('<div class="body"></div>');
    body.appendChild(slotEl(b.body, 0));
    (b.body || []).forEach((c, ci) => { body.appendChild(blockEl(c, b.body, ci)); body.appendChild(slotEl(b.body, ci + 1)); });
    box.appendChild(body);
  }
  if (list && !BLK[b.op].evt) box.appendChild(slotEl(list, i + 1));
  return box;
}

/* ---------- Arrastrar bloques ---------- */
function startBlockDrag(ev, b){
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT' || ev.target.closest('.tools')) return;
  if (ev.button !== 0) return;
  const o = scriptObj(); if (!o) return;
  blkDrag = { id:b.id, x:ev.clientX, y:ev.clientY, active:false, el:ev.currentTarget };
  const move = e => {
    if (!blkDrag) return;
    if (!blkDrag.active && Math.abs(e.clientX - blkDrag.x) + Math.abs(e.clientY - blkDrag.y) < 5) return;
    if (!blkDrag.active) { blkDrag.active = true; blkDrag.el.classList.add('drag'); }
    const slots = $$('#blockScroll .slot');
    let best = null, bd2 = 1e9;
    slots.forEach(s => {
      const r = s.getBoundingClientRect();
      const d2 = Math.hypot(e.clientX - (r.left + 30), e.clientY - (r.top + r.height / 2));
      if (d2 < bd2) { bd2 = d2; best = s; }
    });
    slots.forEach(s => s.classList.toggle('on', s === best && bd2 < 260));
    blkDrag.slot = (bd2 < 260) ? best : null;
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    if (blkDrag && blkDrag.active && blkDrag.slot) {
      const r = findBlock(o.script, blkDrag.id);
      const target = { list:blkDrag.slot._list, i:blkDrag.slot._i };
      if (r && !insideSelf(r.b, target.list)) {
        const isEvt = (BLK[r.b.op] || {}).evt;
        if (!isEvt || target.list === o.script) {
          r.list.splice(r.i, 1);
          let idx = target.i;
          if (target.list === r.list && target.i > r.i) idx--;
          target.list.splice(clamp(idx, 0, target.list.length), 0, r.b);
          markDirty();
        }
      }
    }
    blkDrag = null;
    renderBlocks();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}
function insideSelf(b, list){
  let found = false;
  (function walk(x){ if (x.body) { if (x.body === list) found = true; x.body.forEach(walk); } })(b);
  return found;
}
function blockMenu(ev, b){
  ctxMenu(ev.clientX, ev.clientY, [
    { cap:(BLK[b.op] || {}).l || b.op },
    { l:'Duplicar el bloque', ic:'copiar', run:() => dupBlock(b.id) },
    { l:'Borrar el bloque', ic:'borrar', run:() => deleteBlock(b.id) },
    { sep:true },
    { l:'Probar el juego', ic:'play', k:'Espacio', run:() => { setMode('scene'); startGame(); } }
  ]);

function countBlocks(list){

function inspectorVars(b){

/* ============================================================
   VM · maquina virtual que ejecuta los bloques
   ============================================================ */
const VM = {
  YIELD:['mover','avanzar','hacia_jugador','huir','girar','mirar_jugador','animar'],

  compile(script){
    const self = this;
    return (script || []).map(st => ({
      ev:st.op, a:st.args || {}, prog:self.flat(st.body || []),
      pc:-1, wait:0, loops:[], t:0, prev:false, started:false
    }));
  },
  flat(list){
    const out = [];
    const walk = l => {
      (l || []).forEach(b => {
        if (b.op === 'repetir') {
          const start = { op:'_rep', n:(b.args && b.args.n) || 0 };
          out.push(start); const idx = out.length - 1;
          walk(b.body); out.push({ op:'_repend', jmp:idx });
        } else if (b.op.indexOf('si_') === 0) {
          const j = { op:'_if', cond:b.op, a:b.args || {} };
          out.push(j); walk(b.body); j.jmp = out.length;
        } else out.push({ op:b.op, a:b.args || {} });
      });
    };
    walk(list);
    return out;
  },
  start(st){ st.pc = 0; st.wait = 0; st.loops = []; },

  tick(e, dt, R){
    const vm = e.rt.vm; if (!vm) return;
    for (let i = 0; i < vm.length; i++) {
      const st = vm[i];
      const a = st.a || {};
      if (st.ev === 'al_empezar') { if (!st.started) { st.started = true; this.start(st); } }
      else if (st.ev === 'siempre') { if (st.pc < 0) this.start(st); }
      else if (st.ev === 'cada') { st.t += dt; if (st.t >= (a.seg || 1)) { st.t = 0; this.start(st); } }
      else if (st.ev === 'al_tocar') {
        const t = !!(R.pl(e) && R.touching(e, R.pl(e)));
        if (t && !st.prev) this.start(st); st.prev = t;
      } else if (st.ev === 'al_pulsar') {
        const k = String(a.tecla || '').toLowerCase().replace('espacio', ' ');
        const d = !!R.keys[k]; if (d && !st.prev) this.start(st); st.prev = d;
      } else if (st.ev === 'al_recibir') {
        const s = !!R.signals[a.senal]; if (s && !st.prev) this.start(st); st.prev = s;
      } else if (st.ev === 'al_acercarse') {
        const n = !!(R.pl(e) && e.o.position.distanceTo(R.pl(e).o.position) < (a.dist || 5));
        if (n && !st.prev) this.start(st); st.prev = n;
      }
      if (st.pc >= 0) this.run(e, st, dt, R);
    }
  },

  run(e, st, dt, R){
    if (st.wait > 0) { st.wait -= dt; if (st.wait > 0) return; st.wait = 0; }
    let budget = 240;
    while (st.pc >= 0 && st.pc < st.prog.length && budget-- > 0) {
      const ins = st.prog[st.pc];
      let jumped = false, yielded = false;
      if (ins.op === '_rep') {
        st.loops.push({ c:0, n:ins.n, body:st.pc + 1 });
        st.pc++;
        continue;
      }
      if (ins.op === '_repend') {
        const L = st.loops[st.loops.length - 1];
        if (L && ++L.c < L.n) { st.pc = L.body; }
        else { st.loops.pop(); st.pc++; }
        continue;
      }
      if (ins.op === 'esperar') { st.wait = (ins.a && ins.a.seg) || 0; st.pc++; return; }
      if (ins.op === '_if') {
        if (this.cond(e, ins, R)) st.pc++;
        else st.pc = ins.jmp;
        continue;
      }
      const res = this.exec(e, ins, R, dt);
      if (res === 'stop') { st.pc = -1; return; }
      if (res === 'wait') { st.pc++; return; }
      st.pc++;
      if (this.YIELD.indexOf(ins.op) >= 0) yielded = true;
      if (yielded) break;
    }
    if (st.pc >= st.prog.length) {
      if (st.ev === 'siempre') { st.pc = 0; st.loops = []; }
      else st.pc = -1;
    }
  },

  cond(e, ins, R){
    const a = ins.a || {};
    switch (ins.cond) {
      case 'si_cerca': return !!(R.pl(e) && e.o.position.distanceTo(R.pl(e).o.position) < (a.d || 5));
      case 'si_tecla': return !!R.keys[String(a.k || '').toLowerCase().replace('espacio', ' ')];
      case 'si_azar': return Math.random() * 100 < (a.p || 50);
      case 'si_var': return (R.state.vars[a.n] || 0) > (a.v || 0);
      default: return false;
    }
  },

  exec(e, ins, R, dt){
    const a = ins.a || {}, o = e.o;
    switch (ins.op) {
      case 'mover': R.moveWithCollision(e, (a.x || 0) * dt * 6, (a.y || 0) * dt * 6, (a.z || 0) * dt * 6); break;
      case 'avanzar': {
        const d = (a.d || 0) * dt * 6;
        R.moveWithCollision(e, Math.sin(o.rotation.y) * d, 0, Math.cos(o.rotation.y) * d); break;
      }
      case 'ir_a': o.position.set(a.x || 0, a.y || 0, a.z || 0); break;
      case 'hacia_jugador': {
        if (!R.pl(e)) break;
        const v = R.pl(e).o.position.clone().sub(o.position); v.y = 0;
        if (v.length() > .6) { v.normalize().multiplyScalar((a.vel || 3) * dt); R.moveWithCollision(e, v.x, 0, v.z); }
        break;
      }
      case 'huir': {
        if (!R.pl(e)) break;
        const v = o.position.clone().sub(R.pl(e).o.position); v.y = 0;
        v.normalize().multiplyScalar((a.vel || 4) * dt); R.moveWithCollision(e, v.x, 0, v.z); break;
      }
      case 'girar': o.rotation[a.eje || 'y'] += (a.g || 0) * Math.PI / 180 * dt * 6; break;
      case 'mirar_jugador': if (R.pl(e)) o.lookAt(R.pl(e).o.position.x, o.position.y, R.pl(e).o.position.z); break;
      case 'saltar': e.rt.vy = (a.f || 9); break;
      case 'color': o.traverse(function(c){ if (c.material && c.material.color) c.material.color.set(a.color || '#ffffff'); }); break;
      case 'tamano': o.scale.setScalar(a.k || 1); break;
      case 'mostrar': o.visible = true; break;
      case 'ocultar': o.visible = false; break;
      case 'animar': e.rt.at = (e.rt.at || 0) + dt; Anim.apply(o, a.clip, e.rt.at, true); break;
      case 'mensaje': R.flash(String(a.txt || ''), 1600); break;
      case 'sonido': R.sfx(a.nombre); break;
      case 'puntos': R.state.score += (a.n || 0); break;
      case 'quitar_vida': R.hurtPlayer(a.n || 0); break;
      case 'curar': R.state.hp = Math.min(R.state.hpmax, R.state.hp + (a.n || 0)); break;
      case 'crear': R.cloneByName(a.nombre, o.position.clone().add(new THREE.Vector3((Math.random() - .5) * 3, 1, (Math.random() - .5) * 3))); break;
      case 'destruir': R.remove(e); return 'stop';
      case 'tele': if (R.pl(e)) R.pl(e).o.position.set(a.x || 0, a.y || 2, a.z || 0); break;
      case 'senal': R.signals[a.senal] = true; break;
      case 'ganar': R.finish(true, a.msg || '¡Has ganado!'); return 'stop';
      case 'perder': R.finish(false, a.msg || 'Fin'); return 'stop';
      case 'fijar_var': R.state.vars[a.n] = (a.v || 0); break;
      case 'sumar_var': R.state.vars[a.n] = (R.state.vars[a.n] || 0) + (a.v || 0); break;
      case 'parar': return 'stop';
      default: break;
    }
    return null;
  },
  noop(){ return null; }
};

   Animaciones propias: poses, espejo, importar y exportar
   ============================================================ */
function poseKeyAll(){
  const m = curModel(), c = curClip();
  if (!m || !c) { toast('Abre una animación primero'); return; }
  m.parts.forEach(p => {
    const g = partGroup(p.id); if (!g || !g.userData.base) return;
    const b = g.userData.base;
    const k = ensureKey(c, p.name, animTime);
    k.r = [+((g.rotation.x - b.r.x) / deg).toFixed(1), +((g.rotation.y - b.r.y) / deg).toFixed(1), +((g.rotation.z - b.r.z) / deg).toFixed(1)];
    k.p = [+(g.position.x - b.p.x).toFixed(3), +(g.position.y - b.p.y).toFixed(3), +(g.position.z - b.p.z).toFixed(3)];
  });
  renderTimeline(); refreshInspector(); markDirty();
  toast('Pose completa guardada en ' + animTime.toFixed(2) + 's');
}
function mirrorPose(){
  const c = curClip(); if (!c) return;
  const tracks = c.tracks || {};
  const pairs = Object.keys(tracks).filter(n => n.indexOf('_izq') > 0);
  let n = 0;
  pairs.forEach(li => {
    const ri = li.replace('_izq', '_der');
    const a = keyAt(c, li, animTime), b = keyAt(c, ri, animTime);
    const sa = a || Anim.sample(tracks[li], animTime), sb = b || Anim.sample(tracks[ri], animTime);
    if (!sa && !sb) return;
    const ka = ensureKey(c, li, animTime), kb = ensureKey(c, ri, animTime);
    const A = { r:(sa && sa.r || [0,0,0]).slice(), p:(sa && sa.p || [0,0,0]).slice() };
    const B = { r:(sb && sb.r || [0,0,0]).slice(), p:(sb && sb.p || [0,0,0]).slice() };
    ka.r = [B.r[0], -B.r[1], -B.r[2]]; ka.p = [-B.p[0], B.p[1], B.p[2]];
    kb.r = [A.r[0], -A.r[1], -A.r[2]]; kb.p = [-A.p[0], A.p[1], A.p[2]];
    n++;
  });
  if (!n) { toast('No hay piezas con nombres _izq y _der'); return; }
  previewFrame(); renderTimeline(); refreshInspector(); markDirty();
  toast('Pose reflejada en ' + n + ' par(es)');
}
function copyPose(){
  const m = curModel(), c = curClip(); if (!m || !c) return;
  Clip.pose = {};
  m.parts.forEach(p => {
    const s = Anim.sample((c.tracks || {})[p.name], animTime);
    if (s) Clip.pose[p.name] = { r:(s.r || [0,0,0]).slice(), p:(s.p || [0,0,0]).slice(), s:(s.s || [1,1,1]).slice() };
  });
  toast('Pose copiada');
}
function pastePose(){
  const c = curClip(); if (!c || !Clip.pose) { toast('No hay ninguna pose copiada'); return; }
  Object.keys(Clip.pose).forEach(n => {
    const k = ensureKey(c, n, animTime), v = Clip.pose[n];
    k.r = v.r.slice(); k.p = v.p.slice(); k.s = v.s.slice();
  });
  previewFrame(); renderTimeline(); refreshInspector(); markDirty();
  toast('Pose pegada en ' + animTime.toFixed(2) + 's');
}
function reverseClip(){
  const c = curClip(); if (!c) return;
  Object.keys(c.tracks || {}).forEach(n => {
    c.tracks[n] = c.tracks[n].map(k => Object.assign({}, k, { t:+(c.dur - k.t).toFixed(2) })).sort((a, b) => a.t - b.t);
  });
  previewFrame(); renderTimeline(); markDirty(); toast('Animación invertida');
}

/* ---------- Animación desde glTF / GLB ---------- */
const RIGMAP = [
  [['hips','pelvis','cadera','root','spine0'], 'cadera'],
  [['spine','spine1','spine2','chest','torso','upperchest','abdomen'], 'torso'],
  [['head','cabeza','neck','cuello'], 'cabeza'],
  [['leftarm','left_arm','arml','arm_l','upperarm_l','leftupperarm','leftshoulder','brazoizq','brazo_izq','lefthand','leftforearm'], 'brazo_izq'],
  [['rightarm','right_arm','armr','arm_r','upperarm_r','rightupperarm','rightshoulder','brazoder','brazo_der','righthand','rightforearm'], 'brazo_der'],
  [['leftupleg','leftleg','upleg_l','thigh_l','leftthigh','piernaizq','pierna_izq','leftfoot'], 'pierna_izq'],
  [['rightupleg','rightleg','upleg_r','thigh_r','rightthigh','piernader','pierna_der','rightfoot'], 'pierna_der']
];
function mapBone(name){
  const n = String(name || '').toLowerCase().replace(/^.*[:|]/, '').replace(/[\s_.\-]/g, '');
  for (let i = 0; i < RIGMAP.length; i++) {
    for (let j = 0; j < RIGMAP[i][0].length; j++) {
      const key = RIGMAP[i][0][j].replace(/[\s_.\-]/g, '');
      if (n === key || n.indexOf(key) >= 0) return RIGMAP[i][1];
    }
  }
  return null;
}
function gltfAnimations(json, bufs){
  if (!json.animations || !json.animations.length) return [];
  const bytesPer = t => (t === 5126 || t === 5125) ? 4 : (t === 5123 ? 2 : 1);
  const readAcc = i => {
    const acc = json.accessors[i], bv = json.bufferViews[acc.bufferView];
    const buf = bufs[bv.buffer || 0]; if (!buf) return null;
    const comps = { SCALAR:1, VEC2:2, VEC3:3, VEC4:4 }[acc.type] || 1;
    const start = (bv.byteOffset || 0) + (acc.byteOffset || 0);
    const ab = buf.buffer.slice(buf.byteOffset + start, buf.byteOffset + start + acc.count * comps * bytesPer(acc.componentType));
    const arr = acc.componentType === 5126 ? new Float32Array(ab)
      : acc.componentType === 5123 ? new Uint16Array(ab)
      : acc.componentType === 5125 ? new Uint32Array(ab) : new Uint8Array(ab);
    return { arr:arr, comps:comps, count:acc.count };
  };
  const out = [];
  json.animations.forEach((an, ai) => {
    const perNode = {};
    (an.channels || []).forEach(ch => {
      const node = json.nodes[ch.target.node]; if (!node) return;
      const smp = an.samplers[ch.sampler]; if (!smp) return;
      const inp = readAcc(smp.input), outp = readAcc(smp.output);
      if (!inp || !outp) return;
      const nm = node.name || ('nodo' + ch.target.node);
      const rec = perNode[nm] = perNode[nm] || { node:node, t:{}, r:{}, s:{} };
      const bag = ch.target.path === 'rotation' ? rec.r : (ch.target.path === 'scale' ? rec.s : rec.t);
      for (let i = 0; i < inp.count; i++) {
        const time = +inp.arr[i].toFixed(3);
        const v = [];
        for (let c = 0; c < outp.comps; c++) v.push(outp.arr[i * outp.comps + c]);
        bag[time] = v;
      }
    });
    const tracks = {}; let dur = 0, encajadas = 0;
    Object.keys(perNode).forEach(nm => {
      const rec = perNode[nm];
      const destino = mapBone(nm) || nm;
      if (mapBone(nm)) encajadas++;
      const rest = rec.node;
      const restQ = new THREE.Quaternion().fromArray(rest.rotation || [0, 0, 0, 1]).invert();
      const restT = rest.translation || [0, 0, 0], restS = rest.scale || [1, 1, 1];
      const times = {};
      [rec.t, rec.r, rec.s].forEach(bag => Object.keys(bag).forEach(t => times[t] = 1));
      const keys = Object.keys(times).map(parseFloat).sort((a, b) => a - b).map(t => {
        dur = Math.max(dur, t);
        const k = { t:+t.toFixed(2) };
        if (rec.r[t]) {
          const q = new THREE.Quaternion().fromArray(rec.r[t]).premultiply(restQ);
          const e2 = new THREE.Euler().setFromQuaternion(q, 'XYZ');
          k.r = [+(e2.x / deg).toFixed(1), +(e2.y / deg).toFixed(1), +(e2.z / deg).toFixed(1)];
        }
        if (rec.t[t]) k.p = [+(rec.t[t][0] - restT[0]).toFixed(3), +(rec.t[t][1] - restT[1]).toFixed(3), +(rec.t[t][2] - restT[2]).toFixed(3)];
        if (rec.s[t]) k.s = [+(rec.s[t][0] / (restS[0] || 1)).toFixed(3), +(rec.s[t][1] / (restS[1] || 1)).toFixed(3), +(rec.s[t][2] / (restS[2] || 1)).toFixed(3)];
        return k;
      });
      if (keys.length) tracks[destino] = keys;
    });
    if (Object.keys(tracks).length) {
      out.push({ name:an.name || ('animacion_' + (ai + 1)), dur:Math.max(.2, +dur.toFixed(2)), loop:true, tracks:tracks, encajadas:encajadas });
    }
  });
  return out;
}
function offerAnimations(anims){
  if (!anims.length) return false;
  let h = '<p style="color:#AEBAD0;line-height:1.7;margin-bottom:12px">El archivo trae ' + anims.length +
    ' animación(es). Elige cuáles quieres añadir a <b>' + (curModel() ? curModel().name : 'tu modelo') + '</b>.</p><div class="modlist">';

      '<div class="row"><button class="tbtn" data-ai="' + i + '">Añadir</button></div></div>';
  });
  modal('Animaciones encontradas', h + '</div>');
  $$('#mdBody [data-ai]').forEach(b => b.onclick = () => {

  });
  return true;
}


/* ============================================================
   Navegacion de camara con teclado (WASD, flechas, E y Q)
   ============================================================ */
const Fly = {
  on:false, keys:{}, held:false, speed:14,
  KEYS:['w','a','s','d','e','q','arrowup','arrowdown','arrowleft','arrowright','shift'],
  active(){ return !playing && (this.on || this.held); },
  init(){
    window.addEventListener('keydown', e => {
      if (['INPUT','TEXTAREA','SELECT'].indexOf(e.target.tagName) >= 0) return;
      const k = e.key.toLowerCase();
      if (this.active() && this.KEYS.indexOf(k) >= 0) { this.keys[k] = true; e.preventDefault(); }
      if (e.key === 'F2') { e.preventDefault(); this.toggle(); }
    });
    window.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    canvas.addEventListener('pointerdown', e => { if (e.button === 2) this.held = true; });
    window.addEventListener('pointerup', e => { if (e.button === 2) { this.held = false; this.keys = {}; } });
  },
  toggle(){
    this.on = !this.on; this.keys = {};
    $('#btnNav').classList.toggle('on', this.on);
    $('#btnNav').classList.toggle('primary', this.on);
    $('#chipNav').textContent = this.on ? 'Navegación activa: WASD, flechas, E sube, Q baja' : 'Pulsa F2 para navegar con el teclado';
    toast(this.on ? 'Navegación con teclado activada' : 'Navegación desactivada');
  },
  tick(dt){
    if (!this.active()) return;
    const k = this.keys;
    const look = 1.5 * dt;
    if (k['arrowleft']) orbit.yaw += look;
    if (k['arrowright']) orbit.yaw -= look;
    if (k['arrowup']) orbit.pitch = clamp(orbit.pitch + look, -1.45, 1.45);
    if (k['arrowdown']) orbit.pitch = clamp(orbit.pitch - look, -1.45, 1.45);
    const s = this.speed * dt * (k['shift'] ? 3 : 1);
    let f = 0, r = 0, u = 0;
    if (k['w']) f += 1; if (k['s']) f -= 1;
    if (k['d']) r += 1; if (k['a']) r -= 1;
    if (k['e']) u += 1; if (k['q']) u -= 1;
    if (f || r || u) {
      const dir = new THREE.Vector3(); editorCam.getWorldDirection(dir);
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
      orbit.target.addScaledVector(dir, f * s).addScaledVector(right, r * s);
      orbit.target.y += u * s;
    }
    if (f || r || u || k['arrowleft'] || k['arrowright'] || k['arrowup'] || k['arrowdown']) updateEditorCam();
  }
};

function uelById(id){ return uiList().find(e => e.id === id); }
function uelStyle(e, live){

  let s = 'left:' + e.x + '%;top:' + e.y + '%;width:' + e.w + '%;height:' + e.h + '%;' +

function uelText(e, R){
  if (!R) return e.text;
  const st = R.state;
  switch (e.bind) {
    case 'puntos': return e.text ? e.text + ': ' + st.score : String(st.score);
    case 'vida': return e.text ? e.text + ': ' + Math.max(0, Math.round(st.hp)) : String(Math.round(st.hp));
    case 'tiempo': return (st.timer !== null && st.timer !== undefined) ? (e.text ? e.text + ': ' : '') + Math.ceil(st.timer) + 's' : e.text;
    case 'variable': return (e.text ? e.text + ': ' : '') + (st.vars[e.arg2] !== undefined ? st.vars[e.arg2] : 0);

    default: return e.text;

function startUelDrag(ev, e, resize){
  if (ev.button !== 0) return;
  ev.stopPropagation();
  const st = $('#uiStage').getBoundingClientRect();
  const x0 = ev.clientX, y0 = ev.clientY, ex = e.x, ey = e.y, ew = e.w, eh = e.h;
  selUel = e.id; renderUiEditor();
  const move = m => {
    const dx = (m.clientX - x0) / st.width * 100, dy = (m.clientY - y0) / st.height * 100;
    if (resize) { e.w = clamp(+(ew + dx).toFixed(1), 3, 100); e.h = clamp(+(eh + dy).toFixed(1), 2, 100); }
    else { e.x = clamp(+(ex + dx).toFixed(1), 0, 99); e.y = clamp(+(ey + dy).toFixed(1), 0, 99); }
    renderUiEditor();
  };
  const up = () => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    refreshInspector(); markDirty();
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}
function removeUel(id){

const GameUI = {
  built:false,
  start(R){
    const layer = document.getElementById('hudLayer');
    if (!layer) return;
    layer.innerHTML = '';
    const list = (P.ui && P.ui.on !== false) ? (P.ui.elements || []) : [];
    if (!list.length) { layer.classList.remove('on'); this.built = false; return; }
    layer.classList.add('on');
    list.forEach(e => {
      const d = document.createElement('div');
      d.className = 'uel' + (e.type === 'boton' ? ' btn' : '');
      d.style.cssText = uelStyle(e, true);
      if (e.type === 'barra') {
        const f = document.createElement('div');
        f.className = 'fill'; f.style.cssText = 'width:100%;background:' + e.color;
        d.appendChild(f); d._fill = f;
        const t = document.createElement('span');
        t.style.cssText = 'position:relative;color:#fff;font-size:' + Math.min(e.size, 13) + 'px';
        d.appendChild(t); d._t = t;
      }
      if (e.type === 'boton') d.onclick = () => this.press(e, R);
      d._e = e;
      layer.appendChild(d);
    });
    this.built = true;
  },
  press(e, R){
    if (e.action === 'senal') R.signals[e.arg] = true;
    else if (e.action === 'var') R.state.vars[e.arg] = (R.state.vars[e.arg] || 0) + 1;
    else if (e.action === 'reinicia') R.restart();
    else if (e.action === 'guardar') Save.save(R);
    else if (e.action === 'cargar') Save.load(R);
    else if (e.action === 'mensaje') R.flash(e.arg || '');
    else if (e.action === 'sonido') R.sfx(e.arg || 'menu');
    else R.sfx('menu');
  },
  update(R){
    if (!this.built) return;
    const layer = document.getElementById('hudLayer');
    for (let i = 0; i < layer.children.length; i++) {
      const d = layer.children[i], e = d._e;
      let vis = true;
      if (e.visible === 'senal') vis = !!R.signals[e.arg3];
      else if (e.visible === 'nosenal') vis = !R.signals[e.arg3];
      d.style.display = vis ? 'flex' : 'none';
      if (!vis) continue;
      if (e.type === 'barra') {
        const v = e.bind === 'vida' ? R.state.hp / (R.state.hpmax || 100)
          : (R.state.vars[e.arg2] || 0) / (e.max || 100);
        d._fill.style.width = clamp(v * 100, 0, 100) + '%';
        d._t.textContent = e.text;
      } else if (e.type !== 'panel' && e.type !== 'boton') {
        d.textContent = uelText(e, R);
      }
    }
  },
  stop(){
    const layer = document.getElementById('hudLayer');
    if (layer) { layer.innerHTML = ''; layer.classList.remove('on'); }
    this.built = false;
  }
};

/* ============================================================
   Escribe la mecanica en espanol y se convierte en bloques
   ============================================================ */
const COLORES = { rojo:'#e5566a', verde:'#41c98e', azul:'#3ba9e8', amarillo:'#ffc94d', naranja:'#f59e42',
  morado:'#9d86f0', blanco:'#ffffff', negro:'#14181f', gris:'#7d8896', rosa:'#e5798c' };
function nump(x, d){ const n = parseFloat(String(x).replace(',', '.')); return isFinite(n) ? n : d; }
function frase2bloques(txt){
  const out = [];
  String(txt).split(/[\n;.]+/).forEach(raw => {
    const f = raw.trim().toLowerCase(); if (f.length < 4) return;
    let ev = { op:'al_empezar', args:{} }, m;
    if (/siempre|todo el rato|constantemente|sin parar/.test(f)) ev = { op:'siempre', args:{} };
    if ((m = f.match(/cada\s+([\d.,]+)\s*(?:segundos?|s\b)/))) ev = { op:'cada', args:{ seg:nump(m[1], 2) } };
    if (/(?:cuando|si|al).{0,14}(?:toque|toca|choque|choca|colisione|tocarme|tocarlo)/.test(f)) ev = { op:'al_tocar', args:{} };
    if ((m = f.match(/(?:cuando|si|al).{0,12}puls\w*\s+(?:la\s+)?(?:tecla\s+)?([a-z0-9áéíóú]+)/))) ev = { op:'al_pulsar', args:{ tecla:m[1] } };
    if ((m = f.match(/(?:reciba|recibe|llegue|llega)\s+(?:la\s+)?se[nñ]al\s+([\w-]+)/))) ev = { op:'al_recibir', args:{ senal:m[1] } };
    if (/(?:acerque|acerca|cerca)/.test(f) && !/al tocar/.test(f)) {
      const d = f.match(/menos de\s+([\d.,]+)/);
      ev = { op:'al_acercarse', args:{ dist:d ? nump(d[1], 6) : 6 } };
    }
    if (/al empezar|al iniciar|cuando empiece|al principio/.test(f)) ev = { op:'al_empezar', args:{} };

    const acts = [];
    const lento = /lentamente|despacio|poco a poco|suave/.test(f);
    const rapido = /r[aá]pido|deprisa|de golpe|veloz/.test(f);
    const k = lento ? .5 : (rapido ? 2 : 1);
    const add = (op, args) => acts.push({ id:uid(), op:op, args:args });
    const repite = (n, op, args) => acts.push({ id:uid(), op:'repetir', args:{ n:n },
      body:[{ id:uid(), op:op, args:args }] });

    if ((m = f.match(/abrir|abre|subir|sube|levantar/))) repite(Math.round(24 / k), 'mover', { x:0, y:.12 * 1, z:0 });
    if ((m = f.match(/cerrar|cierra|bajar|baja/))) repite(Math.round(24 / k), 'mover', { x:0, y:-.12, z:0 });
    if ((m = f.match(/gir\w+(?:\s+([\d.,]+))?/))) add('girar', { g:(m[1] ? nump(m[1], 15) : 15) * k, eje:'y' });
    if (/persegui|persigue|seguir al jugador|ir a por|acercarse al jugador/.test(f)) add('hacia_jugador', { vel:3 * k });
    if (/huir|huye|escapar|alejarse/.test(f)) add('huir', { vel:4 * k });
    if (/saltar|salta/.test(f)) add('saltar', { f:9 });
    if ((m = f.match(/avanz\w+(?:\s+([\d.,]+))?/))) add('avanzar', { d:(m[1] ? nump(m[1], 1) : 1) * k });
    if ((m = f.match(/(?:sumar|dar|ganar)\s+([\d.,]+)\s+puntos?/))) add('puntos', { n:nump(m[1], 10) });
    if ((m = f.match(/quitar\s+([\d.,]+)\s+(?:de\s+)?vida/))) add('quitar_vida', { n:nump(m[1], 10) });
    if ((m = f.match(/curar\s+([\d.,]+)|dar\s+([\d.,]+)\s+de\s+vida/))) add('curar', { n:nump(m[1] || m[2], 20) });
    if ((m = f.match(/(?:decir|mostrar|escribir)\s+["“']?([^"”']{2,60})/))) add('mensaje', { txt:m[1].trim() });
    if ((m = f.match(/(?:sonar|sonido|reproducir)\s+(?:el\s+sonido\s+)?([\w-]+)/))) add('sonido', { nombre:m[1] });
    if ((m = f.match(/esperar\s+([\d.,]+)/))) add('esperar', { seg:nump(m[1], 1) });
    if ((m = f.match(/crear\s+(?:una\s+copia\s+de\s+|un[ao]?\s+)?([\w áéíóú-]{2,24})/))) add('crear', { nombre:m[1].trim() });
    if ((m = f.match(/enviar\s+(?:la\s+)?se[nñ]al\s+([\w-]+)/))) add('senal', { senal:m[1] });
    if ((m = f.match(/color\s+(?:a\s+)?([a-záéíóú]+)|ponerse\s+(?:de\s+color\s+)?([a-záéíóú]+)/))) {
      const c = COLORES[(m[1] || m[2] || '').trim()]; if (c) add('color', { color:c });
    }
    if (/desaparecer|destruir|eliminar|morir/.test(f)) add('destruir', {});
    if (/esconder|ocultar/.test(f)) add('ocultar', {});
    if (/aparecer|mostrarse/.test(f)) add('mostrar', {});
    if ((m = f.match(/anima\w*\s+(?:la\s+animaci[oó]n\s+)?([\w-]+)/))) add('animar', { clip:m[1] });
    if ((m = f.match(/sumar\s+([\d.,]+)\s+a\s+(?:la\s+variable\s+)?([\w-]+)/))) add('sumar_var', { v:nump(m[1], 1), n:m[2] });
    if (/ganar la partida|ganas|victoria/.test(f)) add('ganar', { msg:'¡Has ganado!' });
    if (/perder la partida|pierdes|derrota/.test(f)) add('perder', { msg:'Fin de la partida' });
    if (!acts.length) return;

    let cuerpo = acts;
    if ((m = f.match(/([\d.,]+)\s*(?:%|por ciento)/))) {
      cuerpo = [{ id:uid(), op:'si_azar', args:{ p:nump(m[1], 50) }, body:acts }];
    }
    out.push({ id:uid(), op:ev.op, args:ev.args, body:cuerpo });
  });
  return out;
}

  $('#lgTxt').oninput = prev; prev();

    $('#modal').classList.remove('on');
    setMode('blocks'); renderBlocks(); renderScriptObjects(); markDirty();
    toast(st.length + ' pila(s) de bloques creadas');
    log('Texto convertido en ' + st.length + ' pila(s) de bloques para ' + o.name, 'ok');
  };
}


/* ============================================================
   Director IA · dirige la partida en tiempo real
   ============================================================ */
const GENRES = {
  terror:   { l:'Terror',       ritmo:9,  eventos:['flicker','apagon','ruido','aparicion','niebla','silencio'] },
  accion:   { l:'Acción',       ritmo:6,  eventos:['oleada','refuerzo','botin','ruido'] },
  supervivencia:{ l:'Supervivencia', ritmo:11, eventos:['oleada','botin','niebla','apagon'] },
  misterio: { l:'Misterio',     ritmo:12, eventos:['pista','puerta','ruido','flicker'] },
  aventura: { l:'Aventura',     ritmo:10, eventos:['botin','pista','refuerzo'] },
  comedia:  { l:'Comedia',      ritmo:7,  eventos:['gag','botin','ruido'] }
};
const Director = {
  on:false, t:0, tension:0, last:0, hist:[], base:null, timers:[],

  start(R){
    const d = P.director || {};
    this.on = !!d.on; this.t = 0; this.tension = .15; this.last = 0; this.hist = []; this.timers = [];
    this.base = { hemi:hemi.intensity, sun:sun.intensity, fog:scene.fog ? scene.fog.far : 0 };
    if (this.on) this.say('Director en modo ' + (GENRES[d.genre] || GENRES.terror).l);
  },
  stop(){
    if (this.base) { hemi.intensity = this.base.hemi; sun.intensity = this.base.sun;
      if (scene.fog) scene.fog.far = this.base.fog; }
    this.timers.forEach(t => clearTimeout(t)); this.timers = [];
    this.on = false;
  },
  say(m){ this.hist.unshift(new Date().toLocaleTimeString('es-ES') + ' · ' + m);
    this.hist = this.hist.slice(0, 12); const p = document.getElementById('dirLog');
    if (p) p.innerHTML = this.hist.map(x => '<div>' + x + '</div>').join(''); },

  tick(dt, R){
    if (!this.on || !R.player) return;
    const d = P.director || {}, gen = GENRES[d.genre] || GENRES.terror;
    const inten = d.intensity !== undefined ? d.intensity : .5;
    this.t += dt; this.last += dt;
    /* lee cómo está jugando */
    const p = R.player.o.position;
    if (!this._prev) this._prev = p.clone();
    const v = p.distanceTo(this._prev) / Math.max(dt, .001); this._prev.copy(p);
    this._vel = (this._vel || 0) * .9 + v * .1;
    const quieto = this._vel < 1.2;
    const herido = R.state.hp < R.state.hpmax * .35;
    /* la tensión sube sola y baja tras cada susto */
    const ritmo = gen.ritmo * (1.6 - inten);
    this.tension = clamp(this.tension + dt / ritmo * (quieto ? 1.5 : 1) * (herido ? .5 : 1), 0, 1);
    const meter = document.getElementById('dirMeter');
    if (meter) meter.style.width = (this.tension * 100).toFixed(0) + '%';
    if (this.tension >= 1 && this.last > 2.5) {
      this.tension = .1; this.last = 0;
      const ev = gen.eventos[Math.floor(Math.random() * gen.eventos.length)];
      this.fire(ev, R, quieto, inten);
    }
  },

  fire(ev, R, quieto, inten){
    const p = R.player.o.position;
    const dir = new THREE.Vector3(); R.cam.getWorldDirection(dir); dir.y = 0; dir.normalize();
    const detras = p.clone().addScaledVector(dir, quieto ? -7 : 9);
    switch (ev) {
      case 'flicker': {
        this.say('Parpadeo de luces');
        let n = 0;
        const blink = () => {
          hemi.intensity = n % 2 ? this.base.hemi : this.base.hemi * .12;
          sun.intensity = n % 2 ? this.base.sun : this.base.sun * .15;
          if (n++ < 9) this.timers.push(setTimeout(blink, 80 + Math.random() * 130));
          else { hemi.intensity = this.base.hemi; sun.intensity = this.base.sun; }
        };
        blink(); R.sfx('error'); break;
      }
      case 'apagon': {
        this.say('Apagón');
        hemi.intensity = this.base.hemi * .08; sun.intensity = this.base.sun * .1;
        this.timers.push(setTimeout(() => { hemi.intensity = this.base.hemi; sun.intensity = this.base.sun; }, 2600 + inten * 2500));
        R.sfx('puerta'); break;
      }
      case 'ruido': this.say('Ruido ' + (quieto ? 'detrás del jugador' : 'más adelante')); R.sfx(Math.random() < .5 ? 'golpe' : 'puerta'); R.shake = Math.max(R.shake, .06); break;
      case 'silencio': this.say('Silencio incómodo'); this.tension = .45; break;
      case 'niebla': {
        this.say('La niebla se cierra');
        if (scene.fog) { const f0 = scene.fog.far; scene.fog.far = Math.max(14, f0 * .35);
          this.timers.push(setTimeout(() => { if (scene.fog) scene.fog.far = f0; }, 6000)); }
        break;
      }
      case 'aparicion': {
        const nombre = (P.director && P.director.monstruo) || this.guessEnemy();
        const e = nombre && R.cloneByName(nombre, detras.clone().setY(p.y));
        if (e) {
          this.say('Aparición fugaz de ' + nombre + (quieto ? ' a la espalda' : ' en el camino'));
          R.sfx('explosion');
          this.timers.push(setTimeout(() => { if (!e.dead) R.remove(e); }, 1400 + inten * 1600));
        } else this.fire('ruido', R, quieto, inten);
        break;
      }
      case 'oleada': case 'refuerzo': {
        const nombre = (P.director && P.director.monstruo) || this.guessEnemy();
        if (!nombre) { this.fire('botin', R, quieto, inten); break; }
        const n = ev === 'oleada' ? Math.round(1 + inten * 3) : 1;
        for (let i = 0; i < n; i++) {
          const a = Math.random() * 6.28, r = 12 + Math.random() * 8;
          R.cloneByName(nombre, new THREE.Vector3(p.x + Math.cos(a) * r, p.y + 1, p.z + Math.sin(a) * r));
        }
        this.say((ev === 'oleada' ? 'Oleada de ' : 'Refuerzo: ') + n + ' x ' + nombre);
        R.sfx('laser'); break;
      }
      case 'botin': {
        const nombre = this.guessPickup();
        if (nombre) { R.cloneByName(nombre, detras.clone().setY(p.y + 1)); this.say('Recompensa cerca: ' + nombre); R.sfx('poder'); }
        else { R.state.hp = Math.min(R.state.hpmax, R.state.hp + 15); this.say('Respiro: el jugador recupera vida'); }
        break;
      }
      case 'pista': {
        const pistas = ['Algo se ha movido por aquí', 'Huellas frescas', 'Se oye un motor lejano',
          'Una puerta ha chirriado', 'Hay marcas en la pared'];
        R.flash(pistas[Math.floor(Math.random() * pistas.length)], 2400);
        this.say('Pista para el jugador'); break;
      }
      case 'puerta': {
        const s = 'director'; R.signals[s] = true;
        this.say('Se activa la señal "director"'); R.sfx('puerta'); break;
      }
      case 'gag': {
        const list = R.ents.filter(e => !e.dead && e !== R.player && e.d.type === 'mesh');
        if (list.length) {
          const e = list[Math.floor(Math.random() * list.length)];
          const s0 = e.o.scale.clone();
          e.o.scale.multiplyScalar(2.2); R.sfx('moneda');
          this.timers.push(setTimeout(() => e.o.scale.copy(s0), 2200));
          this.say('Broma visual con ' + e.d.name);
        }
        break;
      }
    }
  },
  guessEnemy(){
    const o = P.objects.find(x => (x.behaviors || []).some(b => b.id === 'chase' || b.id === 'shooter' || b.id === 'turret'));
    return o ? o.name : null;
  },
  guessPickup(){
    const o = P.objects.find(x => (x.behaviors || []).some(b => b.id === 'pickup' || b.id === 'healPickup'));
    return o ? o.name : null;
  }
};

/* ============================================================
   Simulador de jugadores y mapa de aburrimiento
   ============================================================ */
const Sim = {
  cell:2.5, grid:null, show:false, result:null,

  poiOf(o){
    const ids = (o.behaviors || []).map(b => b.id);
    if (ids.indexOf('winZone') >= 0) return { w:6, l:'meta' };
    if (ids.indexOf('pickup') >= 0 || ids.indexOf('healPickup') >= 0) return { w:3, l:'recogible' };
    if (ids.indexOf('key') >= 0 || ids.indexOf('button') >= 0 || ids.indexOf('door') >= 0) return { w:4, l:'interacción' };
    if (ids.indexOf('chase') >= 0 || ids.indexOf('shooter') >= 0 || ids.indexOf('turret') >= 0) return { w:4, l:'enemigo' };
    if (ids.indexOf('checkpoint') >= 0 || ids.indexOf('teleport') >= 0) return { w:3, l:'control' };
    if (o.script && o.script.length) return { w:3, l:'guion' };
    return null;
  },
  build(){
    const c = this.cell;
    let min = new THREE.Vector3(1e9, 0, 1e9), max = new THREE.Vector3(-1e9, 0, -1e9);
    const boxes = [];
    P.objects.forEach(o => {
      const m = meshes[o.id]; if (!m || o.visible === false) return;
      const b = new THREE.Box3().setFromObject(m);
      if (!isFinite(b.min.x)) return;
      min.x = Math.min(min.x, b.min.x); min.z = Math.min(min.z, b.min.z);
      max.x = Math.max(max.x, b.max.x); max.z = Math.max(max.z, b.max.z);
      const solido = !(o.behaviors || []).some(x => NONSOLID.indexOf(x.id) >= 0) && o.type !== 'light' && o.type !== 'spawn';
      boxes.push({ o:o, b:b, solido:solido, poi:this.poiOf(o) });
    });
    if (P.world.ground) {
      const s = P.world.groundSize / 2;
      min.x = Math.max(min.x, -s); min.z = Math.max(min.z, -s);
      max.x = Math.min(max.x, s); max.z = Math.min(max.z, s);
    }
    if (!isFinite(min.x) || max.x - min.x < c) return null;
    const nx = Math.min(90, Math.ceil((max.x - min.x) / c)), nz = Math.min(90, Math.ceil((max.z - min.z) / c));
    const g = { nx:nx, nz:nz, x0:min.x, z0:min.z, c:c, blocked:new Uint8Array(nx * nz),
      interest:new Float32Array(nx * nz), traffic:new Float32Array(nx * nz), dist:new Int32Array(nx * nz).fill(-1), pois:[] };
    boxes.forEach(it => {
      const cx0 = Math.floor((it.b.min.x - min.x) / c), cx1 = Math.floor((it.b.max.x - min.x) / c);
      const cz0 = Math.floor((it.b.min.z - min.z) / c), cz1 = Math.floor((it.b.max.z - min.z) / c);
      const alto = it.b.max.y - it.b.min.y;
      const bloquea = it.solido && alto > .8 && it.b.max.y > 1.2 && it.b.min.y < 2;
      for (let x = Math.max(0, cx0); x <= Math.min(nx - 1, cx1); x++) {
        for (let z = Math.max(0, cz0); z <= Math.min(nz - 1, cz1); z++) {
          if (bloquea) g.blocked[z * nx + x] = 1;
        }
      }
      if (it.poi) {
        g.pois.push({ x:clamp(Math.floor((it.o.pos[0] - min.x) / c), 0, nx - 1),
          z:clamp(Math.floor((it.o.pos[2] - min.z) / c), 0, nz - 1), w:it.poi.w, l:it.poi.l, name:it.o.name });
      }
    });
    this.grid = g;
    return g;
  },
  bfs(g, sx, sz){
    const d = new Int32Array(g.nx * g.nz).fill(-1);
    const q = [sz * g.nx + sx]; d[q[0]] = 0;
    for (let h = 0; h < q.length; h++) {
      const i = q[h], x = i % g.nx, z = (i / g.nx) | 0;
      const nb = [[x + 1, z],[x - 1, z],[x, z + 1],[x, z - 1]];
      for (let k = 0; k < 4; k++) {
        const a = nb[k][0], b = nb[k][1];
        if (a < 0 || b < 0 || a >= g.nx || b >= g.nz) continue;
        const j = b * g.nx + a;
        if (g.blocked[j] || d[j] >= 0) continue;
        d[j] = d[i] + 1; q.push(j);
      }
    }
    return d;
  },
  run(){
    const g = this.build();
    if (!g) { toast('La escena es demasiado pequeña para simular'); return null; }
    const spawn = P.objects.find(o => o.type === 'spawn')
      || P.objects.find(o => (o.behaviors || []).some(b => b.id.indexOf('player') === 0));
    if (!spawn) { toast('Necesitas un jugador o un punto de inicio'); return null; }
    let sx = clamp(Math.floor((spawn.pos[0] - g.x0) / g.c), 0, g.nx - 1);
    let sz = clamp(Math.floor((spawn.pos[2] - g.z0) / g.c), 0, g.nz - 1);
    if (g.blocked[sz * g.nx + sx]) g.blocked[sz * g.nx + sx] = 0;
    const dStart = g.dist = this.bfs(g, sx, sz);
    /* si un punto cae justo encima de su propio objeto, se busca el hueco libre de al lado */
    g.pois.forEach(p => {
      if (dStart[p.z * g.nx + p.x] >= 0) return;
      let best = null, bd = 1e9;
      for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) {
        const a = p.x + dx, b = p.z + dz;
        if (a < 0 || b < 0 || a >= g.nx || b >= g.nz) continue;
        const j = b * g.nx + a;
        if (dStart[j] < 0) continue;
        const d2 = dx * dx + dz * dz;
        if (d2 < bd) { bd = d2; best = [a, b]; }
      }
      if (best) { p.x = best[0]; p.z = best[1]; }
    });
    /* interes: cercania ponderada a los puntos que hacen algo */
    for (let i = 0; i < g.nx * g.nz; i++) {
      if (g.blocked[i]) continue;
      const x = i % g.nx, z = (i / g.nx) | 0; let s = 0;
      g.pois.forEach(p => { const d2 = Math.hypot(x - p.x, z - p.z); s += p.w * Math.exp(-(d2 * d2) / 26); });
      g.interest[i] = s;
    }
    /* recorridos simulados: cada visita camina hacia un punto de interes */
    const alcanzables = g.pois.filter(p => dStart[p.z * g.nx + p.x] >= 0);
    const inalcanzables = g.pois.filter(p => dStart[p.z * g.nx + p.x] < 0);
    let pasos = 0;
    const N = 160;
    if (alcanzables.length) {
      const mapas = alcanzables.map(p => this.bfs(g, p.x, p.z));
      for (let n = 0; n < N; n++) {
        let cx = sx, cz = sz, guard = 0;
        const orden = alcanzables.map((p, i) => i).sort(() => Math.random() - .5).slice(0, 3);
        orden.forEach(oi => {
          const dm = mapas[oi];
          while (guard++ < 600) {
            const i = cz * g.nx + cx;
            g.traffic[i]++; pasos++;
            if (dm[i] <= 0) break;
            let best = -1, bx = cx, bz = cz;
            [[cx + 1, cz],[cx - 1, cz],[cx, cz + 1],[cx, cz - 1]].forEach(nb => {
              const a = nb[0], b = nb[1];
              if (a < 0 || b < 0 || a >= g.nx || b >= g.nz) return;
              const j = b * g.nx + a; if (g.blocked[j] || dm[j] < 0) return;
              const score = -dm[j] + (Math.random() < .12 ? 3 : 0);
              if (best === -1 || score > best) { best = score; bx = a; bz = b; }
            });
            if (bx === cx && bz === cz) break;
            cx = bx; cz = bz;
          }
        });
      }
    }
    /* informe */
    let libres = 0, alcanz = 0, aburridas = 0, maxT = 0, maxI = 0;
    for (let i = 0; i < g.nx * g.nz; i++) {
      if (g.blocked[i]) continue;
      libres++;
      if (dStart[i] >= 0) alcanz++;
      maxT = Math.max(maxT, g.traffic[i]); maxI = Math.max(maxI, g.interest[i]);
    }
    for (let i = 0; i < g.nx * g.nz; i++) {
      if (g.blocked[i] || dStart[i] < 0) continue;
      if (g.traffic[i] > maxT * .12 && g.interest[i] < maxI * .18) aburridas++;
    }
    const avisos = [];
    const hayJugador = P.objects.some(o => (o.behaviors || []).some(b => b.id.indexOf('player') === 0 || b.id === 'vehicle' || b.id === 'flyCam'));
    const hayMeta = P.objects.some(o => (o.behaviors || []).some(b => b.id === 'winZone' || b.id === 'scoreGoal'));
    if (!hayJugador) avisos.push(['bad', 'No hay ningún objeto con control de jugador: la partida no se puede jugar.']);
    if (!hayMeta) avisos.push(['warn', 'No hay forma de ganar: añade una Meta o la mecánica Ganar por puntos.']);
    inalcanzables.forEach(p => avisos.push(['bad', 'No se puede llegar a "' + p.name + '" (' + p.l + '): está aislado o rodeado de obstáculos.']));
    const cob = libres ? Math.round(alcanz / libres * 100) : 0;
    if (cob < 70 && libres > 20) avisos.push(['warn', 'Solo se puede recorrer el ' + cob + '% del escenario. Hay zonas cerradas.']);
    if (aburridas > alcanz * .3) avisos.push(['warn', 'Un ' + Math.round(aburridas / Math.max(1, alcanz) * 100) +
      '% de las zonas que se recorren no tienen nada que hacer. Reparte objetos o enemigos por ahí.']);
    if (!g.pois.length) avisos.push(['warn', 'No hay nada con lo que interactuar en todo el mapa.']);
    if (!avisos.length) avisos.push(['good', 'Sin problemas: el nivel es recorrible y tiene cosas repartidas.']);
    this.result = { partidas:N, pasos:pasos, cobertura:cob, pois:g.pois.length, aburridas:aburridas,
      alcanz:alcanz, avisos:avisos, maxT:maxT, maxI:maxI };
    return this.result;
  },
  color(i){
    const g = this.grid;
    if (g.blocked[i]) return null;
    if (g.dist[i] < 0) return 'rgba(70,80,105,.55)';
    const t = g.traffic[i] / Math.max(1, this.result.maxT);
    const inter = g.interest[i] / Math.max(.001, this.result.maxI);
    if (t < .04) return 'rgba(70,80,105,.35)';
    if (inter > .45) return 'rgba(65,201,142,.55)';
    if (inter > .15) return 'rgba(245,200,66,.5)';
    return 'rgba(229,86,106,.55)';
  },
  draw(){
    const cv = document.getElementById('heat'); if (!cv || !this.grid || !this.result) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, w, h);
    const g = this.grid, cam = editorCam, v = new THREE.Vector3();
    const proj = (x, z) => { v.set(x, .1, z).project(cam); return [(v.x * .5 + .5) * w, (-v.y * .5 + .5) * h, v.z]; };
    for (let i = 0; i < g.nx * g.nz; i++) {
      const col = this.color(i); if (!col) continue;
      const cx = i % g.nx, cz = (i / g.nx) | 0;
      const x0 = g.x0 + cx * g.c, z0 = g.z0 + cz * g.c;
      const a = proj(x0, z0), b = proj(x0 + g.c, z0), c = proj(x0 + g.c, z0 + g.c), d = proj(x0, z0 + g.c);
      if (a[2] > 1 || b[2] > 1 || c[2] > 1 || d[2] > 1) continue;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]);
      ctx.closePath(); ctx.fill();
    }
  },
  toggle(on){
    this.show = on === undefined ? !this.show : on;
    const cv = document.getElementById('heat');
    if (cv) cv.classList.toggle('hidden', !this.show || !this.result);
  }
};

/* ============================================================
   Fisica con impulsos y navegacion con rodeo de obstaculos
   ============================================================ */
const Phys = {
  bodies:[],
  start(R){ this.bodies = []; },
  add(e, p){
    e.rt.body = { v:new THREE.Vector3(), w:new THREE.Vector3(), masa:p.masa || 1,
      rebote:p.rebote || 0, roce:p.roce !== undefined ? p.roce : .55, dormido:0 };
    this.bodies.push(e);
  },
  impulso(e, v){
    if (!e.rt.body) return;
    e.rt.body.v.add(v.clone().divideScalar(Math.max(.05, e.rt.body.masa)));
    e.rt.body.dormido = 0;
  },
  explosion(R, centro, fuerza, radio){
    this.bodies.forEach(e => {
      if (e.dead) return;
      const d = e.o.position.clone().sub(centro);
      const dist = d.length();
      if (dist > radio) return;
      d.normalize().multiplyScalar(fuerza * (1 - dist / radio));
      d.y += fuerza * .35 * (1 - dist / radio);
      this.impulso(e, d);
    });
    if (R.player) {
      const d = R.player.o.position.clone().sub(centro);
      if (d.length() < radio) { R.player.rt.vy = Math.max(R.player.rt.vy || 0, fuerza * .35); R.shake = Math.max(R.shake, .25); }
    }
  },
  tick(dt, R){
    for (let i = 0; i < this.bodies.length; i++) {
      const e = this.bodies[i]; if (e.dead) continue;
      const b = e.rt.body;
      if (b.dormido > 1.2 && b.v.lengthSq() < .01) continue;
      b.v.y -= R.gravity * dt;
      const antes = e.o.position.clone();
      R.moveWithCollision(e, b.v.x * dt, b.v.y * dt, b.v.z * dt);
      const real = e.o.position.clone().sub(antes);
      /* rebote y rozamiento al chocar */
      if (e.rt.hitY) {
        if (b.v.y < -1.2 && b.rebote > 0) { b.v.y = -b.v.y * b.rebote; R.sfx('golpe'); }
        else b.v.y = 0;
        b.v.x *= (1 - b.roce * dt * 6); b.v.z *= (1 - b.roce * dt * 6);
        b.w.multiplyScalar(1 - b.roce * dt * 3);
      }
      if (Math.abs(real.x) < Math.abs(b.v.x * dt) * .5) b.v.x *= -b.rebote;
      if (Math.abs(real.z) < Math.abs(b.v.z * dt) * .5) b.v.z *= -b.rebote;
      /* giro por rodadura */
      b.w.set(b.v.z * .6, b.w.y * .96, -b.v.x * .6);
      e.o.rotation.x += b.w.x * dt; e.o.rotation.y += b.w.y * dt; e.o.rotation.z += b.w.z * dt;
      /* el jugador empuja */
      if (R.player) {
        const d = e.o.position.clone().sub(R.player.o.position); d.y = 0;
        const r = (R.size(e).x + R.size(R.player).x) * .55;
        if (d.length() < r && d.length() > .001) {
          d.normalize().multiplyScalar((r - d.length()) * 14 / Math.max(.2, b.masa));
          b.v.x += d.x * dt * 9; b.v.z += d.z * dt * 9; b.dormido = 0;
        }
      }
      b.dormido = b.v.lengthSq() < .05 ? b.dormido + dt : 0;
    }
  }
};

/* ---------- Navegacion con rodeo (A*) ---------- */
const Nav = {
  grid:null, c:2,
  build(R){
    const c = this.c;
    let min = new THREE.Vector3(1e9, 0, 1e9), max = new THREE.Vector3(-1e9, 0, -1e9);
    const cajas = [];
    R.solids.forEach(s => {
      const b = s.box; if (!b) return;
      const alto = b.max.y - b.min.y;
      if (alto > .8 && b.max.y > 1.2 && b.min.y < 2) cajas.push(b);
      min.x = Math.min(min.x, b.min.x); min.z = Math.min(min.z, b.min.z);
      max.x = Math.max(max.x, b.max.x); max.z = Math.max(max.z, b.max.z);
    });
    if (!isFinite(min.x)) return null;
    min.x -= 6; min.z -= 6; max.x += 6; max.z += 6;
    const nx = Math.min(120, Math.ceil((max.x - min.x) / c)), nz = Math.min(120, Math.ceil((max.z - min.z) / c));
    const bl = new Uint8Array(nx * nz);
    cajas.forEach(b => {
      const x0 = Math.floor((b.min.x - min.x) / c) - 1, x1 = Math.floor((b.max.x - min.x) / c) + 1;
      const z0 = Math.floor((b.min.z - min.z) / c) - 1, z1 = Math.floor((b.max.z - min.z) / c) + 1;
      for (let x = Math.max(0, x0); x <= Math.min(nx - 1, x1); x++)
        for (let z = Math.max(0, z0); z <= Math.min(nz - 1, z1); z++) bl[z * nx + x] = 1;
    });
    this.grid = { nx:nx, nz:nz, x0:min.x, z0:min.z, c:c, bl:bl };
    return this.grid;
  },
  cellOf(g, p){
    return [clamp(Math.floor((p.x - g.x0) / g.c), 0, g.nx - 1), clamp(Math.floor((p.z - g.z0) / g.c), 0, g.nz - 1)];
  },
  path(R, from, to){
    const g = this.grid || this.build(R); if (!g) return null;
    const a = this.cellOf(g, from), b = this.cellOf(g, to);
    const si = a[1] * g.nx + a[0], ti = b[1] * g.nx + b[0];
    if (si === ti) return [to.clone()];
    const open = [si], came = {}, gs = {}, fs = {};
    gs[si] = 0; fs[si] = 0;
    const h = i => { const x = i % g.nx, z = (i / g.nx) | 0; return Math.hypot(x - b[0], z - b[1]); };
    let guard = 0;
    while (open.length && guard++ < 4000) {
      let bi = 0;
      for (let k = 1; k < open.length; k++) if (fs[open[k]] < fs[open[bi]]) bi = k;
      const cur = open.splice(bi, 1)[0];
      if (cur === ti) {
        const out = []; let n = cur;
        while (n !== undefined && n !== si) {
          const x = n % g.nx, z = (n / g.nx) | 0;
          out.unshift(new THREE.Vector3(g.x0 + (x + .5) * g.c, from.y, g.z0 + (z + .5) * g.c));
          n = came[n];
        }
        out.push(to.clone());
        return out;
      }
      const x = cur % g.nx, z = (cur / g.nx) | 0;
      for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
        if (!dx && !dz) continue;
        const nx2 = x + dx, nz2 = z + dz;
        if (nx2 < 0 || nz2 < 0 || nx2 >= g.nx || nz2 >= g.nz) continue;
        const j = nz2 * g.nx + nx2;
        if (g.bl[j] && j !== ti) continue;
        const cost = gs[cur] + (dx && dz ? 1.41 : 1);
        if (gs[j] === undefined || cost < gs[j]) {
          gs[j] = cost; fs[j] = cost + h(j) * 1.1; came[j] = cur;
          if (open.indexOf(j) < 0) open.push(j);
        }
      }
    }
    return null;
  }
};
BEHAVIORS.push({
  id:'navegar', name:'Perseguir rodeando obstáculos', cat:'Enemigos',
  desc:'Busca el camino hasta el jugador esquivando muros en vez de empotrarse contra ellos.',
  params:[{ k:'speed', l:'Velocidad', t:'num', d:3.4 },{ k:'range', l:'Radio de detección', t:'num', d:26 },
          { k:'stop', l:'Distancia a la que para', t:'num', d:1.4 },{ k:'recalc', l:'Recalcula cada (seg)', t:'num', d:.7 }],
  init(e, p, R){ e.rt.ruta = null; e.rt.rt2 = 0; },
  update(e, p, dt, R){
    if (!R.player) return;
    const dist = e.o.position.distanceTo(R.player.o.position);
    if (dist > p.range || dist < p.stop) return;
    e.rt.rt2 -= dt;
    if (e.rt.rt2 <= 0 || !e.rt.ruta || !e.rt.ruta.length) {
      e.rt.rt2 = p.recalc;
      Nav.build(R);
      e.rt.ruta = Nav.path(R, e.o.position, R.player.o.position) || [R.player.o.position.clone()];
    }
    const t = e.rt.ruta[0];
    if (!t) return;
    const d = t.clone().sub(e.o.position); d.y = 0;
