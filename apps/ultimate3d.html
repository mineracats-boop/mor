<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULTIMATE3D — Estudio de juegos 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --void:#080A0F; --steel:#101520; --panel:#151B29; --raise:#1C2434; --raise2:#242E43;
  --edge:#222B3D; --edge2:#33405C;
  --ink:#E6EBF4; --mute:#8794AE; --dim:#5A6680;
  --amber:#F59E42; --amber-lo:rgba(245,158,66,.13);
  --cyan:#3BA9E8; --green:#41C98E; --red:#E5566A; --violet:#9D86F0;
  --top:44px; --bot:206px; --left:236px; --right:306px;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:Inter,system-ui,sans-serif;
  font-size:12.5px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;flex:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#28324a;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4867}
:focus-visible{outline:1.5px solid var(--cyan);outline-offset:1px}
.hidden{display:none!important}

#app{display:grid;height:100vh;gap:1px;background:#04060A;
  grid-template-columns:var(--left) 1fr var(--right);
  grid-template-rows:var(--top) 1fr var(--bot);
  grid-template-areas:"top top top" "left view right" "bot bot bot"}

/* barra superior */
#top{grid-area:top;background:var(--steel);display:flex;align-items:center;gap:10px;padding:0 10px}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;letter-spacing:.08em;
  color:var(--ink);padding-right:4px}
.brand i{font-style:normal;color:var(--amber)}
.vsep{width:1px;height:22px;background:var(--edge)}
.seg{display:flex;background:var(--void);border:1px solid var(--edge);border-radius:var(--r);padding:2px;gap:2px}
.seg button{background:transparent;border:0;border-radius:4px;padding:5px 12px;color:var(--mute);
  display:flex;align-items:center;gap:6px;letter-spacing:.01em}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--raise2);color:var(--ink)}
.seg.icons button{padding:5px 9px}
.tbtn{background:var(--raise);border:1px solid var(--edge);border-radius:var(--r);padding:5px 10px;
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:var(--raise2);border-color:var(--edge2)}
.tbtn.primary{background:var(--amber);border-color:#FFB469;color:#1A0E02;font-weight:600}
.tbtn.primary:hover{filter:brightness(1.07)}
.tbtn.danger{background:var(--red);border-color:#FF7D8C;color:#fff;font-weight:600}
.tbtn.ghost{background:transparent}
#status{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.dot.busy{background:var(--amber)}

/* paneles */
.pane{background:var(--steel);display:flex;flex-direction:column;overflow:hidden;min-height:0}
#left{grid-area:left}#right{grid-area:right}#bot{grid-area:bot;background:var(--steel);
  display:flex;flex-direction:column;min-height:0}
.phead{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:0 10px;
  background:var(--panel);border-bottom:1px solid var(--edge);color:#A9B6CE}
.phead h2{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.07em}
.phead .right{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--dim);font-size:10.5px}
.pbody{flex:1;overflow:auto;padding:8px;min-height:0}
.split{flex:none;border-top:1px solid var(--edge)}

/* visor */
#view{grid-area:view;position:relative;background:var(--void);overflow:hidden}
#cv{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;pointer-events:none;flex-wrap:wrap}
.chip{background:rgba(8,10,15,.8);border:1px solid var(--edge);border-radius:5px;padding:3px 8px;
  font-size:10.5px;color:var(--mute)}
.chip b{color:var(--ink);font-weight:500}
#modeTag{position:absolute;top:10px;left:10px;font-family:'Barlow Condensed',sans-serif;
  letter-spacing:.12em;font-size:12px;color:var(--dim)}
#playHint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(8,10,15,.9);
  border:1px solid var(--edge2);border-radius:5px;padding:5px 12px;color:var(--mute);display:none;font-size:11px}
#playHud{position:absolute;top:12px;left:12px;display:none;flex-direction:column;gap:6px}
.stat{background:rgba(8,10,15,.82);border:1px solid var(--edge);border-radius:6px;padding:6px 11px;min-width:124px}
.stat small{display:block;color:var(--dim);font-size:10px}
.stat b{font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:.02em}
.bar{height:5px;background:#26314a;border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green)}

/* listas */
.node{display:flex;align-items:center;gap:8px;padding:4px 7px;border-radius:5px;border:1px solid transparent}
.node:hover{background:var(--raise)}
.node.sel{background:var(--amber-lo);border-color:rgba(245,158,66,.4)}
.node svg{color:var(--dim)}
.node.sel svg{color:var(--amber)}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .bdg{font-size:9.5px;color:var(--violet);border:1px solid rgba(157,134,240,.35);border-radius:3px;padding:0 4px}
.node .ghost{opacity:.4}
.iconbtn{background:transparent;border:0;color:var(--dim);padding:2px;border-radius:4px;display:flex}
.iconbtn:hover{color:var(--ink);background:var(--raise2)}
.empty{color:var(--dim);text-align:center;padding:20px 12px;line-height:1.6}

/* rejilla de creación */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cell{background:var(--raise);border:1px solid var(--edge);border-radius:var(--r);padding:8px 3px;
  display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--mute);transition:.12s}
.cell:hover{background:var(--raise2);border-color:var(--edge2);color:var(--ink)}
.cell span{font-size:9.5px;text-align:center;line-height:1.2}
.lbl{font-size:10px;color:var(--dim);letter-spacing:.09em;margin:11px 0 6px}
.lbl:first-child{margin-top:0}

/* inspector */
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--edge);flex:none}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 2px;
  color:var(--mute);font-size:11.5px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--amber);background:var(--amber-lo)}
.field{margin-bottom:9px}
.field label{display:block;font-size:10.5px;color:var(--mute);margin-bottom:3px}
.inp{width:100%;background:var(--void);border:1px solid var(--edge);border-radius:5px;padding:5px 7px}
.inp:focus{border-color:var(--cyan)}
select.inp{cursor:pointer}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.axis{position:relative}
.axis em{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-style:normal;font-size:9.5px;
  color:var(--dim);pointer-events:none}
.axis input{padding-left:17px}
.ax-x em{color:#E5566A}.ax-y em{color:#41C98E}.ax-z em{color:#3BA9E8}
.row{display:flex;gap:6px;align-items:center}
.sub{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:9px;margin-bottom:8px}
.sub h4{font-size:11px;color:#A9B6CE;margin-bottom:8px;display:flex;align-items:center;gap:6px;letter-spacing:.04em}
.sub h4 .iconbtn{margin-left:auto}
.swatch{width:100%;height:26px;border:1px solid var(--edge);border-radius:5px;background:none;padding:2px}
.act{width:100%;background:var(--raise);border:1px solid var(--edge);border-radius:var(--r);padding:7px;
  margin-bottom:5px;display:flex;align-items:center;justify-content:center;gap:7px}
.act:hover{background:var(--raise2);border-color:var(--edge2)}
.act.warn:hover{border-color:var(--red);color:#FF95A1}
.act.go{background:var(--amber);border-color:#FFB469;color:#1A0E02;font-weight:600}
.act.go:hover{filter:brightness(1.07)}
.sctrl{display:grid;grid-template-columns:82px 1fr 42px;gap:7px;align-items:center;margin-bottom:6px}
.sctrl label{font-size:10.5px;color:var(--mute)}
.sctrl input[type=range]{width:100%;accent-color:var(--amber)}
.sctrl output{font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums;color:#A9B6CE}

/* dock inferior */
#botTabs{display:flex;background:var(--panel);border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);
  flex:none;align-items:center;gap:0}
#botTabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:7px 14px;
  color:var(--mute);font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.06em;
  display:flex;align-items:center;gap:7px}
#botTabs button.on{color:var(--ink);border-bottom-color:var(--amber);background:var(--steel)}
#botBody{flex:1;overflow:auto;padding:10px;min-height:0}
.tabpane{display:none}.tabpane.on{display:block}

.head{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap;align-items:center}
.pill{background:var(--raise);border:1px solid var(--edge);border-radius:14px;padding:3px 11px;
  font-size:11px;color:var(--mute)}
.pill.on{background:var(--amber-lo);border-color:var(--amber);color:#FFCE9B}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:6px}
.card2{background:var(--panel);border:1px solid var(--edge);border-left:2px solid var(--violet);
  border-radius:var(--r);padding:8px 10px}
.card2:hover{background:var(--raise);border-left-color:var(--amber)}
.card2 b{display:block;font-size:11.5px;margin-bottom:2px}
.card2 small{display:block;color:var(--dim);font-size:10.5px;line-height:1.45}

/* timeline animación */
.tl{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden}
.tlrow{display:grid;grid-template-columns:118px 1fr;border-bottom:1px solid var(--edge);height:26px}
.tlrow:last-child{border-bottom:0}
.tlrow.on .tlname{background:var(--amber-lo);color:#FFCE9B}
.tlname{display:flex;align-items:center;padding:0 9px;font-size:11px;color:var(--mute);
  border-right:1px solid var(--edge);overflow:hidden;white-space:nowrap}
.tltrack{position:relative;background:repeating-linear-gradient(90deg,transparent,transparent 9.9%,#1b2334 10%,#1b2334 10.05%)}
.key{position:absolute;top:50%;width:9px;height:9px;margin:-5px 0 0 -5px;background:var(--cyan);
  border:1px solid #0b0f18;transform:rotate(45deg)}
.key.on{background:var(--amber)}
#playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--amber);pointer-events:none}
.tlhead{display:grid;grid-template-columns:118px 1fr;background:var(--raise);height:22px;
  border-bottom:1px solid var(--edge);font-size:10px;color:var(--dim)}
.tlhead div{display:flex;align-items:center;padding:0 9px}

/* cursos */
.courses{display:grid;grid-template-columns:250px 1fr;gap:14px}
.lesson{padding:7px 9px;border-radius:5px;border:1px solid transparent;margin-bottom:3px}
.lesson:hover{background:var(--raise)}
.lesson.on{background:var(--amber-lo);border-color:rgba(245,158,66,.35)}
.lesson b{display:block;font-size:11.5px;font-weight:500}
.lesson small{color:var(--dim);font-size:10px}
.lb h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.02em;margin-bottom:5px}
.lb p{color:#AEBAD0;line-height:1.7;margin-bottom:10px;max-width:70ch}
.lb ol{margin:0 0 12px 17px;color:#AEBAD0;line-height:1.8;max-width:70ch}
.lb code{background:var(--void);border:1px solid var(--edge);border-radius:3px;padding:0 4px;color:#FFCE9B}
.modlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.modcard{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:9px}
.modcard:hover{border-color:var(--edge2)}
.modcard b{display:block;font-size:11.5px;margin-bottom:3px}
.modcard small{color:var(--dim);font-size:10px}
.modcard .row{margin-top:7px}

#log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.8;color:var(--mute)}
#log .ok{color:var(--green)}#log .er{color:var(--red)}#log .in{color:var(--cyan)}

#modal{position:fixed;inset:0;background:rgba(4,6,10,.8);display:none;align-items:center;justify-content:center;
  z-index:50;padding:20px}
#modal.on{display:flex}
.dlg{background:var(--steel);border:1px solid var(--edge2);border-radius:9px;width:min(580px,100%);
  max-height:86vh;overflow:auto}
.dlg header{padding:13px 16px;border-bottom:1px solid var(--edge);display:flex;align-items:center}
.dlg header h3{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.05em}
.dlg header .iconbtn{margin-left:auto}
.dlg .c{padding:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,12px);opacity:0;background:var(--raise2);
  border:1px solid var(--edge2);border-radius:6px;padding:8px 16px;transition:.2s;pointer-events:none;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}


/* menu contextual */
.ctx{position:fixed;z-index:80;min-width:212px;background:var(--panel);border:1px solid var(--edge2);
  border-radius:7px;padding:4px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.ctx button{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:0;
  padding:6px 9px;border-radius:5px;color:var(--ink);text-align:left}
.ctx button:hover:not(:disabled){background:var(--raise2)}
.ctx button:disabled{color:var(--dim);cursor:default}
.ctx button .sc{margin-left:auto;color:var(--dim);font-size:10.5px;font-variant-numeric:tabular-nums}
.ctx .sep{height:1px;background:var(--edge);margin:4px 2px}
.ctx .cap{padding:5px 9px 3px;font-size:10px;color:var(--dim);letter-spacing:.08em}

/* paleta de comandos */
#palette{position:fixed;inset:0;background:rgba(4,6,10,.72);z-index:90;display:none;
  align-items:flex-start;justify-content:center;padding-top:12vh}
#palette.on{display:flex}
.pal{width:min(560px,92vw);background:var(--steel);border:1px solid var(--edge2);border-radius:10px;
  overflow:hidden;box-shadow:0 26px 70px rgba(0,0,0,.6)}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--edge);
  padding:13px 15px;font-size:14px}
.pal input:focus{outline:none}
.palist{max-height:46vh;overflow:auto;padding:5px}
.palrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px}
.palrow.on{background:var(--amber-lo)}
.palrow .t{flex:1}
.palrow .g{color:var(--dim);font-size:10.5px}
.palrow .sc{color:var(--mute);font-size:10.5px}

/* teclas */
kbd{background:var(--void);border:1px solid var(--edge2);border-bottom-width:2px;border-radius:4px;
  padding:1px 6px;font-family:inherit;font-size:10.5px;color:#C4CEE2;white-space:nowrap}
.kbtable{width:100%;border-collapse:collapse}
.kbtable td{padding:5px 8px;border-bottom:1px solid var(--edge);vertical-align:middle}
.kbtable td:last-child{text-align:right;white-space:nowrap}
.kbtable tr:last-child td{border-bottom:0}
.kbgroup{font-family:'Barlow Condensed',sans-serif;letter-spacing:.07em;color:var(--amber);
  font-size:13px;padding-top:14px!important}

/* barra de estado extra */
#status .tgl{background:var(--raise);border:1px solid var(--edge);border-radius:5px;padding:3px 8px;color:var(--mute)}
#status .tgl.on{background:var(--amber-lo);border-color:var(--amber);color:#FFCE9B}
.node.sel2{background:rgba(59,169,232,.12);border-color:rgba(59,169,232,.4)}
.beh-off{opacity:.5}


/* ---- bloques ---- */
#blockCanvas{position:absolute;inset:0;background:
  radial-gradient(circle at 18px 18px, #1a2233 1.2px, transparent 1.3px) 0 0/22px 22px, #0C1018;
  overflow:auto;padding:16px}
#blockScroll{min-height:100%}
.stack{margin:0 0 20px 0;width:max-content;min-width:260px}
.blk{position:relative;border-radius:7px;padding:7px 10px;margin:0;color:#08111e;
  font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  box-shadow:0 1px 0 rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.25);cursor:grab;min-height:32px}
.blk.drag{opacity:.45}
.blk + .blk{margin-top:2px}
.blk .lbl2{white-space:nowrap}
.blk input,.blk select{background:#fff;border:1px solid rgba(0,0,0,.25);border-radius:11px;
  padding:2px 7px;color:#0d1420;font-size:11.5px;min-width:44px;max-width:120px;cursor:text}
.blk select{cursor:pointer}
.blk input[type=color]{padding:0;width:26px;height:19px;border-radius:5px}
.blk .tools{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.12s}
.blk:hover .tools{opacity:1}
.blk .tools button{background:rgba(0,0,0,.18);border:0;border-radius:4px;color:#08111e;
  padding:1px 5px;font-size:11px;line-height:1.4}
.blk .tools button:hover{background:rgba(0,0,0,.34)}
.b-ev{background:#F2B33D}.b-mov{background:#5AA9E6}.b-look{background:#9D86F0}
.b-game{background:#4FC98E}.b-snd{background:#F28C6A}.b-ctrl{background:#F2C14E}
.b-var{background:#E5798C}
.body{margin-left:15px;border-left:4px solid rgba(255,255,255,.14);padding:3px 0 3px 7px;min-height:14px}
.slot{height:9px;border-radius:5px;margin:1px 0}
.slot.on{background:var(--amber);height:5px;box-shadow:0 0 9px var(--amber)}
.palblk{border-radius:7px;padding:6px 9px;margin-bottom:4px;color:#08111e;font-size:11.5px;
  cursor:pointer;border:1px solid rgba(0,0,0,.22);line-height:1.3}
.palblk:hover{filter:brightness(1.09)}
.stackhead{display:flex;align-items:center;gap:8px;margin-bottom:5px;color:var(--dim);font-size:10.5px}
#blkEmpty{color:var(--dim);text-align:center;padding:60px 20px;line-height:1.7;max-width:46ch;margin:0 auto}
.varrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--edge);
  border-radius:6px;padding:6px 9px;margin-bottom:5px}
.varrow b{color:#E5798C}


/* ---- interfaz de juego ---- */
#uiCanvas{position:absolute;inset:0;background:#0A0D14;overflow:hidden}
#uiStage{position:absolute;inset:26px;border:1px dashed #2b3654;background:
  linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/40px 40px,#0E1420}
#uiStage::after{content:'Zona visible del juego';position:absolute;left:6px;top:-19px;
  font-size:10px;color:var(--dim);letter-spacing:.06em}
.uel{position:absolute;display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;user-select:none;cursor:move;white-space:nowrap;overflow:hidden}
.uel.sel{outline:1.5px solid var(--amber);outline-offset:1px}
.uel .fill{position:absolute;left:0;top:0;bottom:0;border-radius:inherit}
.uhandle{position:absolute;right:-4px;bottom:-4px;width:10px;height:10px;background:var(--amber);
  border-radius:2px;cursor:nwse-resize}
#hudLayer{position:absolute;inset:0;pointer-events:none;display:none}
#hudLayer.on{display:block}
#hudLayer .uel{cursor:default}
#hudLayer .uel.btn{pointer-events:auto;cursor:pointer}
#heat{position:absolute;inset:0;pointer-events:none;opacity:.72}
.legend{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:11px;margin-top:8px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-2px}
.report{max-height:120px;overflow:auto;font-size:11.5px;line-height:1.8}
.report .bad{color:var(--red)}.report .warn{color:var(--amber)}.report .good{color:var(--green)}
.meter{height:7px;background:#26314a;border-radius:4px;overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#41C98E,#F59E42,#E5566A)}
.gsel{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:9px}
.gsel button{background:var(--raise);border:1px solid var(--edge);border-radius:6px;padding:7px 4px;color:var(--mute);font-size:11px}

  const mat = new THREE.MeshStandardMaterial(opts);
  if (m.tex && typeof texById === 'function') {
    const t = texById(m.tex);
    if (t) { mat.map = t; mat.color.set('#ffffff');
      t.repeat.set(m.repU || 1, m.repV || 1); mat.needsUpdate = true; }
  }
  return mat;
}

/* ---------- Modelos por piezas ---------- */
function buildModel(model){
  if (model.skin && typeof buildSkinned === 'function') {
    const sk = buildSkinned(model);
    sk.userData.model = model.id;
    sk.userData.parts = {};
    return sk;
  }
  const g = new THREE.Group();
  g.userData.parts = {}; g.userData.model = model.id;
  const groups = {};
  const pending = (model.parts || []).slice();
  let guard = 0;
  while (pending.length && guard++ < 400) {
    const part = pending.shift();
    if (part.parent && !groups[part.parent] && (model.parts || []).some(x => x.id === part.parent)) { pending.push(part); continue; }
    const pg = new THREE.Group();
    pg.position.fromArray(part.pos || [0, 0, 0]);
    pg.rotation.set((part.rot || [0,0,0])[0] * deg, (part.rot || [0,0,0])[1] * deg, (part.rot || [0,0,0])[2] * deg);
    const mesh = new THREE.Mesh(makeGeometry(part), makeMaterial(part));
    mesh.scale.fromArray(part.scl || [1, 1, 1]);
    mesh.position.fromArray(part.off || [0, 0, 0]);
    mesh.castShadow = true; mesh.receiveShadow = true;
    pg.add(mesh);
    pg.userData.partId = part.id; pg.userData.mesh = mesh;
    pg.userData.base = { p:pg.position.clone(), r:pg.rotation.clone(), s:pg.scale.clone() };
    groups[part.id] = pg;
    g.userData.parts[part.name] = pg;
    if (part.parent && groups[part.parent]) groups[part.parent].add(pg); else g.add(pg);
  }
  return g;
}
function modelById(id){ return (P.models || []).find(m => m.id === id); }

/* ---------- Objetos de escena ---------- */
const meshes = {};
function buildObject(o){
  let obj;
  if (o.type === 'model') {
    const m = modelById(o.model);
    obj = m ? buildModel(m) : new THREE.Group();
  } else if (o.type === 'light') {
    obj = o.light === 'spot'
      ? new THREE.SpotLight(o.color || '#ffffff', o.params.power || 3, o.params.dist || 40, .6, .4)
      : new THREE.PointLight(o.color || '#ffd9a0', o.params.power || 2, o.params.dist || 24);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(.16, 12, 8),
      new THREE.MeshBasicMaterial({ color:o.color || '#ffd9a0' }));
    bulb.userData.helper = true; obj.add(bulb);
  } else if (o.type === 'spawn') {
    obj = new THREE.Group();
    const c = new THREE.Mesh(new THREE.ConeGeometry(.4, 1.1, 5),
      new THREE.MeshBasicMaterial({ color:0x41c98e, wireframe:true }));
    c.userData.helper = true; obj.add(c);
  } else if (o.type === 'group') {
    obj = new THREE.Group();
  } else {
    obj = new THREE.Mesh(makeGeometry(o), makeMaterial(o));
    obj.castShadow = true; obj.receiveShadow = true;
  }
  obj.position.fromArray(o.pos);
  obj.rotation.set(o.rot[0] * deg, o.rot[1] * deg, o.rot[2] * deg);
  obj.scale.fromArray(o.scl);
  obj.visible = o.visible !== false;
  obj.userData.id = o.id;
  return obj;
}
function disposeDeep(obj){
  obj.traverse(c => {
    if (c.geometry) c.geometry.dispose();
    if (c.material) (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => m.dispose());
  });
}
function syncObject(id){
  const o = P.objects.find(x => x.id === id); if (!o) return;
  if (meshes[id]) { root.remove(meshes[id]); disposeDeep(meshes[id]); }
  const m = buildObject(o); meshes[id] = m; root.add(m);
  if (selId === id) attachGizmo(m);
}
function rebuildAll(){
  Object.keys(meshes).forEach(id => { root.remove(meshes[id]); disposeDeep(meshes[id]); delete meshes[id]; });
  P.objects.forEach(o => { const m = buildObject(o); meshes[o.id] = m; root.add(m); });
}
function transformFromMesh(id){
  const o = P.objects.find(x => x.id === id), m = meshes[id]; if (!o || !m) return;
  o.pos = m.position.toArray().map(v => +v.toFixed(3));
  o.rot = [m.rotation.x, m.rotation.y, m.rotation.z].map(r => +(r / deg).toFixed(2));
  o.scl = m.scale.toArray().map(v => +v.toFixed(3));
}

/* ---------- Camara de editor ---------- */
const orbit = { target:new THREE.Vector3(0, 1, 0), dist:22, yaw:.72, pitch:.55 };
function updateEditorCam(){
  const p = clamp(orbit.pitch, -1.45, 1.45);
  editorCam.position.set(
    orbit.target.x + orbit.dist * Math.cos(p) * Math.sin(orbit.yaw),
    orbit.target.y + orbit.dist * Math.sin(p),
    orbit.target.z + orbit.dist * Math.cos(p) * Math.cos(orbit.yaw));
  editorCam.lookAt(orbit.target);
}
updateEditorCam();

let drag = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (playing) return;
  canvas.setPointerCapture(e.pointerId);
  if (e.button === 0) {
    if (e.altKey) { drag = { type:'orbit', x:e.clientX, y:e.clientY }; return; }
    if (mode === 'scene' && typeof Dibujo !== 'undefined' && Dibujo.on) {
      drag = { type:'draw' }; Dibujo.empezar(e); return;
    }
    if (mode === 'model' && typeof EM !== 'undefined' && EM.active()) {
      const hg = pickGizmo(e);
      if (hg) { drag = { type:'gizmo', axis:hg.axis, x:e.clientX, y:e.clientY }; return; }
      if (EM.modo === 'escultura') { drag = { type:'sculpt' }; EM.esculpir(e); return; }
      EM.pick(e, e.shiftKey || e.ctrlKey || e.metaKey);
      drag = { type:'emsel' }; return;
    }
    const hit = pickGizmo(e);
    if (hit) { drag = { type:'gizmo', axis:hit.axis, x:e.clientX, y:e.clientY, add:e.shiftKey }; return; }
    drag = { type:'select', x:e.clientX, y:e.clientY, moved:false, add:e.ctrlKey || e.metaKey || e.shiftKey };
  } else if (e.button === 2) drag = { type:e.shiftKey ? 'pan' : 'orbit', x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, moved:false };
  else if (e.button === 1) { e.preventDefault(); drag = { type:'pan', x:e.clientX, y:e.clientY }; }
});
canvas.addEventListener('pointermove', e => {
  if (playing || !drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (drag.type === 'orbit') {
    orbit.yaw -= dx * .006; orbit.pitch = clamp(orbit.pitch + dy * .006, -1.45, 1.45);
    updateEditorCam(); drag.x = e.clientX; drag.y = e.clientY;
    if (Math.abs(e.clientX - (drag.sx || 0)) + Math.abs(e.clientY - (drag.sy || 0)) > 4) drag.moved = true;
  } else if (drag.type === 'pan') {
    const r = editorCam.matrix.elements;
    const right = new THREE.Vector3(r[0], r[1], r[2]), up = new THREE.Vector3(r[4], r[5], r[6]);
    const k = orbit.dist * .0016;
    orbit.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
    updateEditorCam(); drag.x = e.clientX; drag.y = e.clientY;
  } else if (drag.type === 'gizmo') applyGizmoDrag(e, drag);
  else if (drag.type === 'sculpt') EM.esculpir(e);
  else if (drag.type === 'draw') Dibujo.seguir(e);
  else if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
});
canvas.addEventListener('pointerup', e => {
  if (playing) { drag = null; return; }
  if (drag && drag.type === 'draw') { Dibujo.fin(); drag = null; return; }
  if (drag && drag.type === 'sculpt') { markDirty(); drag = null; return; }
  if (drag && drag.type === 'emsel') { drag = null; return; }
  if (drag && drag.type === 'select' && !drag.moved) pickAt(e, drag.add);
  if (drag && drag.type === 'gizmo') onGizmoEnd();
  if (drag && e.button === 2 && !drag.moved) viewportMenu(e);
  drag = null;
});
canvas.addEventListener('wheel', e => {
  if (playing) return;
  e.preventDefault();
  orbit.dist = clamp(orbit.dist * (1 + Math.sign(e.deltaY) * .11), 1.2, 900);
  updateEditorCam();
}, { passive:false });

const ray = new THREE.Raycaster();
function ndc(e){
  const r = canvas.getBoundingClientRect();
  return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function pickAt(e, add){
  ray.setFromCamera(ndc(e), editorCam);
  if (mode === 'scene') {
    const hits = ray.intersectObjects(root.children, true);
    for (const h of hits) { let n = h.object; while (n && !n.userData.id) n = n.parent; if (n) { select(n.userData.id, add); return; } }
    if (!add) select(null);
  } else {
    const hits = ray.intersectObjects(stage.children, true);
    for (const h of hits) { let n = h.object; while (n && !n.userData.partId) n = n.parent; if (n) { selectPart(n.userData.partId); return; } }
  }
}
function onGizmoEnd(){
  if (mode === 'scene') { transformFromMesh(selId); selIds.forEach(id => transformFromMesh(id)); refreshInspector(); markDirty(); }
  else { partFromGizmo(); }
}

/* ---------- Gizmo ---------- */
const gizmo = new THREE.Group(); gizmo.visible = false; scene.add(gizmo);
const AXC = { x:0xe5566a, y:0x41c98e, z:0x3ba9e8 };
['x', 'y', 'z'].forEach(ax => {
  const g = new THREE.Group(); g.userData.axis = ax;
  const mat = new THREE.MeshBasicMaterial({ color:AXC[ax], depthTest:false, transparent:true, opacity:.95 });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, 1.5, 8), mat); shaft.position.y = .75;
  const head = new THREE.Mesh(new THREE.ConeGeometry(.11, .3, 10), mat); head.position.y = 1.6;
  const grab = new THREE.Mesh(new THREE.CylinderGeometry(.2, .2, 2, 6), new THREE.MeshBasicMaterial({ visible:false }));
  grab.position.y = 1;
  g.add(shaft, head, grab);
  if (ax === 'x') g.rotation.z = -Math.PI / 2;
  if (ax === 'z') g.rotation.x = Math.PI / 2;
  g.renderOrder = 999;
  gizmo.add(g);
});
let gizmoTarget = null, outline = null;
function attachGizmo(m){
  gizmoTarget = m || null;
  if (outline) { scene.remove(outline); outline.geometry.dispose(); outline.material.dispose(); outline = null; }
  if (!m || playing) { gizmo.visible = false; return; }
  gizmo.visible = true;
  m.getWorldPosition(gizmo.position);
  outline = new THREE.BoxHelper(m, 0xf59e42);
  outline.material.transparent = true; outline.material.opacity = .85;
  scene.add(outline);
}
function pickGizmo(e){
  if (!gizmo.visible) return null;
  ray.setFromCamera(ndc(e), editorCam);
  const hits = ray.intersectObjects(gizmo.children, true);
  if (!hits.length) return null;
  let n = hits[0].object; while (n && !n.userData.axis) n = n.parent;
  return n ? { axis:n.userData.axis } : null;
}
function applyGizmoDrag(e, d){
  const m = gizmoTarget; if (!m) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  d.x = e.clientX; d.y = e.clientY;
  const axV = new THREE.Vector3(d.axis === 'x' ? 1 : 0, d.axis === 'y' ? 1 : 0, d.axis === 'z' ? 1 : 0);
  const o = new THREE.Vector3(0, 0, 0).project(editorCam);
  const sa = axV.clone().project(editorCam).sub(o);
  const len = Math.hypot(sa.x, sa.y) || .001;
  let amount = (dx * sa.x - dy * sa.y) / (len * len) * .0035 * Math.max(1, orbit.dist * .12);
  if (typeof gizmoHook === 'function' && gizmoHook(d.axis, amount, gizmoMode)) return;
  const snap = snapOn !== e.ctrlKey;
  const others = (mode === 'scene' ? selIds.filter(id => id !== selId).map(id => meshes[id]).filter(Boolean) : []);
  if (gizmoMode === 'move') {
    const before = m.position[d.axis];
    m.position.addScaledVector(axV, amount);
    if (snap) m.position[d.axis] = Math.round(m.position[d.axis] / SNAP.move) * SNAP.move;
    const delta = m.position[d.axis] - before;
    others.forEach(o => { o.position[d.axis] += delta; });
  } else if (gizmoMode === 'rotate') {
    const before = m.rotation[d.axis];
    m.rotation[d.axis] += amount * .35;
    if (snap) { const st = SNAP.rotate * deg; m.rotation[d.axis] = Math.round(m.rotation[d.axis] / st) * st; }
    const delta = m.rotation[d.axis] - before;
    others.forEach(o => { o.rotation[d.axis] += delta; });
  } else {
    const tgt = (m.userData.mesh || m);
    const before = tgt.scale[d.axis];
    tgt.scale.addScaledVector(axV, amount * .35);
    if (snap) tgt.scale[d.axis] = Math.max(SNAP.scale, Math.round(tgt.scale[d.axis] / SNAP.scale) * SNAP.scale);
    tgt.scale.set(Math.max(.02, tgt.scale.x), Math.max(.02, tgt.scale.y), Math.max(.02, tgt.scale.z));
    const k = tgt.scale[d.axis] / (before || 1);
    others.forEach(o => { o.scale[d.axis] = Math.max(.02, o.scale[d.axis] * k); });
  }
  m.getWorldPosition(gizmo.position);
  if (mode === 'scene') { transformFromMesh(selId); others.forEach(o => transformFromMesh(o.userData.id)); }
}

/* ---------- Bucle ---------- */
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function resize(){
  const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
  renderer.setSize(w, h, false);
  editorCam.aspect = w / h; editorCam.updateProjectionMatrix();
  gameCam.aspect = w / h; gameCam.updateProjectionMatrix();
}
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > .5) { $('#chipFps').textContent = Math.round(fpsN / fpsAcc) + ' fps'; fpsAcc = 0; fpsN = 0; }
  resize();
  if (playing) RT.tick(dt);
  else {
    Fly.tick(dt);
    if (mode === 'anim') Anim.editorTick(dt);
    if (Sim.show && Sim.result && mode === 'scene') Sim.draw();
  }
  if (gizmo.visible && gizmoTarget) {
    gizmoTarget.getWorldPosition(gizmo.position);
    gizmo.scale.setScalar(editorCam.position.distanceTo(gizmo.position) * .055);
    if (outline) outline.update();
  }
  if (playing && outline) { scene.remove(outline); outline = null; }
  if (playing && RT.split && RT.cam2) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setScissorTest(true);
    renderer.setViewport(0, 0, w / 2, h); renderer.setScissor(0, 0, w / 2, h);
    activeCam.aspect = (w / 2) / h; activeCam.updateProjectionMatrix();
    renderer.render(scene, activeCam);
    renderer.setViewport(w / 2, 0, w / 2, h); renderer.setScissor(w / 2, 0, w / 2, h);
    RT.cam2.aspect = (w / 2) / h; RT.cam2.updateProjectionMatrix();
    renderer.render(scene, RT.cam2);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, w, h);
  } else renderer.render(scene, activeCam);
}
requestAnimationFrame(frame);

    if (pr.mat) Object.assign(o.mat, pr.mat);
    if (pr.behaviors) o.behaviors = JSON.parse(JSON.stringify(pr.behaviors));

function placeInFront(o, kind){

  const f = new THREE.Vector3(); editorCam.getWorldDirection(f);
  const p = editorCam.position.clone().addScaledVector(f, Math.min(18, orbit.dist * .8));
  o.pos = [+p.x.toFixed(2), Math.max(o.pos[1], .6), +p.z.toFixed(2)];
}
function pushObject(o){
  const same = P.objects.filter(x => x.name.split(' ')[0] === o.name.split(' ')[0]).length;
  if (same) o.name = o.name + ' ' + (same + 1);
  P.objects.push(o);
  const m = buildObject(o); meshes[o.id] = m; root.add(m);
  select(o.id); markDirty(); log('Añadido: ' + o.name, 'ok');

}
function duplicate(){
  if (mode !== 'scene') { duplicatePart && duplicatePart(); return; }
  const ids = selIds.length ? selIds.slice() : (selId ? [selId] : []);
  if (!ids.length) { toast('Selecciona un objeto'); return; }
  const nuevos = [];
  ids.forEach(id => {
    const o = P.objects.find(x => x.id === id); if (!o) return;
    const c = JSON.parse(JSON.stringify(o)); c.id = uid(); c.name = o.name + ' copia';
    c.pos = [o.pos[0] + 2, o.pos[1], o.pos[2]];
    P.objects.push(c); const m = buildObject(c); meshes[c.id] = m; root.add(m);
    nuevos.push(c.id);
  });
  selIds = nuevos; selId = nuevos[nuevos.length - 1] || null;
  attachGizmo(selId ? meshes[selId] : null); renderTree(); refreshInspector(); markDirty();
  toast(nuevos.length > 1 ? nuevos.length + ' copias creadas' : 'Objeto duplicado');
}
function removeSel(){
  if (mode !== 'scene') { removePart && removePart(); return; }
  const ids = selIds.length ? selIds.slice() : (selId ? [selId] : []);
  if (!ids.length) return;
  ids.forEach(id => {
    const i = P.objects.findIndex(x => x.id === id); if (i < 0) return;
    if (meshes[id]) { root.remove(meshes[id]); disposeDeep(meshes[id]); delete meshes[id]; }
    P.objects.splice(i, 1);

}
function select(id, add){
  if (!id) { selId = null; selIds = []; }
  else if (add) {
    if (selIds.indexOf(id) >= 0) { selIds = selIds.filter(x => x !== id); if (selId === id) selId = selIds[selIds.length - 1] || null; }
    else { selIds.push(id); selId = id; }
  } else { selId = id; selIds = [id]; }
  attachGizmo(selId ? meshes[selId] : null);
  renderTree(); refreshInspector();
  const o = P.objects.find(x => x.id === selId);
  $('#chipSel').innerHTML = selIds.length > 1
    ? '<b>' + selIds.length + '</b> objetos seleccionados'

    $('#leftTitle').textContent = 'Escena'; $('#leftTitle2').textContent = 'Crear';
    renderTree(); renderCreator(); select(selId);
  } else {

}

/* ---------- Guardado ---------- */
let saveTimer = null, saving = false;
function markDirty(){
  if (typeof History !== 'undefined') History.schedule();
  $('#statusTxt').textContent = 'Cambios sin guardar';
  $('#status .dot').classList.add('busy');
  clearTimeout(saveTimer); saveTimer = setTimeout(doAutosave, 900);
}
async function doAutosave(){
  if (saving) { markDirty(); return; }
  saving = true;
  const where = await Store.set('project', JSON.stringify(P));
  saving = false;
  $('#status .dot').classList.remove('busy');
  $('#statusTxt').textContent = 'Guardado ' + new Date().toLocaleTimeString('es-ES') + ' · ' + where;
}
async function loadAutosave(){
  const raw = await Store.get('project'); if (!raw) return false;
  try {
    const d = JSON.parse(raw); if (!d || !Array.isArray(d.objects)) return false;
    P = Object.assign({ name:'Mi juego', objects:[], models:[], sounds:[], world:{} }, d);
    P.world = Object.assign({}, DEFAULT_WORLD, P.world || {});
    P.models = P.models || []; P.vars = P.vars || []; P.ui = P.ui || { elements:[] };
    P.director = P.director || { on:false, genre:'terror', intensity:.5, monstruo:'' };
    P.assets = P.assets || { tex:[], snd:[] };
    P.objects.forEach(o => { o.behaviors = o.behaviors || []; o.params = o.params || {}; o.mat = o.mat || {}; });
    return true;
  } catch (e) { log('No se pudo recuperar: ' + e.message, 'er'); return false; }
}

  init(e,p,R){ R.player=e; R.players.push(e); e.rt.spd=0; e.rt.vy=0; R.camMode='car'; },

    e.o.rotation.y += turn*p.giro*dt*R.clamp(Math.abs(e.rt.spd)/6,0,1)*(e.rt.spd<0?-1:1);

{ id:'anim', name:'Reproducir animación', cat:'Animación',
  desc:'Reproduce en bucle una animación del modelo. Solo para objetos de tipo modelo.',
  params:[{k:'clip',l:'Nombre de la animación',t:'txt',d:'idle'},{k:'speed',l:'Velocidad',t:'num',d:1}],
  init(e,p,R){ e.rt.at=0; },
  update(e,p,dt,R){ e.rt.at+=dt*p.speed; Anim.apply(e.o, p.clip, e.rt.at, true); }},

{ id:'animState', name:'Animar según el movimiento', cat:'Animación',
  desc:'Cambia sola entre quieto, andar, correr y saltar según lo que haga el objeto.',
  params:[{k:'quieto',l:'Animación en reposo',t:'txt',d:'idle'},{k:'andar',l:'Animación al andar',t:'txt',d:'caminar'},
          {k:'correr',l:'Animación al correr',t:'txt',d:'correr'},{k:'saltar',l:'Animación en el aire',t:'txt',d:'saltar'},
          {k:'umbral',l:'Velocidad para correr',t:'num',d:8}],
  init(e,p,R){ e.rt.at=0; e.rt.prev=e.o.position.clone(); },
  update(e,p,dt,R){
    const v=e.o.position.clone().sub(e.rt.prev); e.rt.prev.copy(e.o.position);
    const sp=Math.hypot(v.x,v.z)/Math.max(dt,0.0001);
    let clip=p.quieto;
    if(e.rt.grounded===false && Math.abs(v.y)>0.01) clip=p.saltar;
    else if(sp>p.umbral) clip=p.correr;
    else if(sp>0.6) clip=p.andar;
    e.rt.at += dt*(clip===p.quieto?1:Math.max(1,sp/4));
    Anim.apply(e.o, clip, e.rt.at, true);
  }},

{ id:'faceMove', name:'Mirar hacia donde avanza', cat:'Animación',
  desc:'Gira el modelo suavemente hacia su dirección de movimiento.',
  params:[{k:'suavidad',l:'Suavidad',t:'num',d:8}],
  init(e){ e.rt.prev=e.o.position.clone(); },
  update(e,p,dt,R){
    const v=e.o.position.clone().sub(e.rt.prev); e.rt.prev.copy(e.o.position); v.y=0;
    if(v.length()<0.002) return;
    const want=Math.atan2(v.x,v.z);
    let d=want-e.o.rotation.y;
    while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2;
    e.o.rotation.y += d*Math.min(1,dt*p.suavidad);
  }}
];

/* ============================================================
   Motor de sonido
   ============================================================ */
const Snd = {
  ctx: null,
  ac() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return this.ctx; },
  presets: {
    moneda:   { wave:'square',  f1:880,  f2:1760, dur:.18, atk:.005, vol:.28, filt:6000 },
    disparo:  { wave:'sawtooth',f1:520,  f2:90,   dur:.14, atk:.002, vol:.25, filt:2400 },
    laser:    { wave:'square',  f1:1200, f2:180,  dur:.22, atk:.002, vol:.22, filt:3200 },
    golpe:    { wave:'triangle',f1:180,  f2:60,   dur:.16, atk:.002, vol:.34, filt:900, noise:.5 },
    salto:    { wave:'sine',    f1:320,  f2:700,  dur:.16, atk:.004, vol:.26, filt:5000 },
    poder:    { wave:'sine',    f1:420,  f2:1400, dur:.4,  atk:.01,  vol:.26, filt:7000 },
    cura:     { wave:'sine',    f1:600,  f2:900,  dur:.3,  atk:.02,  vol:.24, filt:6000 },
    menu:     { wave:'square',  f1:660,  f2:660,  dur:.08, atk:.002, vol:.2,  filt:4000 },
    explosion:{ wave:'sawtooth',f1:120,  f2:30,   dur:.7,  atk:.002, vol:.4,  filt:700, noise:1 },
    paso:     { wave:'triangle',f1:120,  f2:70,   dur:.09, atk:.002, vol:.16, filt:600, noise:.7 },
    puerta:   { wave:'sawtooth',f1:90,   f2:140,  dur:.5,  atk:.05,  vol:.2,  filt:500, noise:.3 },
    error:    { wave:'square',  f1:200,  f2:120,  dur:.3,  atk:.005, vol:.26, filt:1200 }
  },
  play(cfg) {
    const ac = this.ac(); if (!ac || !cfg) return;
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime, dur = cfg.dur || .2;
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(cfg.vol !== undefined ? cfg.vol : .25, t + (cfg.atk || .005));
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(cfg.filt || 4000, t);
    f.connect(g); g.connect(ac.destination);
    const o = ac.createOscillator();
    o.type = cfg.wave || 'sine';
    o.frequency.setValueAtTime(cfg.f1 || 440, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, cfg.f2 || cfg.f1 || 440), t + dur);
    o.connect(f); o.start(t); o.stop(t + dur + .02);
    if (cfg.noise) {
      const n = ac.createBufferSource();
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      n.buffer = buf;
      const ng = ac.createGain(); ng.gain.value = cfg.noise * .35;
      n.connect(ng); ng.connect(f); n.start(t); n.stop(t + dur);
    }
  }
};

/* ============================================================
   RT · motor de ejecucion del juego
   ============================================================ */
const RT = {
  ents: [], solids: [], bullets: [], keys: {}, mouse: { dx:0, dy:0, down:false },
  state: {}, signals: {}, player: null, shake: 0, gravity: 24, camMode: 'fps',
  scene: null, cam: null, sun: null, hemi: null, snapshot: null, over: false,

  clamp(v,a,b){ return Math.min(b, Math.max(a, v)); },
  pl(e){
    if (!this.players || this.players.length < 2) return this.player;
    if (!e || !e.o) return this.player;
    let mejor = null, d = 1e9;
    for (let i = 0; i < this.players.length; i++) {
      const p = this.players[i]; if (!p || p.dead) continue;
      const dd = p.o.position.distanceToSquared(e.o.position);
      if (dd < d) { d = dd; mejor = p; }
    }
    return mejor || this.player;
  },

  start(){
    this.scene = scene; this.cam = gameCam; this.sun = sun; this.hemi = hemi;
    this.ents = []; this.bullets = []; this.signals = {}; this.player = null; this.player2 = null;
    this.players = []; this.split = false;
    if (!this.cam2) this.cam2 = new THREE.PerspectiveCamera(72, 1, .1, 5000);
    if (typeof Ragdoll !== 'undefined') Ragdoll.start();
    this.shake = 0; this.over = false; this.keys = {}; this.mouse = { dx:0, dy:0, down:false };
    this.gravity = P.world.gravity;
    if (typeof Phys !== 'undefined') Phys.start(this);
    if (typeof Particulas !== 'undefined') Particulas.limpiar();
    this.state = { score:0, hp:100, hpmax:100, timer:null, keys:{}, ammo:0, respawn:null, vars:{} };
    (P.vars || []).forEach(v => { this.state.vars[v.name] = v.value || 0; });
    this.snapshot = P.objects.map(o => ({ id:o.id, pos:o.pos.slice(), rot:o.rot.slice(), scl:o.scl.slice() }));

    P.objects.forEach(o => {
      const m = meshes[o.id]; if (!m) return;
      const e = { id:o.id, o:m, d:o, rt:{}, beh:[], dead:false, tag:o.tag||'' };
      e.rt.start = m.position.clone();
      (o.behaviors||[]).forEach(b => { if (b.off) return; const def = BEH[b.id]; if (def) e.beh.push({ def:def, p:this.params(def, b.p) }); });
      if (o.script && o.script.length && BEH.script) e.beh.push({ def:BEH.script, p:{} });
      this.ents.push(e);
    });
    this.refreshSolids();
    this.ents.forEach(e => e.beh.forEach(b => { if (b.def.init) { try { b.def.init(e, b.p, this); } catch (err) { this.err(b.def.name, err); } } }));

    const sp = P.objects.find(o => o.type === 'spawn');
    if (!this.player) {
      this.camMode = 'free';
      this.cam.position.set(editorCam.position.x, editorCam.position.y, editorCam.position.z);
      this.cam.rotation.copy(editorCam.rotation);
    } else if (sp) {
      this.player.o.position.set(sp.pos[0], sp.pos[1] + this.size(this.player).y * 0.6, sp.pos[2]);
      this.player.rt.start = this.player.o.position.clone();
    }
    this.refreshSolids();
    const MOVERS = ['playerFPS','playerTP','playerTop','playerPlat','vehicle','flyCam','chase','flee','wander','follow','gravity'];
    this.ents.forEach(e => { if (e.beh.some(b => MOVERS.indexOf(b.def.id) >= 0)) this.unstick(e); });
    this.state.respawn = this.player ? this.player.o.position.clone() : null;

    if (typeof Lotes !== 'undefined') Lotes.build();
    this.buildHud();
    if (typeof GameUI !== 'undefined') GameUI.start(this);
    if (typeof Touch !== 'undefined') Touch.start(this);
    if (typeof PostFX !== 'undefined') PostFX.apply();
    if (typeof Nav !== 'undefined') Nav.grid = null;
    if (typeof Director !== 'undefined') Director.start(this);
    this._kd = e => { this.keys[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); };
    this._ku = e => { this.keys[e.key.toLowerCase()] = false; };
    this._md = () => { this.mouse.down = true; };
    this._mu = () => { this.mouse.down = false; };
    this._mm = e => { if (document.pointerLockElement) { this.mouse.dx += e.movementX; this.mouse.dy += e.movementY; } };
    window.addEventListener('keydown', this._kd); window.addEventListener('keyup', this._ku);
    window.addEventListener('mousedown', this._md); window.addEventListener('mouseup', this._mu);
    window.addEventListener('mousemove', this._mm);
    if (P.world.startMsg) this.flash(P.world.startMsg, 2600);
  },

  params(def, saved){
    const p = {}; (def.params||[]).forEach(x => { p[x.k] = (saved && saved[x.k] !== undefined) ? saved[x.k] : x.d; });
    return p;
  },

  err(name, e){ if (typeof log === 'function') log('Error en la mecánica "' + name + '": ' + e.message, 'er'); },

  lockMouse(){
    const cv = this.scene && document.getElementById('cv');
    if (cv && cv.requestPointerLock) { this._wantLock = true; }
  },

  refreshSolids(){
    this.solids = this.ents.filter(e => {
      if (e.dead || this.players.indexOf(e) >= 0) return false;
      if (e.d.visible === false) return false;
      if (e.d.type === 'spawn' || e.d.type === 'light') return false;
      return !(e.d.behaviors||[]).some(b => NONSOLID.indexOf(b.id) >= 0);
    });
    this.solids.forEach(e => { e.box = new THREE.Box3().setFromObject(e.o); });
  },

  box(e){ return new THREE.Box3().setFromObject(e.o); },
  size(e){ const b = this.box(e), v = new THREE.Vector3(); b.getSize(v); return v; },
  touching(a, b){ return this.box(a).intersectsBox(this.box(b)); },

  moveWithCollision(e, dx, dy, dz){
    e.rt.hitY = false; e.rt.grounded = false;
    const o = e.o;
    const test = () => {
      const b = new THREE.Box3().setFromObject(o);
      b.expandByScalar(-0.03);
      for (let i = 0; i < this.solids.length; i++) {
        const s = this.solids[i]; if (s === e) continue;
        if (s.box && b.intersectsBox(s.box)) return s;
      }
      return null;
    };
    const stuck = !!test();
    if (dx) { o.position.x += dx; if (!stuck && test()) o.position.x -= dx; }
    if (dz) { o.position.z += dz; if (!stuck && test()) o.position.z -= dz; }
    if (dy) {
      o.position.y += dy;
      if (!stuck && test()) { o.position.y -= dy; e.rt.hitY = true; if (dy < 0) e.rt.grounded = true; }
    }
    if (P.world.ground) {
      const half = this.size(e).y / 2;
      const s = P.world.groundSize / 2;
      if (Math.abs(o.position.x) < s && Math.abs(o.position.z) < s && o.position.y - half < 0) {
        o.position.y = half; e.rt.hitY = true; e.rt.grounded = true;
      }
    }
  },

  unstick(e){
    const test = () => {
      const b = new THREE.Box3().setFromObject(e.o); b.expandByScalar(-0.03);
      for (let i = 0; i < this.solids.length; i++) {
        const s = this.solids[i]; if (s === e) continue;
        if (s.box && b.intersectsBox(s.box)) return true;
      }
      return false;
    };
    for (let i = 0; i < 40 && test(); i++) e.o.position.y += 0.25;
  },

  byName(n){ return this.ents.find(e => !e.dead && e.d.name.toLowerCase() === String(n).toLowerCase()); },

  cloneByName(name, pos){
    const src = P.objects.find(o => o.name.toLowerCase() === String(name).toLowerCase());
    if (!src) return null;
    const data = JSON.parse(JSON.stringify(src)); data.id = uid(); data.pos = pos.toArray();
    const m = buildObject(data); root.add(m); meshes[data.id] = m;
    const e = { id:data.id, o:m, d:data, rt:{}, beh:[], dead:false, temp:true, tag:data.tag||'' };
    e.rt.start = m.position.clone();
    (data.behaviors||[]).forEach(b => { if (b.off) return; const def = BEH[b.id]; if (def) e.beh.push({ def:def, p:this.params(def, b.p) }); });
    if (data.script && data.script.length && BEH.script) e.beh.push({ def:BEH.script, p:{} });
    e.beh.forEach(b => { if (b.def.init) { try { b.def.init(e, b.p, this); } catch (err) {} } });
    this.ents.push(e); this.refreshSolids();
    return e;
  },

  remove(e){
    e.dead = true; e.o.visible = false;
    if (e.temp) { root.remove(e.o); }
    this.solids = this.solids.filter(s => s !== e);
  },

  shoot(pos, vel, dmg, color, owner){
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6),
      new THREE.MeshBasicMaterial({ color: color }));
    m.position.copy(pos); this.scene.add(m);
    this.bullets.push({ m:m, v:vel, dmg:dmg, life:3, owner:owner });
  },

  hurtPlayer(n){
    if (this.over) return;
    this.state.hp -= n; this.shake = Math.max(this.shake, 0.18); this.sfx('golpe');
    if (this.state.hp <= 0) { this.state.hp = 0; this.finish(false, 'Te has quedado sin vida'); }
  },

  damage(e, n){
    if (e.rt.hp === undefined) { this.remove(e); return; }
    e.rt.hp -= n;
    if (e.o.material && e.o.material.color) {
      const c = e.o.material.color.clone(); e.o.material.color.set(0xffffff);
      setTimeout(() => { if (e.o.material) e.o.material.color.copy(c); }, 70);
    }
    if (e.rt.hp <= 0) {
      if (e.rt.trapo && typeof Ragdoll !== 'undefined') { Ragdoll.lanzar(e, this); e.dead = true; this.solids = this.solids.filter(s => s !== e); }
      else this.remove(e);
      this.state.score += 5; this.sfx('explosion');
    }
  },

  sfx(name){
    if (!name) return;
    if (typeof playAsset === 'function' && playAsset(name)) return;
    const s = (P.sounds || []).find(x => x.name.toLowerCase() === String(name).toLowerCase());
    Snd.play(s ? s.cfg : Snd.presets[name]);
  },

  /* ---- HUD ---- */
  buildHud(){
    const h = document.getElementById('playHud');
    h.innerHTML =
      '<div class="stat" id="hudHp"><small>Vida</small><b>100</b><div class="bar"><i style="width:100%"></i></div></div>' +
      '<div class="stat" id="hudScore"><small>Puntos</small><b>0</b></div>' +
      '<div class="stat" id="hudTime" style="display:none"><small>Tiempo</small><b>0</b></div>' +
      '<div class="stat" id="hudAmmo" style="display:none"><small>Munición</small><b>0</b></div>' +
      '<div class="stat" id="hudHp2" style="display:none"><small>Vida jugador 2</small><b>100</b>' +
      '<div class="bar"><i style="width:100%"></i></div></div>' +
      '<div id="hudVars"></div>';
    h.style.display = (P.ui && P.ui.hideDefault) ? 'none' : 'flex';
    if (!document.getElementById('flashMsg')) {
      const f = document.createElement('div'); f.id = 'flashMsg';
      f.style.cssText = 'position:absolute;top:44%;left:50%;transform:translateX(-50%);' +
        'font-family:Chakra Petch,sans-serif;font-size:24px;color:#fff;text-shadow:0 2px 12px #000;' +
        'opacity:0;transition:opacity .3s;pointer-events:none;text-align:center';
      document.getElementById('view').appendChild(f);
    }
    if (!document.getElementById('crosshair')) {
      const c = document.createElement('div'); c.id = 'crosshair';
      c.style.cssText = 'position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;' +
        'border-radius:50%;background:rgba(255,255,255,.8);display:none;pointer-events:none';
      document.getElementById('view').appendChild(c);
    }
    document.getElementById('crosshair').style.display = this.camMode === 'fps' ? 'block' : 'none';
  },
  updateHud(){
    const hp = document.getElementById('hudHp');
    if (hp) {
      hp.querySelector('b').textContent = Math.max(0, Math.round(this.state.hp));
      hp.querySelector('i').style.width = Math.max(0, this.state.hp / this.state.hpmax * 100) + '%';
      hp.style.display = this.player ? 'block' : 'none';
    }
    const h2 = document.getElementById('hudHp2');
    if (h2) {
      if (this.player2) {
        h2.style.display = 'block';
        h2.querySelector('b').textContent = Math.max(0, Math.round(this.state.hp2 || 0));
        h2.querySelector('i').style.width = Math.max(0, (this.state.hp2 || 0) / (this.state.hpmax2 || 100) * 100) + '%';
      } else h2.style.display = 'none';
    }
    const sc = document.getElementById('hudScore'); if (sc) sc.querySelector('b').textContent = this.state.score;
    const tm = document.getElementById('hudTime');
    if (tm) { if (this.state.timer !== null && this.state.timer !== undefined) { tm.style.display = 'block';
        tm.querySelector('b').textContent = Math.ceil(this.state.timer) + 's'; } else tm.style.display = 'none'; }
    const hv = document.getElementById('hudVars');
    if (hv) {
      const list = (P.vars || []).filter(v => v.show !== false);
      if (list.length) {
        hv.innerHTML = list.map(v => '<div class="stat" style="margin-top:6px"><small>' + v.name +
          '</small><b>' + (this.state.vars[v.name] !== undefined ? this.state.vars[v.name] : v.value) + '</b></div>').join('');
      } else hv.innerHTML = '';
    }
    const am = document.getElementById('hudAmmo');
    if (am) { if (this.state.ammo) { am.style.display = 'block'; am.querySelector('b').textContent = this.state.ammo; }
      else am.style.display = 'none'; }
  },
  flash(msg, ms){
    this.lastMsg = msg;
    clearTimeout(this._lm); this._lm = setTimeout(() => { this.lastMsg = ''; }, ms || 1400);
    const f = document.getElementById('flashMsg'); if (!f) return;
    f.textContent = msg; f.style.opacity = '1';
    clearTimeout(f._t); f._t = setTimeout(() => { f.style.opacity = '0'; }, ms || 1400);
  },
  finish(win, msg){
    if (this.over) return; this.over = true;
    this.sfx(win ? 'poder' : 'error');
    const f = document.getElementById('flashMsg');
    f.innerHTML = '<div style="font-size:40px;color:' + (win ? '#3ddc97' : '#f2545b') + '">' +
      (win ? '¡HAS GANADO!' : 'FIN DE LA PARTIDA') + '</div>' +
      '<div style="font-size:17px;margin-top:8px">' + (msg || '') + '</div>' +
      '<div style="font-size:15px;margin-top:6px;color:#8592AC">Puntos: ' + this.state.score + '</div>' +
      '<div style="font-size:13px;margin-top:14px;color:#8592AC">Pulsa R para reintentar</div>';
    f.style.opacity = '1'; clearTimeout(f._t);
    if (document.exitPointerLock) document.exitPointerLock();
  },

  /* ---- bucle ---- */
  tick(dt){
    this._dt = dt;
    if (this.over) { if (this.keys['r']) { this.restart(); } return; }
    for (let i = 0; i < this.ents.length; i++) {
      const e = this.ents[i]; if (e.dead) continue;
      for (let j = 0; j < e.beh.length; j++) {
        const b = e.beh[j];
        if (b.def.update && !b.off) {
          try { b.def.update(e, b.p, dt, this); }
          catch (err) { b.errs = (b.errs || 0) + 1; if (b.errs === 1) this.err(b.def.name, err); if (b.errs > 5) b.off = true; }
        }
      }
    }
    if (typeof Phys !== 'undefined') Phys.tick(dt, this);
    if (typeof Ragdoll !== 'undefined') Ragdoll.tick(dt, this);
    if (typeof Particulas !== 'undefined') Particulas.tick(dt, this);
    if (typeof Skin !== 'undefined') Skin.tick(dt, this);
    if (typeof Perf !== 'undefined') Perf.tick(dt, this);
    this.tickBullets(dt);
    this.mouse.dx = 0; this.mouse.dy = 0;
    if (this.camMode === 'free') this.freeCam(dt);
    if (this.shake > 0.001) {
      this.cam.position.x += (Math.random() - .5) * this.shake;
      this.cam.position.y += (Math.random() - .5) * this.shake;
      this.shake *= 0.86;
    }
    if (typeof Director !== 'undefined') Director.tick(dt, this);
    if (typeof GameUI !== 'undefined') GameUI.update(this);
    this._sc = (this._sc || 0) + dt;
    if (this._sc > 0.25) { this._sc = 0; this.refreshSolids(); }
    this.updateHud();
  },

  tickBullets(dt){
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.m.position.addScaledVector(b.v, dt); b.life -= dt;
      let gone = b.life <= 0 || b.m.position.y < -60;
      if (!gone) {
        const bb = new THREE.Box3().setFromObject(b.m);
        for (let k = 0; k < this.solids.length; k++) {
          const s = this.solids[k];
          if (s.box && bb.intersectsBox(s.box)) {
            if (b.owner === 'player') this.damage(s, b.dmg);
            gone = true; break;
          }
        }
        if (!gone && b.owner === 'enemy' && this.player && bb.intersectsBox(this.box(this.player))) {
          this.hurtPlayer(b.dmg); gone = true;
        }
      }
      if (gone) { this.scene.remove(b.m); b.m.geometry.dispose(); b.m.material.dispose(); this.bullets.splice(i, 1); }
    }
  },

  freeCam(dt){
    const s = 16 * dt * (this.keys['shift'] ? 2.5 : 1);
    const f = new THREE.Vector3(); this.cam.getWorldDirection(f);
    const r = new THREE.Vector3().crossVectors(f, new THREE.Vector3(0, 1, 0)).normalize();
    if (this.keys['w']) this.cam.position.addScaledVector(f, s);
    if (this.keys['s']) this.cam.position.addScaledVector(f, -s);
    if (this.keys['d']) this.cam.position.addScaledVector(r, s);
    if (this.keys['a']) this.cam.position.addScaledVector(r, -s);
    if (this.mouse.dx || this.mouse.dy) {
      this._yaw = (this._yaw || 0) - this.mouse.dx * 0.0022;
      this._pitch = this.clamp((this._pitch || 0) - this.mouse.dy * 0.0022, -1.4, 1.4);
      this.cam.rotation.set(this._pitch, this._yaw, 0, 'YXZ');
    }
  },

  restart(){
    this.stopListeners();
    this.snapshot.forEach(s => {
      const m = meshes[s.id]; if (!m) return;
      m.position.fromArray(s.pos); m.rotation.fromArray(s.rot.map(d => d * Math.PI / 180));
      m.scale.fromArray(s.scl); m.visible = true;
    });
    this.ents.filter(e => e.temp).forEach(e => { root.remove(e.o); delete meshes[e.id]; });
    this.bullets.forEach(b => this.scene.remove(b.m)); this.bullets = [];
    const f = document.getElementById('flashMsg'); if (f) { f.style.opacity = '0'; f.innerHTML = ''; }
    this.start();
  },

  stopListeners(){
    window.removeEventListener('keydown', this._kd); window.removeEventListener('keyup', this._ku);
    window.removeEventListener('mousedown', this._md); window.removeEventListener('mouseup', this._mu);
    window.removeEventListener('mousemove', this._mm);
  },

  stop(){
    this.stopListeners();
    if (typeof GameUI !== 'undefined') GameUI.stop();
    if (typeof Lotes !== 'undefined') Lotes.clear();
    if (typeof Particulas !== 'undefined') Particulas.limpiar();
    if (typeof Ragdoll !== 'undefined') Ragdoll.stop();
    this.split = false;
    if (typeof Touch !== 'undefined') Touch.stop();
    if (typeof PostFX !== 'undefined') PostFX.clear();
    this.ents.forEach(e => { if (e.d.visible !== false && e.o) e.o.visible = true; });
    if (typeof Director !== 'undefined') Director.stop();
    if (document.exitPointerLock) document.exitPointerLock();
    this.ents.filter(e => e.temp).forEach(e => { root.remove(e.o); delete meshes[e.id]; });
    this.bullets.forEach(b => this.scene.remove(b.m)); this.bullets = [];
    (this.snapshot || []).forEach(s => {
      const m = meshes[s.id]; if (!m) return;
      m.position.fromArray(s.pos); m.rotation.fromArray(s.rot.map(d => d * Math.PI / 180));
      m.scale.fromArray(s.scl);
      const o = P.objects.find(x => x.id === s.id); if (o) m.visible = o.visible !== false;
    });
    this.ents.forEach(e => { if (typeof Anim !== 'undefined') Anim.reset(e.o); });
    applyWorld();
    const f = document.getElementById('flashMsg'); if (f) { f.style.opacity = '0'; f.innerHTML = ''; }
    const c = document.getElementById('crosshair'); if (c) c.style.display = 'none';
    document.getElementById('playHud').style.display = 'none';
  }
};

const Anim = {
  preview:{ clip:null, t:0, playing:false },

  clipFor(obj, name){
    const mid = obj.userData ? obj.userData.model : null;
    if (mid) {
      const m = (P.models || []).find(x => x.id === mid);
      if (m && m.anims) { const c = m.anims.find(a => a.name === name); if (c) return c; }
    }
    return PRESET_CLIPS[name] || null;
  },

  sample(keys, t){
    if (!keys || !keys.length) return null;
    if (t <= keys[0].t) return keys[0];
    if (t >= keys[keys.length - 1].t) return keys[keys.length - 1];
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (t >= a.t && t <= b.t) {
        const raw = (t - a.t) / Math.max(.0001, b.t - a.t);
        const e = a.ease || 'suave';
        const k = e === 'lineal' ? raw
          : e === 'acelerar' ? raw * raw
          : e === 'frenar' ? 1 - (1 - raw) * (1 - raw)
          : e === 'salto' ? (raw < .5 ? 0 : 1)
          : raw * raw * (3 - 2 * raw);
        const mix = (x, y, d) => {
          const A = x || d, B = y || d;
          return [A[0] + (B[0] - A[0]) * k, A[1] + (B[1] - A[1]) * k, A[2] + (B[2] - A[2]) * k];
        };
        return { r:mix(a.r, b.r, [0,0,0]), p:mix(a.p, b.p, [0,0,0]), s:mix(a.s, b.s, [1,1,1]) };
      }
    }
    return keys[0];
  },

  apply(obj, clipName, time, loop){
    if (!obj || !obj.userData || !obj.userData.parts) return false;
    const clip = this.clipFor(obj, clipName);
    if (!clip) return false;
    const dur = clip.dur || 1;
    const t = (clip.loop && loop !== false) ? (time % dur + dur) % dur : Math.min(time, dur);
    const parts = obj.userData.parts;
    Object.keys(parts).forEach(n => {
      const g = parts[n], base = g.userData.base;
      if (!base) return;
      const keys = clip.tracks ? clip.tracks[n] : null;
      const v = this.sample(keys, t);
      if (!v) { g.position.copy(base.p); g.rotation.copy(base.r); g.scale.copy(base.s); return; }
      const r = v.r || [0,0,0], p = v.p || [0,0,0], s = v.s || [1,1,1];
      g.position.set(base.p.x + p[0], base.p.y + p[1], base.p.z + p[2]);
      g.rotation.set(base.r.x + r[0] * deg, base.r.y + r[1] * deg, base.r.z + r[2] * deg);
      g.scale.set(base.s.x * s[0], base.s.y * s[1], base.s.z * s[2]);
    });
    return true;
  },

  reset(obj){
    if (!obj || !obj.userData || !obj.userData.parts) return;
    const parts = obj.userData.parts;
    Object.keys(parts).forEach(n => {
      const g = parts[n], b = g.userData.base;
      if (b) { g.position.copy(b.p); g.rotation.copy(b.r); g.scale.copy(b.s); }
    });
  },

  editorTick(dt){
    if (!this.preview.playing || !stageModel) return;
    const clip = curClip();
    if (!clip) return;
    this.preview.t += dt;
    if (this.preview.t > clip.dur) { if (clip.loop) this.preview.t = 0; else { this.preview.t = clip.dur; this.preview.playing = false; } }
    this.apply(stageModel, clip.name, this.preview.t, clip.loop);
    updatePlayhead();
  }
};

function newModel(name, parts){
  const m = { id:uid(), name:name || 'Modelo', parts:parts || makeHumanoid(), anims:[] };
  P.models.push(m); markDirty(); return m;
}
function curModel(){ return (P.models || []).find(m => m.id === curModelId) || null; }
function ensureModel(){
  if (!P.models) P.models = [];
  if (!curModel()) {
    if (!P.models.length) newModel('Humanoide', makeHumanoid());
    curModelId = P.models[0].id;
  }
  rebuildStage();
}
function openModel(id){ curModelId = id; selPart = null; curClipIdx = 0; rebuildStage(); }

function rebuildStage(){
  if (stageModel) { stage.remove(stageModel); disposeDeep(stageModel); stageModel = null; }
  const m = curModel(); if (!m) return;
  stageModel = buildModel(m); stage.add(stageModel);
  if (mode === 'model' && selPart) selectPart(selPart);
  if (mode === 'anim') { const c = curClip(); if (c) Anim.apply(stageModel, c.name, animTime, false); }
}
function partGroup(id){
  if (!stageModel) return null;
  let found = null;
  stageModel.traverse(o => { if (o.userData && o.userData.partId === id) found = o; });
  return found;
}
function selectPart(id){
  selPart = id; selKeyPart = id;
  const g = partGroup(id);
  attachGizmo(g);
  const m = curModel();
  const p = m && m.parts.find(x => x.id === id);
  $('#chipSel').innerHTML = p ? 'Pieza <b>' + p.name + '</b>' : 'Nada seleccionado';
  renderPartList(mode === 'anim');
  refreshInspector();
  if (mode === 'anim') renderTimeline();
}
function partFromGizmo(){
  const m = curModel(); if (!m || !selPart) return;
  const g = partGroup(selPart); if (!g) return;
  if (mode === 'anim') { writeKeyFromGroup(); return; }
  const p = m.parts.find(x => x.id === selPart); if (!p) return;
  p.pos = g.position.toArray().map(v => +v.toFixed(3));
  p.rot = [g.rotation.x, g.rotation.y, g.rotation.z].map(r => +(r / deg).toFixed(1));
  if (g.userData.mesh) p.scl = g.userData.mesh.scale.toArray().map(v => +v.toFixed(3));
  g.userData.base = { p:g.position.clone(), r:g.rotation.clone(), s:g.scale.clone() };
  refreshInspector(); markDirty();
}
function duplicatePart(){
  const m = curModel(); if (!m || !selPart) return;
  const p = m.parts.find(x => x.id === selPart); if (!p) return;
  const c = JSON.parse(JSON.stringify(p)); c.id = uid(); c.name = p.name + '_2';
  m.parts.push(c); rebuildStage(); selectPart(c.id); markDirty();
}
function removePart(){
  const m = curModel(); if (!m || !selPart) return;
  m.parts = m.parts.filter(x => x.id !== selPart && x.parent !== selPart);
  selPart = null; rebuildStage(); attachGizmo(null); renderPartList(mode === 'anim'); refreshInspector(); markDirty();
}
function addPart(geo){
  const m = curModel(); if (!m) return;
  const p = newPart(geo, geo + '_' + (m.parts.length + 1), [0, 1.4, 0], [.5, .5, .5]);
  m.parts.push(p); rebuildStage(); selectPart(p.id); markDirty();
}

    b.appendChild(dl);

    const ex = actBtn('Exportar animación (.u3da)', 'exportar'); ex.onclick = exportClip; b.appendChild(ex);

  const part = m.parts.find(x => x.id === selKeyPart);
  if (!part) { b.innerHTML = '<div class="empty">Elige una pieza en la lista de abajo a la izquierda<br>para animarla.</div>'; return; }
  const k = keyAt(c, part.name, animTime);
  const head = el('<div class="sub"><h4></h4><div style="color:#8794AE;font-size:11px">Tiempo actual: <b style="color:#E6EBF4">' +
    animTime.toFixed(2) + 's</b>' + (k ? ' · fotograma existente' : ' · sin fotograma aquí') + '</div></div>');
  head.querySelector('h4').textContent = part.name;
  b.appendChild(head);
  const v = k || { r:[0,0,0], p:[0,0,0], s:[1,1,1] };
  const set = (field, i, val) => {
    const kk = ensureKey(c, part.name, animTime);
    kk[field] = (kk[field] || (field === 's' ? [1,1,1] : [0,0,0])).slice();
    kk[field][i] = val;

  };
  const s1 = el('<div class="sub"><h4>Giro en este fotograma</h4></div>');
  ['X','Y','Z'].forEach((ax, i) => s1.appendChild(fieldRange('Giro ' + ax, (v.r || [0,0,0])[i], -180, 180, 1, val => set('r', i, val))));

  ['X','Y','Z'].forEach((ax, i) => s2.appendChild(fieldRange('Mover ' + ax, (v.p || [0,0,0])[i], -2, 2, .01, val => set('p', i, val))));
  b.appendChild(s2);
  const s3 = el('<div class="sub"><h4>Tamaño</h4></div>');
  ['X','Y','Z'].forEach((ax, i) => s3.appendChild(fieldRange('Escala ' + ax, (v.s || [1,1,1])[i], .1, 3, .01, val => set('s', i, val))));
  b.appendChild(s3);
  b.appendChild(fieldSel('Transición hasta el siguiente', (k && k.ease) || 'suave',
    [['suave','Suave'],['lineal','Constante'],['acelerar','Acelerando'],['frenar','Frenando'],['salto','De golpe']],
    v => { const kk = ensureKey(c, part.name, animTime); kk.ease = v; previewFrame(); markDirty(); }));
  const add = actBtn('Guardar fotograma aquí', 'mas', 'go');
  add.onclick = () => { ensureKey(c, part.name, animTime); renderTimeline(); refreshInspector(); markDirty(); toast('Fotograma guardado'); };
  b.appendChild(add);
  const pose = el('<div class="sub"><h4>Pose completa</h4></div>');
  const bp1 = actBtn('Guardar la pose de todas las piezas', 'hueso'); bp1.onclick = poseKeyAll; pose.appendChild(bp1);
  const bp2 = actBtn('Reflejar izquierda y derecha', 'rotar'); bp2.onclick = mirrorPose; pose.appendChild(bp2);
  const bp3 = actBtn('Copiar pose', 'copiar'); bp3.onclick = copyPose; pose.appendChild(bp3);
  const bp4 = actBtn('Pegar pose aquí', 'copiar'); bp4.onclick = pastePose; pose.appendChild(bp4);
  b.appendChild(pose);
  if (k) {
    const del = actBtn('Borrar este fotograma', 'borrar', 'warn');
    del.onclick = () => {
      c.tracks[part.name] = (c.tracks[part.name] || []).filter(x => Math.abs(x.t - animTime) > .02);
      renderTimeline(); refreshInspector(); previewFrame(); markDirty();
    };
    b.appendChild(del);
  }
}
function keyAt(clip, partName, t){
  const arr = (clip.tracks || {})[partName] || [];
  return arr.find(k => Math.abs(k.t - t) < .02) || null;
}
function ensureKey(clip, partName, t){
  clip.tracks = clip.tracks || {};
  const arr = clip.tracks[partName] = clip.tracks[partName] || [];
  let k = arr.find(x => Math.abs(x.t - t) < .02);
  if (!k) {
    const s = Anim.sample(arr, t) || { r:[0,0,0], p:[0,0,0], s:[1,1,1] };
    k = { t:+t.toFixed(2), r:(s.r || [0,0,0]).slice(), p:(s.p || [0,0,0]).slice(), s:(s.s || [1,1,1]).slice() };
    arr.push(k); arr.sort((a, b) => a.t - b.t);
  }
  return k;
}
function writeKeyFromGroup(){
  const m = curModel(), c = curClip(); if (!m || !c || !selPart) return;
  const part = m.parts.find(x => x.id === selPart); if (!part) return;
  const g = partGroup(selPart); if (!g || !g.userData.base) return;
  const b = g.userData.base;
  const k = ensureKey(c, part.name, animTime);
  k.r = [+( (g.rotation.x - b.r.x) / deg).toFixed(1), +((g.rotation.y - b.r.y) / deg).toFixed(1), +((g.rotation.z - b.r.z) / deg).toFixed(1)];
  k.p = [+(g.position.x - b.p.x).toFixed(3), +(g.position.y - b.p.y).toFixed(3), +(g.position.z - b.p.z).toFixed(3)];
  renderTimeline(); refreshInspector(); markDirty();
}
function previewFrame(){
  const c = curClip(); if (!c || !stageModel) return;
  Anim.apply(stageModel, c.name, animTime, false);
  if (selPart) attachGizmo(partGroup(selPart));
  updatePlayhead();
}

/* ---------- Linea de tiempo ---------- */
function renderTimeline(){
  const pane = $('#pane-time'); const m = curModel(), c = curClip();
  if (!m) { pane.innerHTML = '<div class="empty">Abre un modelo para animarlo.</div>'; return; }
  if (!c) { pane.innerHTML = '<div class="empty">Crea o copia una animación para empezar.</div>'; return; }
  pane.innerHTML =
    '<div class="head">' +
      '<button class="tbtn" id="tlPlay"></button>' +
      '<button class="tbtn" id="tlStop"></button>' +
      '<span class="pill on" id="tlTime"></span>' +

      '<span class="pill">Duración ' + c.dur.toFixed(1) + 's</span>' +
      '<button class="tbtn" id="tlKey">Fotograma aquí</button>' +
      '<span style="color:#5A6680;font-size:11px">Haz clic en la pista para moverte en el tiempo. ' +
      'Gira la pieza con el gizmo y se guarda sola.</span>' +
    '</div>' +
    '<div class="tl" id="tl"><div class="tlhead"><div>Pieza</div><div id="tlruler"></div></div></div>';
  $('#tlPlay').innerHTML = icon('play', 14);
  $('#tlStop').innerHTML = icon('stop', 14);
  $('#tlTime').textContent = animTime.toFixed(2) + 's';
  $('#tlPlay').onclick = () => { Anim.preview.playing = true; Anim.preview.t = animTime; };
  $('#tlStop').onclick = () => { Anim.preview.playing = false; animTime = 0; Anim.preview.t = 0; previewFrame(); renderTimeline(); };
  $('#tlKey').onclick = () => { if (selKeyPart) { const p = m.parts.find(x => x.id === selKeyPart);
    if (p) { ensureKey(c, p.name, animTime); renderTimeline(); refreshInspector(); markDirty(); } } else toast('Elige antes una pieza'); };
  const tl = $('#tl');
  m.parts.forEach(part => {
    const row = el('<div class="tlrow' + (part.id === selKeyPart ? ' on' : '') + '"><div class="tlname"></div><div class="tltrack"></div></div>');
    row.querySelector('.tlname').textContent = part.name;
    const track = row.querySelector('.tltrack');
    (((c.tracks || {})[part.name]) || []).forEach(k => {
      const d = el('<div class="key' + (Math.abs(k.t - animTime) < .02 ? ' on' : '') + '"></div>');
      d.style.left = (k.t / c.dur * 100) + '%';
      d.title = k.t.toFixed(2) + 's';
      d.onclick = ev => { ev.stopPropagation(); selKeyPart = part.id; selPart = part.id; animTime = k.t;
        Anim.preview.playing = false; previewFrame(); renderTimeline(); renderPartList(true); refreshInspector(); };
      track.appendChild(d);
    });
    track.onclick = ev => {
      const r = track.getBoundingClientRect();
      animTime = +clamp((ev.clientX - r.left) / r.width * c.dur, 0, c.dur).toFixed(2);
      selKeyPart = part.id; selPart = part.id;
      Anim.preview.playing = false;
      previewFrame(); renderTimeline(); renderPartList(true); refreshInspector();
    };
    tl.appendChild(row);
  });
  const ph = el('<div id="playhead"></div>');
  ph.style.left = 'calc(118px + ' + (animTime / c.dur * 100) + '% * (100% - 118px) / 100%)';
  tl.style.position = 'relative';
  tl.appendChild(ph);
  updatePlayhead();
}
function updatePlayhead(){
  const ph = document.getElementById('playhead'), c = curClip();
  if (!ph || !c) return;
  const t = Anim.preview.playing ? Anim.preview.t : animTime;
  const tl = document.getElementById('tl'); if (!tl) return;
  const w = tl.clientWidth - 118;
  ph.style.left = (118 + w * (t / c.dur)) + 'px';
  const lbl = document.getElementById('tlTime'); if (lbl) lbl.textContent = t.toFixed(2) + 's';
}

function startGame(){
  if (playing || mode !== 'scene') return;
  if (!P.objects.length) { toast('Añade algo a la escena antes de jugar'); return; }
  playing = true; gizmo.visible = false; grid.visible = false; activeCam = gameCam;
  $('#btnPlay').innerHTML = icon('stop', 14) + '<span>Detener</span>';
  $('#btnPlay').classList.remove('primary'); $('#btnPlay').classList.add('danger');
  $('#playHint').style.display = 'block'; $('#hud').style.display = 'none';
  RT.start();
  if (['fps','tp','car'].indexOf(RT.camMode) >= 0 && canvas.requestPointerLock) { try { canvas.requestPointerLock(); } catch (e) {} }
  canvas.onclick = () => { if (playing && canvas.requestPointerLock) canvas.requestPointerLock(); };
  log('Partida iniciada · ' + RT.ents.length + ' objetos', 'in');
}
function stopGame(){
  if (!playing) return;
  playing = false; RT.stop(); activeCam = editorCam; grid.visible = true;
  $('#btnPlay').innerHTML = icon('play', 14) + '<span>Probar juego</span>';
  $('#btnPlay').classList.add('primary'); $('#btnPlay').classList.remove('danger');
  $('#playHint').style.display = 'none'; $('#hud').style.display = 'flex';
  canvas.onclick = null;
  Object.keys(meshes).forEach(id => Anim.reset(meshes[id]));
  if (selId) attachGizmo(meshes[selId]);
  log('Vuelta al editor');
}
$('#btnPlay').onclick = () => playing ? stopGame() : startGame();

function inspectorBehaviors(b, o){

  }
  o.behaviors.forEach((inst, idx) => {
    const def = BEH[inst.id]; if (!def) return;
    const card = el('<div class="sub' + (inst.off ? ' beh-off' : '') + '"><h4><span></span>' +
      '<button class="iconbtn" data-a="up"></button><button class="iconbtn" data-a="down"></button>' +

    bt('down').innerHTML = icon('rotar', 12); bt('down').title = 'Bajar';
    bt('down').style.transform = 'scaleY(-1)';
    bt('off').innerHTML = icon(inst.off ? 'ojoNo' : 'ojo', 13); bt('off').title = inst.off ? 'Activar' : 'Desactivar';
    bt('rm').innerHTML = icon('cerrar', 13); bt('rm').title = 'Quitar';

    bt('down').onclick = () => { if (idx < o.behaviors.length - 1) { o.behaviors.splice(idx + 1, 0, o.behaviors.splice(idx, 1)[0]); refreshInspector(); markDirty(); } };
    bt('off').onclick = () => { inst.off = !inst.off; refreshInspector(); renderTree(); markDirty(); };
    bt('rm').onclick = () => { o.behaviors.splice(idx, 1); refreshInspector(); renderTree(); markDirty(); };
    const d = el('<div style="color:#8794AE;font-size:10.5px;line-height:1.5;margin-bottom:8px"></div>');
    d.textContent = def.desc; card.appendChild(d);

      else card.appendChild(fieldNum(pr.l, inst.p[pr.k], v => { inst.p[pr.k] = v; markDirty(); }));
    });

  });

function renderSndCtrls(){
  const c = $('#sc'); c.innerHTML = '';
  const w = el('<div class="sctrl"><label>Timbre</label><select class="inp"></select><output></output></div>');
  const sel = w.querySelector('select');
  [['sine','suave'],['square','retro'],['sawtooth','áspero'],['triangle','hueco']].forEach(x => {
    const op = document.createElement('option'); op.value = x[0]; op.textContent = x[1]; sel.appendChild(op);
  });
  sel.value = sndCfg.wave; sel.onchange = () => { sndCfg.wave = sel.value; Snd.play(sndCfg); };
  c.appendChild(w);
  c.appendChild(fieldRange('Tono inicial', sndCfg.f1, 40, 2400, 10, v => sndCfg.f1 = v));
  c.appendChild(fieldRange('Tono final', sndCfg.f2, 40, 2400, 10, v => sndCfg.f2 = v));
  c.appendChild(fieldRange('Duración', sndCfg.dur, .04, 1.6, .02, v => sndCfg.dur = v));
  c.appendChild(fieldRange('Ataque', sndCfg.atk, .001, .3, .002, v => sndCfg.atk = v));
  c.appendChild(fieldRange('Brillo', sndCfg.filt, 200, 9000, 100, v => sndCfg.filt = v));
  c.appendChild(fieldRange('Ruido', sndCfg.noise || 0, 0, 1, .05, v => sndCfg.noise = v));
  c.appendChild(fieldRange('Volumen', sndCfg.vol, 0, .6, .01, v => sndCfg.vol = v));
}
function renderSndLib(){
  const l = $('#slib'); if (!l) return;
  l.innerHTML = '';
  if (!P.sounds.length) { l.innerHTML = '<div class="empty" style="padding:12px">Sin sonidos guardados.</div>'; return; }
  P.sounds.forEach((s, i) => {
    const it = el('<div class="node"><span class="nm"></span><button class="iconbtn"></button><button class="iconbtn"></button></div>');
    it.querySelector('.nm').textContent = s.name;
    const bs = it.querySelectorAll('button');
    bs[0].innerHTML = icon('play', 13); bs[0].onclick = () => Snd.play(s.cfg);
    bs[1].innerHTML = icon('borrar', 13); bs[1].onclick = () => { P.sounds.splice(i, 1); renderSndLib(); markDirty(); };
    l.appendChild(it);
  });
}
