/* ============================================================
   Modelos con esqueleto real (GLB con skinning) y sus animaciones
   ============================================================ */
function gltfSkinned(json, bufs){
  const bytesPer = t => (t === 5126 || t === 5125) ? 4 : (t === 5123 ? 2 : 1);
  const readAcc = i => {
    if (i === undefined) return null;
    const acc = json.accessors[i], bv = json.bufferViews[acc.bufferView];
    const buf = bufs[bv.buffer || 0]; if (!buf) return null;
    const comps = { SCALAR:1, VEC2:2, VEC3:3, VEC4:4, MAT4:16 }[acc.type] || 1;
    const start = (bv.byteOffset || 0) + (acc.byteOffset || 0);
    const ab = buf.buffer.slice(buf.byteOffset + start, buf.byteOffset + start + acc.count * comps * bytesPer(acc.componentType));
    const arr = acc.componentType === 5126 ? new Float32Array(ab)
      : acc.componentType === 5125 ? new Uint32Array(ab)
      : acc.componentType === 5123 ? new Uint16Array(ab) : new Uint8Array(ab);
    return Array.prototype.slice.call(arr);
  };
  if (!json.skins || !json.skins.length) return null;
  const nodoConSkin = (json.nodes || []).findIndex(n => n.skin !== undefined && n.mesh !== undefined);
  if (nodoConSkin < 0) return null;
  const nodo = json.nodes[nodoConSkin];
  const skin = json.skins[nodo.skin];
  const prim = json.meshes[nodo.mesh].primitives[0];
  const v = readAcc(prim.attributes.POSITION);
  if (!v) return null;
  const out = {
    v:v, n:readAcc(prim.attributes.NORMAL), uv:readAcc(prim.attributes.TEXCOORD_0),
    ji:readAcc(prim.attributes.JOINTS_0), jw:readAcc(prim.attributes.WEIGHTS_0),
    idx:readAcc(prim.indices), inv:readAcc(skin.inverseBindMatrices), bones:[], clips:[]
  };
  if (prim.attributes.COLOR_0 !== undefined && json.accessors[prim.attributes.COLOR_0].type === 'VEC3' && json.accessors[prim.attributes.COLOR_0].componentType === 5126) out.c = readAcc(prim.attributes.COLOR_0);
  if (!out.ji || !out.jw) return null;
  const orden = {}; skin.joints.forEach((n, i) => orden[n] = i);
  skin.joints.forEach((ni, i) => {
    const n = json.nodes[ni];
    let padre = -1;
    (json.nodes || []).forEach((cand, ci) => { if ((cand.children || []).indexOf(ni) >= 0 && orden[ci] !== undefined) padre = orden[ci]; });
    out.bones.push({ name:n.name || ('hueso' + i), parent:padre,
      t:n.translation || [0, 0, 0], r:n.rotation || [0, 0, 0, 1], s:n.scale || [1, 1, 1] });
  });
  (json.animations || []).forEach((an, ai) => {
    const tracks = []; let dur = 0;
    (an.channels || []).forEach(ch => {
      const bi = orden[ch.target.node]; if (bi === undefined) return;
      const smp = an.samplers[ch.sampler]; if (!smp) return;
      const times = readAcc(smp.input), values = readAcc(smp.output);
      if (!times || !values) return;
      dur = Math.max(dur, times[times.length - 1] || 0);
      tracks.push({ bone:out.bones[bi].name, path:ch.target.path, times:times, values:values });
    });
    if (tracks.length) out.clips.push({ name:an.name || ('animacion_' + (ai + 1)), dur:dur || 1, tracks:tracks });
  });
  return out;
}
function buildSkinned(model){
  const sk = model.skin;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(sk.v, 3));
  if (sk.n) g.setAttribute('normal', new THREE.Float32BufferAttribute(sk.n, 3));
  if (sk.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(sk.uv, 2));
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(sk.ji, 4));
  g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sk.jw, 4));
  if (sk.idx) g.setIndex(sk.idx);
  if (!sk.n) g.computeVertexNormals();
  if (sk.c) g.setAttribute('color', new THREE.Float32BufferAttribute(sk.c, 3));
  const mat = new THREE.MeshStandardMaterial({ color:new THREE.Color(sk.c ? '#ffffff' : (model.color || '#c2ccdd')),
    roughness:.72, metalness:.05, skinning:true, vertexColors:!!sk.c });
  const mesh = new THREE.SkinnedMesh(g, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  const bones = sk.bones.map(b => {
    const bo = new THREE.Bone();
    bo.name = b.name; bo.position.fromArray(b.t); bo.quaternion.fromArray(b.r); bo.scale.fromArray(b.s);
    return bo;
  });
  bones.forEach((bo, i) => { const p = sk.bones[i].parent; if (p >= 0) bones[p].add(bo); });
  const raiz = bones.filter((b, i) => sk.bones[i].parent < 0);
  const inv = [];
  for (let i = 0; i < sk.bones.length; i++) inv.push(new THREE.Matrix4().fromArray(sk.inv || [], i * 16));
  const esq = new THREE.Skeleton(bones, (sk.inv && sk.inv.length) ? inv : undefined);
  const grupo = new THREE.Group();
  raiz.forEach(b => grupo.add(b));
  grupo.add(mesh);
  // si el archivo trae las matrices de enlace, se respetan (antes se recalculaban y los modelos importados salían deformados)
  if (sk.inv && sk.inv.length) mesh.bind(esq, new THREE.Matrix4()); else mesh.bind(esq);
  grupo.userData.skinned = true;
  grupo.userData.mixer = new THREE.AnimationMixer(grupo);
  grupo.userData.clips = {};
  (sk.clips || []).forEach(c => {
    const tracks = [];
    c.tracks.forEach(t => {
      const nombre = t.bone + '.' + (t.path === 'rotation' ? 'quaternion' : t.path);
      try {
        tracks.push(t.path === 'rotation'
          ? new THREE.QuaternionKeyframeTrack(nombre, t.times, t.values)
          : new THREE.VectorKeyframeTrack(nombre, t.times, t.values));
      } catch (e) {}
    });
    if (tracks.length) grupo.userData.clips[c.name] = new THREE.AnimationClip(c.name, c.dur, tracks);
  });
  return grupo;
}
const Skin = {
  play(obj, nombre, R){
    if (!obj.userData || !obj.userData.mixer) return false;
    const clips = obj.userData.clips || {};
    const clip = clips[nombre] || clips[Object.keys(clips)[0]];
    if (!clip) return false;
    if (obj.userData.actual === clip.name) return true;
    const mixer = obj.userData.mixer;
    if (obj.userData.act) obj.userData.act.fadeOut(.22);
    const a = mixer.clipAction(clip);
    a.reset().fadeIn(.22).play();
    obj.userData.act = a; obj.userData.actual = clip.name;
    return true;
  },
  tick(dt, R){
    R.ents.forEach(e => {
      if (e.dead) return;
      const m = e.o.userData && e.o.userData.mixer;
      if (m) m.update(dt);
    });
  }
};
BEHAVIORS.push({

  update(e, p, dt, R){ if (!e.o.userData.actual) Skin.play(e.o, p.clip, R); }
});
BEHAVIORS.push({
  id:'animSkinState', name:'Esqueleto según el movimiento', cat:'Animación',
  desc:'Cambia sola entre las animaciones de reposo, andar y correr de un modelo con huesos.',
  params:[{ k:'quieto', l:'Animación en reposo', t:'txt', d:'idle' },{ k:'andar', l:'Al andar', t:'txt', d:'walk' },
          { k:'correr', l:'Al correr', t:'txt', d:'run' },{ k:'umbral', l:'Velocidad para correr', t:'num', d:7 }],
  init(e){ e.rt.prev = e.o.position.clone(); },
  update(e, p, dt, R){

    Skin.play(e.o, q, R);
  }
});

/* ---------- Controles tactiles ---------- */
const Touch = {
  on:false, el:null,
  hayTactil(){ return ('ontouchstart' in window) || navigator.maxTouchPoints > 0; },
  start(R){
    if (!this.hayTactil() || !R.player) return;
    this.stop();
    const c = document.createElement('div');
    c.id = 'touchPad';
    c.innerHTML =
      '<div id="tStick"><div id="tKnob"></div></div>' +
      '<div id="tBtns"><button data-t="jump">Saltar</button><button data-t="use">Usar</button><button data-t="fire">Acción</button></div>';
    (document.getElementById('view') || document.body).appendChild(c);
    this.el = c; this.on = true;
    const stick = c.querySelector('#tStick'), knob = c.querySelector('#tKnob');
    let id = null, cx = 0, cy = 0;
    stick.addEventListener('pointerdown', e => { id = e.pointerId; const r = stick.getBoundingClientRect();
      cx = r.left + r.width / 2; cy = r.top + r.height / 2; stick.setPointerCapture(id); });
    stick.addEventListener('pointermove', e => {
      if (e.pointerId !== id) return;
      const dx = clamp((e.clientX - cx) / 46, -1, 1), dy = clamp((e.clientY - cy) / 46, -1, 1);
      knob.style.transform = 'translate(' + dx * 26 + 'px,' + dy * 26 + 'px)';
      R.keys['w'] = dy < -.3; R.keys['s'] = dy > .3; R.keys['a'] = dx < -.3; R.keys['d'] = dx > .3;
    });
    const soltar = e => { if (e.pointerId !== id) return; id = null; knob.style.transform = '';
      R.keys['w'] = R.keys['s'] = R.keys['a'] = R.keys['d'] = false; };
    stick.addEventListener('pointerup', soltar); stick.addEventListener('pointercancel', soltar);
    c.querySelectorAll('#tBtns button').forEach(b => {
      const t = b.dataset.t;
      b.addEventListener('pointerdown', () => {
        if (t === 'jump') R.keys[' '] = true;
        else if (t === 'use') R.keys['e'] = true;
        else R.mouse.down = true;
      });
      b.addEventListener('pointerup', () => {
        if (t === 'jump') R.keys[' '] = false;
        else if (t === 'use') R.keys['e'] = false;
        else R.mouse.down = false;
      });
    });
    /* mirar arrastrando por la pantalla */
    const cv = document.getElementById('cv');
    let lid = null, lx = 0, ly = 0;
    this._ld = e => { if (e.target.closest && e.target.closest('#touchPad')) return; lid = e.pointerId; lx = e.clientX; ly = e.clientY; };
    this._lm = e => { if (e.pointerId !== lid) return; R.mouse.dx += (e.clientX - lx) * 1.4; R.mouse.dy += (e.clientY - ly) * 1.4; lx = e.clientX; ly = e.clientY; };
    this._lu = () => { lid = null; };
    cv.addEventListener('pointerdown', this._ld); cv.addEventListener('pointermove', this._lm);
    window.addEventListener('pointerup', this._lu);
  },
  stop(){
    if (this.el) { this.el.remove(); this.el = null; }
    const cv = document.getElementById('cv');
    if (cv && this._ld) { cv.removeEventListener('pointerdown', this._ld); cv.removeEventListener('pointermove', this._lm); }
    window.removeEventListener('pointerup', this._lu);
    this.on = false;
  }
};

          { k:'dist', l:'Distancia de cámara', t:'num', d:7 },{ k:'alto', l:'Altura de cámara', t:'num', d:3 }],
  init(e, p, R){
    R.player2 = e; e.rt.vy = 0; e.rt.yaw = 0; e.rt.pitch = .3;
    R.split = true;
    if (R.players.indexOf(e) < 0) R.players.push(e);
    if (e.rt.hp === undefined) { e.rt.hp = 100; e.rt.hpmax = 100; }
    R.state.hp2 = e.rt.hp; R.state.hpmax2 = e.rt.hpmax;
  },
  update(e, p, dt, R){
    const k = R.keys;
    if (k['4']) e.rt.yaw += 1.8 * dt;
    if (k['6']) e.rt.yaw -= 1.8 * dt;
    if (k['8']) e.rt.pitch = R.clamp(e.rt.pitch + 1.2 * dt, -.5, 1.1);
    if (k['2']) e.rt.pitch = R.clamp(e.rt.pitch - 1.2 * dt, -.5, 1.1);
    let fx = 0, fz = 0;
    if (k['arrowup']) fz -= 1; if (k['arrowdown']) fz += 1;
    if (k['arrowleft']) fx -= 1; if (k['arrowright']) fx += 1;
    const len = Math.hypot(fx, fz) || 1; fx /= len; fz /= len;
    const sin = Math.sin(e.rt.yaw), cos = Math.cos(e.rt.yaw);
    const vx = (fx * cos - fz * sin) * p.speed, vz = (fx * sin + fz * cos) * p.speed;
    e.rt.vy -= R.gravity * dt;
    if ((k['control'] || k['enter'] || k['0']) && e.rt.grounded) e.rt.vy = p.jump;
    R.moveWithCollision(e, vx * dt, e.rt.vy * dt, vz * dt);
    if (e.rt.hitY) e.rt.vy = 0;
    if (fx || fz) e.o.rotation.y = Math.atan2(vx, vz);
    const cp = e.rt.pitch, c2 = R.cam2;
    if (c2) {
      c2.position.set(
        e.o.position.x - Math.sin(e.rt.yaw) * p.dist * Math.cos(cp),
        e.o.position.y + p.alto + p.dist * Math.sin(cp),
        e.o.position.z - Math.cos(e.rt.yaw) * p.dist * Math.cos(cp));
      c2.lookAt(e.o.position.x, e.o.position.y + 1, e.o.position.z);
    }
    R.state.hp2 = e.rt.hp;
  }
});

  params:[{ k:'fuerza', l:'Impulso al soltarse', t:'num', d:5 },{ k:'dura', l:'Segundos antes de esfumarse', t:'num', d:6 }],
  init(e, p, R){ e.rt.trapo = p; }

const Ragdoll = {
  piezas:[],
  start(){ this.piezas = []; },
  lanzar(e, R){
    const p = e.rt.trapo || { fuerza:5, dura:6 };
    const partes = e.o.userData && e.o.userData.parts;
    const lista = [];
    if (partes) Object.keys(partes).forEach(n => lista.push(partes[n]));
    if (!lista.length) {
      /* sin piezas: cae el objeto entero girando */
      this.piezas.push({ o:e.o, v:new THREE.Vector3((Math.random() - .5) * p.fuerza, p.fuerza * .6, (Math.random() - .5) * p.fuerza),
        w:new THREE.Vector3(Math.random() * 6 - 3, Math.random() * 6 - 3, Math.random() * 6 - 3), t:p.dura, suelto:false });
      return true;
    }
    lista.forEach(g => {
      const wp = new THREE.Vector3(), wq = new THREE.Quaternion(), ws = new THREE.Vector3();
      g.updateWorldMatrix(true, false);
      g.matrixWorld.decompose(wp, wq, ws);
      const mesh = g.userData.mesh;
      const clon = mesh ? mesh.clone() : null;
      if (!clon) return;
      const cont = new THREE.Group();
      cont.position.copy(wp); cont.quaternion.copy(wq); cont.scale.copy(ws);
      cont.add(clon);
      root.add(cont);
      this.piezas.push({ o:cont, t:p.dura, suelto:true,
        v:new THREE.Vector3((Math.random() - .5) * p.fuerza, p.fuerza * (.4 + Math.random() * .6), (Math.random() - .5) * p.fuerza),
        w:new THREE.Vector3(Math.random() * 8 - 4, Math.random() * 8 - 4, Math.random() * 8 - 4) });
    });
    e.o.visible = false;
    return true;
  },
  tick(dt, R){
    for (let i = this.piezas.length - 1; i >= 0; i--) {
      const p = this.piezas[i];
      p.v.y -= R.gravity * dt;
      p.o.position.addScaledVector(p.v, dt);
      p.o.rotation.x += p.w.x * dt; p.o.rotation.y += p.w.y * dt; p.o.rotation.z += p.w.z * dt;
      const suelo = .25;
      if (p.o.position.y < suelo) {
        p.o.position.y = suelo;
        p.v.y = -p.v.y * .32; p.v.x *= .7; p.v.z *= .7; p.w.multiplyScalar(.6);
        if (Math.abs(p.v.y) < .6) p.v.y = 0;
      }
      p.t -= dt;
      if (p.t < 1.2) {
        p.o.traverse(c => { if (c.material) { c.material.transparent = true; c.material.opacity = Math.max(0, p.t / 1.2); } });
      }
      if (p.t <= 0) { if (p.suelto) root.remove(p.o); this.piezas.splice(i, 1); }
    }
  },
  stop(){ this.piezas.forEach(p => { if (p.suelto) root.remove(p.o); }); this.piezas = []; }
};

/* ---------- Lotes: fusionar e instanciar objetos repetidos ---------- */
const Lotes = {
  mallas:[],
  clave(o){
    return [o.geo, o.color, o.mat.rough, o.mat.metal, o.mat.opacity, o.mat.wire, o.mat.flat, o.mat.tex,
      o.scl.map(v => v.toFixed(3)).join('_'), JSON.stringify(o.params || {})].join('|');
  },
  build(){
    this.clear();
    if (!P.world.instanciar) return 0;
    const grupos = {};
    P.objects.forEach(o => {
      if (o.type !== 'mesh' || o.visible === false) return;
      if ((o.behaviors || []).length || (o.script || []).length) return;
      if (o.geo === 'terrain' || o.geo === 'custom') return;
      const k = this.clave(o);
      (grupos[k] = grupos[k] || []).push(o);
    });
    let lotes = 0, ahorrados = 0;
    Object.keys(grupos).forEach(k => {
      const lista = grupos[k];
      if (lista.length < 4) return;
      const base = lista[0];
      const geo = makeGeometry(base), mat = makeMaterial(base);
      const inst = new THREE.InstancedMesh(geo, mat, lista.length);
      inst.castShadow = true; inst.receiveShadow = true;
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), t = new THREE.Vector3();
      lista.forEach((o, i) => {
        t.fromArray(o.pos); s.fromArray(o.scl);
        q.setFromEuler(new THREE.Euler(o.rot[0] * deg, o.rot[1] * deg, o.rot[2] * deg));
        m.compose(t, q, s);
        inst.setMatrixAt(i, m);
        if (meshes[o.id]) meshes[o.id].visible = false;
      });
      inst.instanceMatrix.needsUpdate = true;
      root.add(inst); this.mallas.push(inst);
      lotes++; ahorrados += lista.length;
    });
    if (lotes) log('Rendimiento: ' + ahorrados + ' objetos repetidos agrupados en ' + lotes + ' lote(s)', 'ok');
    this.stats = { lotes:lotes, objetos:ahorrados };
    return lotes;
  },
  clear(){
    this.mallas.forEach(m => { root.remove(m); m.geometry.dispose(); m.material.dispose(); });
    this.mallas = [];
    P.objects.forEach(o => { if (meshes[o.id]) meshes[o.id].visible = o.visible !== false; });
  }
};

/* ---------- Reflejos de entorno y calidad de sombra ---------- */
function buildEnvironment(){
  const w = P.world;
  if (!w.reflejos) { scene.environment = null; return; }
  let cv, ctx, g;
  try {
    cv = document.createElement('canvas');
    cv.width = 64; cv.height = 32;
    ctx = cv.getContext('2d');
    if (!ctx || !ctx.createLinearGradient) return;
    g = ctx.createLinearGradient(0, 0, 0, 32);
  } catch (e) { return; }
  try {
  g.addColorStop(0, w.sky || '#0b1018');
  g.addColorStop(.48, '#9fb3d6');
  g.addColorStop(.52, w.groundColor || '#222d42');
  g.addColorStop(1, '#0a0d14');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 32);
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = tex;
  } catch (e) { return; }
  root.traverse(o => { if (o.material && o.material.isMeshStandardMaterial) o.material.envMapIntensity = w.reflejos; });
}
function applyShadowQuality(){
  const w = P.world;
  const cal = w.sombraCalidad || 2048;
  if (sun.shadow.mapSize.width !== cal) {
    sun.shadow.mapSize.set(cal, cal);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  const d = w.sombraDist || 100;
  sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
  sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
  sun.shadow.camera.far = d * 2.6;
  sun.shadow.bias = -0.0006;
  sun.shadow.radius = w.sombraSuave !== undefined ? w.sombraSuave : 1.6;
  sun.shadow.camera.updateProjectionMatrix();
}

/* ---------- Importar trozos de otro proyecto ---------- */
function mergeProject(d, opts){
  let n = 0;
  if (opts.modelos && d.models) {
    d.models.forEach(m => {
      const c = JSON.parse(JSON.stringify(m)); c.id = uid();
      (c.parts || []).forEach(p => p.id = uid());
      if (P.models.some(x => x.name === c.name)) c.name = c.name + ' (importado)';
      P.models.push(c); n++;
    });
  }
  if (opts.objetos && d.objects) {
    const mapaModelos = {};
    (d.models || []).forEach((m, i) => {
      const nuevo = P.models[P.models.length - (d.models.length - i)];
      if (nuevo) mapaModelos[m.id] = nuevo.id;
    });
    d.objects.forEach(o => {
      const c = JSON.parse(JSON.stringify(o)); c.id = uid();
      if (c.type === 'model' && mapaModelos[c.model]) c.model = mapaModelos[c.model];
      (c.script || []).forEach(function reid(b){ b.id = uid(); (b.body || []).forEach(reid); });
      if (P.objects.some(x => x.name === c.name)) c.name = c.name + ' (imp)';
      P.objects.push(c); n++;
    });
  }
  if (opts.interfaz && d.ui && d.ui.elements) {
    d.ui.elements.forEach(e => { const c = JSON.parse(JSON.stringify(e)); c.id = uid(); uiList().push(c); n++; });
  }
  if (opts.sonidos) {
    (d.sounds || []).forEach(s => { const c = JSON.parse(JSON.stringify(s)); c.id = uid(); P.sounds.push(c); n++; });
    if (d.assets && d.assets.snd) d.assets.snd.forEach(s => { const c = JSON.parse(JSON.stringify(s)); c.id = uid(); assets().snd.push(c); n++; });
  }
  if (opts.texturas && d.assets && d.assets.tex) {
    d.assets.tex.forEach(t => { const c = JSON.parse(JSON.stringify(t)); c.id = uid(); assets().tex.push(c); n++; });
  }
  if (opts.variables && d.vars) {
    d.vars.forEach(v => { if (!P.vars.some(x => x.name === v.name)) { P.vars.push(JSON.parse(JSON.stringify(v))); n++; } });
  }
  rebuildAll(); applyWorld(); renderTree(); renderModelLib(); renderSndLib(); renderVarsPane();
  renderAssets(); refreshInspector(); markDirty();
  log('Importados ' + n + ' elementos de otro proyecto', 'ok');
  toast(n + ' elementos importados');
  return n;
}

/* ============================================================
   Edicion de malla: vertices, aristas, caras y escultura
   ============================================================ */
const EM = {
  on:false, part:null, sel:[], modo:'vertice', brocha:{ tipo:'empujar', radio:.55, fuerza:.12 },
  puntos:null, lineas:null, proxy:null,

  active(){ return this.on && !!this.part; },
  meshOf(){ const m = curModel(); return m && m.parts.find(p => p.id === this.part); },

  /* convierte cualquier forma en malla editable (vertices + caras) */
  toEditable(part){
    if (part.geo === 'custom' && part.mesh && part.mesh.f) return part.mesh;
    let g = makeGeometry(part);
    if (g.index) g = g.toNonIndexed();
    const pos = g.attributes.position.array;
    const v = [], f = [], mapa = {};
    for (let i = 0; i < pos.length; i += 9) {
      const tri = [];
      for (let k = 0; k < 3; k++) {
        const x = +pos[i + k * 3].toFixed(4), y = +pos[i + k * 3 + 1].toFixed(4), z = +pos[i + k * 3 + 2].toFixed(4);
        const key = x + '_' + y + '_' + z;
        if (mapa[key] === undefined) { mapa[key] = v.length / 3; v.push(x, y, z); }
        tri.push(mapa[key]);
      }
      f.push(tri[0], tri[1], tri[2]);
    }
    part.geo = 'custom'; part.mesh = { v:v, f:f };
    return part.mesh;
  },
  geo(mesh){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(mesh.v, 3));
    if (mesh.f && mesh.f.length) g.setIndex(mesh.f);
    g.computeVertexNormals();
    return g;
  },
  vec(mesh, i){ return new THREE.Vector3(mesh.v[i * 3], mesh.v[i * 3 + 1], mesh.v[i * 3 + 2]); },
  set(mesh, i, v){ mesh.v[i * 3] = +v.x.toFixed(4); mesh.v[i * 3 + 1] = +v.y.toFixed(4); mesh.v[i * 3 + 2] = +v.z.toFixed(4); },

  enter(partId){
    const m = curModel(); if (!m) return;
    const part = m.parts.find(p => p.id === partId); if (!part) return;
    this.toEditable(part);
    this.on = true; this.part = partId; this.sel = [];
    rebuildStage(); this.overlay(); renderEditPanel(); refreshInspector();
    toast('Edición de malla: ' + part.name);
  },
  exit(){
    this.on = false; this.part = null; this.sel = [];
    this.clearOverlay(); rebuildStage(); renderPartPalette(); refreshInspector();
  },
  clearOverlay(){
    [this.puntos, this.lineas].forEach(o => { if (o) { stage.remove(o); o.geometry.dispose(); o.material.dispose(); } });
    this.puntos = this.lineas = null;
  },
  overlay(){
    this.clearOverlay();
    const part = this.meshOf(); if (!part) return;
    const g = partGroup(this.part); if (!g) return;
    const mesh = part.mesh;
    const wp = [];
    const mw = (g.userData.mesh || g).matrixWorld;
    g.updateWorldMatrix(true, true);
    const tmp = new THREE.Vector3();
    for (let i = 0; i < mesh.v.length / 3; i++) {
      tmp.set(mesh.v[i * 3], mesh.v[i * 3 + 1], mesh.v[i * 3 + 2]).applyMatrix4(mw);
      wp.push(tmp.x, tmp.y, tmp.z);
    }
    const pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
    const col = [];
    for (let i = 0; i < wp.length / 3; i++) {
      const s = this.sel.indexOf(i) >= 0;
      col.push(s ? 1 : .42, s ? .62 : .58, s ? .26 : .78);
    }
    pg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    this.puntos = new THREE.Points(pg, new THREE.PointsMaterial({ size:.085, vertexColors:true, depthTest:false, sizeAttenuation:true }));
    this.puntos.renderOrder = 998;
    stage.add(this.puntos);
    const lg = new THREE.BufferGeometry();
    const seg = [];
    for (let i = 0; i < mesh.f.length; i += 3) {
      const a = mesh.f[i], b = mesh.f[i + 1], c = mesh.f[i + 2];
      [[a, b],[b, c],[c, a]].forEach(e => {
        seg.push(wp[e[0] * 3], wp[e[0] * 3 + 1], wp[e[0] * 3 + 2], wp[e[1] * 3], wp[e[1] * 3 + 1], wp[e[1] * 3 + 2]);
      });
    }
    lg.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
    this.lineas = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color:0x3ba9e8, transparent:true, opacity:.35, depthTest:false }));
    this.lineas.renderOrder = 997;
    stage.add(this.lineas);
    this.updateProxy();
  },
  updateProxy(){
    if (!this.proxy) { this.proxy = new THREE.Object3D(); stage.add(this.proxy); }
    if (!this.sel.length) { attachGizmo(null); return; }
    const part = this.meshOf(), g = partGroup(this.part);
    if (!part || !g) return;
    const mw = (g.userData.mesh || g).matrixWorld;
    const c = new THREE.Vector3();
    this.sel.forEach(i => c.add(this.vec(part.mesh, i).applyMatrix4(mw)));
    c.divideScalar(this.sel.length);
    this.proxy.position.copy(c);
    attachGizmo(this.proxy);
  },

  /* seleccion con el raton */
  pick(e, add){
    const part = this.meshOf(), g = partGroup(this.part);
    if (!part || !g || !this.puntos) return false;
    ray.setFromCamera(ndc(e), editorCam);
    ray.params.Points.threshold = .12;
    const hp = ray.intersectObject(this.puntos, false);
    if (hp.length && this.modo === 'vertice') {
      const i = hp[0].index;
      if (add) { const k = this.sel.indexOf(i); if (k >= 0) this.sel.splice(k, 1); else this.sel.push(i); }
      else this.sel = [i];
      this.overlay(); refreshInspector(); return true;
    }
    const mesh = g.userData.mesh;
    if (mesh) {
      const hf = ray.intersectObject(mesh, false);
      if (hf.length && hf[0].face) {
        const f = hf[0].face;
        if (this.brocha.activa) return false;
        const tri = [f.a, f.b, f.c];
        if (this.modo === 'cara') { if (!add) this.sel = []; tri.forEach(i => { if (this.sel.indexOf(i) < 0) this.sel.push(i); }); }
        else if (!add) this.sel = tri.slice();
        else tri.forEach(i => { if (this.sel.indexOf(i) < 0) this.sel.push(i); });
        this.overlay(); refreshInspector(); return true;
      }
    }
    if (!add) { this.sel = []; this.overlay(); refreshInspector(); }
    return false;
  },
  mover(ax, cantidad){
    const part = this.meshOf(); if (!part || !this.sel.length) return false;
    const g = partGroup(this.part);
    const esc = g && g.userData.mesh ? g.userData.mesh.scale : new THREE.Vector3(1, 1, 1);
    const d = new THREE.Vector3(ax.x * cantidad / (esc.x || 1), ax.y * cantidad / (esc.y || 1), ax.z * cantidad / (esc.z || 1));
    this.sel.forEach(i => { const v = this.vec(part.mesh, i).add(d); this.set(part.mesh, i, v); });
    this.refresh();
    return true;
  },
  refresh(){
    const g = partGroup(this.part), part = this.meshOf();
    if (!g || !part) return;
    const mesh = g.userData.mesh;
    if (mesh) { mesh.geometry.dispose(); mesh.geometry = this.geo(part.mesh); }
    this.overlay();
  },

  /* operaciones */
  caras(){
    const part = this.meshOf(); const f = part.mesh.f, out = [];
    for (let i = 0; i < f.length; i += 3) {
      if (this.sel.indexOf(f[i]) >= 0 && this.sel.indexOf(f[i + 1]) >= 0 && this.sel.indexOf(f[i + 2]) >= 0) out.push(i);
    }
    return out;
  },
  normal(mesh, i){
    const a = this.vec(mesh, mesh.f[i]), b = this.vec(mesh, mesh.f[i + 1]), c = this.vec(mesh, mesh.f[i + 2]);
    return new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a)).normalize();
  },
  extruir(alt){
    const part = this.meshOf(); if (!part) return toast('Nada seleccionado');
    const mesh = part.mesh, caras = this.caras();
    if (!caras.length) return toast('Selecciona al menos una cara entera');
    const nuevos = {}, nuevaSel = [];
    caras.forEach(fi => {
      const n = this.normal(mesh, fi).multiplyScalar(alt);
      const tri = [mesh.f[fi], mesh.f[fi + 1], mesh.f[fi + 2]];
      const dup = tri.map(vi => {
        if (nuevos[vi] === undefined) {
          const v = this.vec(mesh, vi).add(n);
          nuevos[vi] = mesh.v.length / 3;
          mesh.v.push(+v.x.toFixed(4), +v.y.toFixed(4), +v.z.toFixed(4));
          nuevaSel.push(nuevos[vi]);
        }
        return nuevos[vi];
      });
      for (let k = 0; k < 3; k++) {
        const a = tri[k], b = tri[(k + 1) % 3], a2 = dup[k], b2 = dup[(k + 1) % 3];
        mesh.f.push(a, b, b2, a, b2, a2);
      }
      mesh.f[fi] = dup[0]; mesh.f[fi + 1] = dup[1]; mesh.f[fi + 2] = dup[2];
    });
    this.sel = nuevaSel;
    this.refresh(); refreshInspector(); markDirty();
    toast('Cara extruida');
  },
  subdividirSel(){
    const part = this.meshOf(); const mesh = part.mesh;
    const caras = this.caras().length ? this.caras() : null;
    const objetivo = caras || (function(){ const t = []; for (let i = 0; i < mesh.f.length; i += 3) t.push(i); return t; })();
    const añadidos = [];
    const nuevas = [];
    objetivo.slice().reverse().forEach(fi => {
      const a = mesh.f[fi], b = mesh.f[fi + 1], c = mesh.f[fi + 2];
      const medio = (i, j) => {
        const v = this.vec(mesh, i).add(this.vec(mesh, j)).multiplyScalar(.5);
        const idx = mesh.v.length / 3;
        mesh.v.push(+v.x.toFixed(4), +v.y.toFixed(4), +v.z.toFixed(4));
        añadidos.push(idx); return idx;
      };
      const ab = medio(a, b), bc = medio(b, c), ca = medio(c, a);
      mesh.f.splice(fi, 3);
      nuevas.push(a, ab, ca, ab, b, bc, ca, bc, c, ab, bc, ca);
    });
    mesh.f = mesh.f.concat(nuevas);
    this.sel = this.sel.concat(añadidos);
    this.refresh(); markDirty();
    toast('Subdividido: ' + (mesh.v.length / 3) + ' vértices');
  },
  suavizar(){
    const part = this.meshOf(); const mesh = part.mesh;
    const vecinos = {};
    for (let i = 0; i < mesh.f.length; i += 3) {
      const t = [mesh.f[i], mesh.f[i + 1], mesh.f[i + 2]];
      t.forEach((a, k) => {
        vecinos[a] = vecinos[a] || [];
        vecinos[a].push(t[(k + 1) % 3], t[(k + 2) % 3]);
      });
    }
    const objetivo = this.sel.length ? this.sel : Object.keys(vecinos).map(Number);
    const copia = mesh.v.slice();
    objetivo.forEach(i => {
      const vs = vecinos[i]; if (!vs || !vs.length) return;
      const c = new THREE.Vector3();
      vs.forEach(j => c.add(new THREE.Vector3(copia[j * 3], copia[j * 3 + 1], copia[j * 3 + 2])));
      c.divideScalar(vs.length);
      const v = new THREE.Vector3(copia[i * 3], copia[i * 3 + 1], copia[i * 3 + 2]).lerp(c, .55);
      this.set(mesh, i, v);
    });
    this.refresh(); markDirty(); toast('Suavizado');
  },
  espejo(eje){
    const part = this.meshOf(); const mesh = part.mesh;
    const base = mesh.v.length / 3;
    const k = eje === 'x' ? 0 : (eje === 'y' ? 1 : 2);
    for (let i = 0; i < base; i++) {
      const v = this.vec(mesh, i);
      v.setComponent(k, -v.getComponent(k));
      mesh.v.push(+v.x.toFixed(4), +v.y.toFixed(4), +v.z.toFixed(4));
    }
    const nf = [];
    for (let i = 0; i < mesh.f.length; i += 3) nf.push(base + mesh.f[i + 2], base + mesh.f[i + 1], base + mesh.f[i]);
    mesh.f = mesh.f.concat(nf);
    this.sel = [];
    this.refresh(); markDirty(); toast('Simetría aplicada en ' + eje.toUpperCase());
  },
  borrarCaras(){
    const part = this.meshOf(); const mesh = part.mesh;
    const caras = this.caras();
    if (!caras.length) return toast('Selecciona caras enteras');
    caras.sort((a, b) => b - a).forEach(fi => mesh.f.splice(fi, 3));
    this.sel = [];
    this.refresh(); markDirty(); toast(caras.length + ' cara(s) borradas');
  },
  invertir(){
    const part = this.meshOf(); const mesh = part.mesh;
    for (let i = 0; i < mesh.f.length; i += 3) { const t = mesh.f[i]; mesh.f[i] = mesh.f[i + 2]; mesh.f[i + 2] = t; }
    this.refresh(); markDirty(); toast('Caras invertidas');
  },

  /* escultura */
  esculpir(e){
    const part = this.meshOf(), g = partGroup(this.part);
    if (!part || !g) return false;
    const mesh3 = g.userData.mesh; if (!mesh3) return false;
    ray.setFromCamera(ndc(e), editorCam);
    const hit = ray.intersectObject(mesh3, false);
    if (!hit.length) return false;
    const local = mesh3.worldToLocal(hit[0].point.clone());
    const n = hit[0].face ? hit[0].face.normal.clone() : new THREE.Vector3(0, 1, 0);
    const b = this.brocha, mesh = part.mesh;
    const r = b.radio, f = b.fuerza * (b.tipo === 'cavar' ? -1 : 1);
    const copia = mesh.v.slice();
    for (let i = 0; i < mesh.v.length / 3; i++) {
      const v = this.vec(mesh, i);
      const d = v.distanceTo(local);
      if (d > r) continue;
      const caida = Math.pow(1 - d / r, 2);
      if (b.tipo === 'inflar') v.addScaledVector(v.clone().sub(local).normalize(), f * caida);
      else if (b.tipo === 'suavizar') {
        const c = new THREE.Vector3(copia[i * 3], copia[i * 3 + 1], copia[i * 3 + 2]).lerp(local, .16 * caida);
        v.copy(c);
      } else v.addScaledVector(n, f * caida);
      this.set(mesh, i, v);
    }
    this.refresh();
    return true;
  }
};

/* gancho del gizmo: mueve la seleccion de vertices */
function gizmoHook(axis, cantidad, modo){
  if (!EM.active() || !EM.sel.length || modo !== 'move') return false;
  EM.mover(new THREE.Vector3(axis === 'x' ? 1 : 0, axis === 'y' ? 1 : 0, axis === 'z' ? 1 : 0), cantidad);
  EM.updateProxy();
  return true;
}

   Particulas y dibujo 3D a mano alzada

const PART_PRESETS = {
  fuego:   { n:140, vida:1.1, vel:[0,2.6,0], disp:.7, tam:.42, c1:'#ffd36b', c2:'#e5566a', grav:-1.4, aditivo:1 },
  humo:    { n:110, vida:2.6, vel:[0,1.1,0], disp:.5, tam:.85, c1:'#9aa4b5', c2:'#2a3040', grav:-.2, aditivo:0 },
  chispas: { n:90,  vida:.8,  vel:[0,3.4,0], disp:2.4, tam:.13, c1:'#ffe9a8', c2:'#f59e42', grav:9, aditivo:1 },
  lluvia:  { n:420, vida:1.6, vel:[0,-14,0], disp:.4, tam:.09, c1:'#9fc7ff', c2:'#5f7fb0', grav:6, aditivo:0, caja:22 },
  nieve:   { n:300, vida:6,   vel:[0,-1.2,0], disp:.5, tam:.16, c1:'#ffffff', c2:'#cfe0ff', grav:.1, aditivo:0, caja:22 },
  polvo:   { n:70,  vida:3.4, vel:[0,.35,0], disp:.6, tam:.2, c1:'#cbbfa6', c2:'#6a6253', grav:.05, aditivo:0, caja:8 },
  magia:   { n:120, vida:1.6, vel:[0,1.4,0], disp:1.2, tam:.22, c1:'#c6a8ff', c2:'#3ba9e8', grav:-.6, aditivo:1 },
  sangre:  { n:60,  vida:1,   vel:[0,2.2,0], disp:2, tam:.16, c1:'#e5566a', c2:'#6b1622', grav:11, aditivo:0 }
};
const Particulas = {
  sistemas:[],
  crear(e, p, R){
    const pr = PART_PRESETS[p.tipo] || PART_PRESETS.fuego;
    const n = Math.round(pr.n * (p.cantidad || 1));
    const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({ size:pr.tam * (p.tamano || 1), vertexColors:true, transparent:true,
      opacity:.92, depthWrite:false, blending:pr.aditivo ? THREE.AdditiveBlending : THREE.NormalBlending });
    const pts = new THREE.Points(g, mat);
    pts.frustumCulled = false;
    scene.add(pts);
    const datos = [];
    for (let i = 0; i < n; i++) datos.push({ t:Math.random() * pr.vida, v:new THREE.Vector3(), p:new THREE.Vector3() });
    const s = { e:e, pts:pts, datos:datos, pr:pr, cfg:p, c1:new THREE.Color(pr.c1), c2:new THREE.Color(pr.c2) };
    this.sistemas.push(s);
    e.rt.particulas = s;
    return s;
  },
  reiniciar(s, i){
    const pr = s.pr, d = s.datos[i], o = s.e.o.position;
    d.t = 0;
    if (pr.caja) {
      d.p.set(o.x + (Math.random() - .5) * pr.caja, o.y + (pr.vel[1] < 0 ? 9 : 0) + Math.random() * 3, o.z + (Math.random() - .5) * pr.caja);
    } else {
      d.p.set(o.x + (Math.random() - .5) * .4, o.y, o.z + (Math.random() - .5) * .4);
    }
    d.v.set(pr.vel[0] + (Math.random() - .5) * pr.disp, pr.vel[1] * (.6 + Math.random() * .8), pr.vel[2] + (Math.random() - .5) * pr.disp);
  },
  tick(dt, R){
    const col = new THREE.Color();
    for (let k = 0; k < this.sistemas.length; k++) {
      const s = this.sistemas[k];
      if (s.e.dead || !s.e.o.visible) { s.pts.visible = false; continue; }
      s.pts.visible = true;
      const pr = s.pr, vida = pr.vida * (s.cfg.duracion || 1);
      const pos = s.pts.geometry.attributes.position.array, cc = s.pts.geometry.attributes.color.array;
      for (let i = 0; i < s.datos.length; i++) {
        const d = s.datos[i];
        d.t += dt;
        if (d.t > vida || d.t === 0) this.reiniciar(s, i);
        d.v.y -= pr.grav * dt;
        d.p.addScaledVector(d.v, dt);
        pos[i * 3] = d.p.x; pos[i * 3 + 1] = d.p.y; pos[i * 3 + 2] = d.p.z;
        col.copy(s.c1).lerp(s.c2, Math.min(1, d.t / vida));
        cc[i * 3] = col.r; cc[i * 3 + 1] = col.g; cc[i * 3 + 2] = col.b;
      }
      s.pts.geometry.attributes.position.needsUpdate = true;
      s.pts.geometry.attributes.color.needsUpdate = true;
    }
  },
  limpiar(){
    this.sistemas.forEach(s => { scene.remove(s.pts); s.pts.geometry.dispose(); s.pts.material.dispose(); });
    this.sistemas = [];
  }
};

/* ---------- Dibujo 3D ---------- */
const Dibujo = {
  on:false, color:'#f59e42', grosor:.06, trazo:null, mallas:[],
  lista(){ P.draw = P.draw || []; return P.draw; },
  toggle(){
    this.on = !this.on;
    $('#chipNav').textContent = this.on ? 'Dibujo 3D activo: arrastra para trazar · B para salir'
      : 'Pulsa F2 para navegar con el teclado';
    toast(this.on ? 'Dibujo 3D activado' : 'Dibujo 3D desactivado');
    if (!this.on) this.fin();
  },
  punto(e){
    ray.setFromCamera(ndc(e), editorCam);
    const hits = ray.intersectObjects(root.children, true);
    if (hits.length) return hits[0].point.clone().addScaledVector(hits[0].face ? hits[0].face.normal : new THREE.Vector3(0, 1, 0), .04);
    const plano = new THREE.Plane(new THREE.Vector3(0, 1, 0), -orbit.target.y);
    const p = new THREE.Vector3();
    return ray.ray.intersectPlane(plano, p) ? p : null;
  },
  empezar(e){
    const p = this.punto(e); if (!p) return;
    this.trazo = { id:uid(), pts:[p.x, p.y, p.z], color:this.color, grosor:this.grosor };
    this.lista().push(this.trazo);
  },
  seguir(e){
    if (!this.trazo) return;
    const p = this.punto(e); if (!p) return;
    const n = this.trazo.pts.length;
    if (n >= 3) {
      const d = Math.hypot(p.x - this.trazo.pts[n - 3], p.y - this.trazo.pts[n - 2], p.z - this.trazo.pts[n - 1]);
      if (d < .08) return;
    }
    this.trazo.pts.push(p.x, p.y, p.z);
    buildDraw();
  },
  fin(){ if (this.trazo) { this.trazo = null; markDirty(); buildDraw(); } },
  borrarUltimo(){ this.lista().pop(); buildDraw(); markDirty(); toast('Último trazo borrado'); },
  borrarTodo(){ P.draw = []; buildDraw(); markDirty(); toast('Dibujo borrado'); }
};
let drawGroup = null;
function buildDraw(){
  if (drawGroup) { root.remove(drawGroup); disposeDeep(drawGroup); }
  drawGroup = new THREE.Group();
  (P.draw || []).forEach(t => {
    if (t.pts.length < 6) return;
    const v = [];
    for (let i = 0; i < t.pts.length; i += 3) v.push(new THREE.Vector3(t.pts[i], t.pts[i + 1], t.pts[i + 2]));
    try {
      const curva = new THREE.CatmullRomCurve3(v);
      const geo = new THREE.TubeGeometry(curva, Math.min(220, v.length * 3), t.grosor || .06, 6, false);
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:t.color, roughness:.6,
        emissive:new THREE.Color(t.color), emissiveIntensity:.35 }));
      m.castShadow = false;
      drawGroup.add(m);
    } catch (e) {}
  });
  root.add(drawGroup);
}


/* ============================================================
   Foto renderizada por trazado de rayos (CPU, para capturas)
   ============================================================ */
const Foto = {
  tris:[], cajas:[], corriendo:false,
  reunir(){
    this.tris = []; this.cajas = [];
    const v = new THREE.Vector3();
    root.traverse(o => {
      if (!o.isMesh || !o.visible || o.userData.helper) return;
      const g = o.geometry; if (!g || !g.attributes.position) return;
      const idx = g.index ? g.index.array : null;
      const pos = g.attributes.position;
      const total = idx ? idx.length : pos.count;
      if (this.tris.length > 24000) return;
      const col = (o.material && o.material.color) ? o.material.color.clone() : new THREE.Color(0xaaaaaa);
      const emis = (o.material && o.material.emissiveIntensity) || 0;
      const inicio = this.tris.length;
      const caja = new THREE.Box3();
      o.updateWorldMatrix(true, false);
      for (let i = 0; i < total; i += 3) {
        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        const ia = idx ? idx[i] : i, ib = idx ? idx[i + 1] : i + 1, ic = idx ? idx[i + 2] : i + 2;
        a.fromBufferAttribute(pos, ia).applyMatrix4(o.matrixWorld);
        b.fromBufferAttribute(pos, ib).applyMatrix4(o.matrixWorld);
        c.fromBufferAttribute(pos, ic).applyMatrix4(o.matrixWorld);
        const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a));
        if (n.lengthSq() < 1e-12) continue;
        n.normalize();
        this.tris.push({ a:a, b:b, c:c, n:n, col:col, emis:emis });
        caja.expandByPoint(a).expandByPoint(b).expandByPoint(c);
        if (this.tris.length > 24000) break;
      }
      if (this.tris.length > inicio) this.cajas.push({ caja:caja, desde:inicio, hasta:this.tris.length });
    });
    if (ground && ground.visible) {
      const s = P.world.groundSize / 2, y = 0;
      const col = new THREE.Color(P.world.groundColor);
      const p1 = new THREE.Vector3(-s, y, -s), p2 = new THREE.Vector3(s, y, -s),
            p3 = new THREE.Vector3(s, y, s), p4 = new THREE.Vector3(-s, y, s);
      const n = new THREE.Vector3(0, 1, 0), i0 = this.tris.length;
      this.tris.push({ a:p1, b:p2, c:p3, n:n, col:col, emis:0 }, { a:p1, b:p3, c:p4, n:n, col:col, emis:0 });
      this.cajas.push({ caja:new THREE.Box3(new THREE.Vector3(-s, -.1, -s), new THREE.Vector3(s, .1, s)), desde:i0, hasta:this.tris.length });
    }
  },
  cortaCaja(o, d, caja){
    let t0 = 0, t1 = 1e9;
    for (let i = 0; i < 3; i++) {
      const ax = i === 0 ? 'x' : (i === 1 ? 'y' : 'z');
      const inv = 1 / (d[ax] || 1e-9);
      let ta = (caja.min[ax] - o[ax]) * inv, tb = (caja.max[ax] - o[ax]) * inv;
      if (ta > tb) { const t = ta; ta = tb; tb = t; }
      t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
      if (t0 > t1) return false;
    }
    return true;
  },
  choca(o, d, maxT){
    let mejor = null, mt = maxT || 1e9;
    for (let k = 0; k < this.cajas.length; k++) {
      const c = this.cajas[k];
      if (!this.cortaCaja(o, d, c.caja)) continue;
      for (let i = c.desde; i < c.hasta; i++) {
        const t = this.tris[i];
        const e1x = t.b.x - t.a.x, e1y = t.b.y - t.a.y, e1z = t.b.z - t.a.z;
        const e2x = t.c.x - t.a.x, e2y = t.c.y - t.a.y, e2z = t.c.z - t.a.z;
        const px = d.y * e2z - d.z * e2y, py = d.z * e2x - d.x * e2z, pz = d.x * e2y - d.y * e2x;
        const det = e1x * px + e1y * py + e1z * pz;
        if (Math.abs(det) < 1e-9) continue;
        const inv = 1 / det;
        const tx = o.x - t.a.x, ty = o.y - t.a.y, tz = o.z - t.a.z;
        const u = (tx * px + ty * py + tz * pz) * inv;
        if (u < 0 || u > 1) continue;
        const qx = ty * e1z - tz * e1y, qy = tz * e1x - tx * e1z, qz = tx * e1y - ty * e1x;
        const v = (d.x * qx + d.y * qy + d.z * qz) * inv;
        if (v < 0 || u + v > 1) continue;
        const dist = (e2x * qx + e2y * qy + e2z * qz) * inv;
        if (dist > .0005 && dist < mt) { mt = dist; mejor = { t:dist, tri:t }; }
      }
    }
    return mejor;
  },
  color(o, d, prof, cielo, sol, luzSol){
    const h = this.choca(o, d);
    if (!h) return cielo.clone().multiplyScalar(d.y > 0 ? 1 : .35);
    const tri = h.tri;
    const p = new THREE.Vector3(o.x + d.x * h.t, o.y + d.y * h.t, o.z + d.z * h.t);
    let n = tri.n.clone();
    if (n.dot(d) > 0) n.negate();
    const alb = tri.col;
    let luz = new THREE.Color(0, 0, 0);
    const lamb = Math.max(0, n.dot(sol));
    if (lamb > 0) {
      const som = this.choca(new THREE.Vector3(p.x + n.x * .002, p.y + n.y * .002, p.z + n.z * .002), sol, 400);
      if (!som) luz.add(luzSol.clone().multiplyScalar(lamb));
    }
    luz.add(cielo.clone().multiplyScalar(.28 * (n.y * .5 + .5) + .07));
    if (prof > 0) {
      const r = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
      if (r.dot(n) < 0) r.negate();
      const reb = this.color(new THREE.Vector3(p.x + n.x * .002, p.y + n.y * .002, p.z + n.z * .002), r, prof - 1, cielo, sol, luzSol);
      luz.add(reb.multiplyScalar(.42));
    }
    const out = new THREE.Color(alb.r * luz.r, alb.g * luz.g, alb.b * luz.b);
    if (tri.emis) out.add(alb.clone().multiplyScalar(tri.emis * .8));
    return out;
  },
  render(ancho, muestras, rebotes, cb){
    this.reunir();
    const alto = Math.round(ancho * (canvas.clientHeight / Math.max(1, canvas.clientWidth)));
    const cv = document.createElement('canvas'); cv.width = ancho; cv.height = alto;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(ancho, alto);
    const cam = editorCam;
    cam.updateMatrixWorld();
    const origen = cam.position.clone();
    const cielo = new THREE.Color(P.world.sky).multiplyScalar(.9 + P.world.ambient * .5);
    const sol = sun.position.clone().normalize();
    const luzSol = new THREE.Color(P.world.sunColor).multiplyScalar(P.world.sunPower * 1.15);
    let y = 0;
    const paso = () => {
      const t0 = performance.now();
      while (y < alto && performance.now() - t0 < 60) {
        for (let x = 0; x < ancho; x++) {
          const c = new THREE.Color(0, 0, 0);
          for (let s = 0; s < muestras; s++) {
            const ndcx = ((x + Math.random()) / ancho) * 2 - 1;
            const ndcy = -(((y + Math.random()) / alto) * 2 - 1);
            const dir = new THREE.Vector3(ndcx, ndcy, .5).unproject(cam).sub(origen).normalize();
            c.add(this.color(origen, dir, rebotes, cielo, sol, luzSol));
          }
          c.multiplyScalar(1 / muestras);
          const i = (y * ancho + x) * 4;
          img.data[i] = Math.min(255, Math.pow(c.r, .4545) * 255);
          img.data[i + 1] = Math.min(255, Math.pow(c.g, .4545) * 255);
          img.data[i + 2] = Math.min(255, Math.pow(c.b, .4545) * 255);
          img.data[i + 3] = 255;
        }
        y++;
      }
      ctx.putImageData(img, 0, 0);
      cb(cv, y / alto);
      if (y < alto) setTimeout(paso, 0);
      else this.corriendo = false;
    };
    this.corriendo = true;
    paso();
  }
};

/* ============================================================
   Grabadora de video y sistema de extensiones
   ============================================================ */
const Grabadora = {
  rec:null, trozos:[], on:false,
  puede(){ return typeof MediaRecorder !== 'undefined' && canvas.captureStream; },
  toggle(){
    if (this.on) return this.parar();
    if (!this.puede()) { toast('Este navegador no permite grabar vídeo'); return; }
    try {
      const stream = canvas.captureStream(30);
      const tipos = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
      const tipo = tipos.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
      this.rec = new MediaRecorder(stream, tipo ? { mimeType:tipo, videoBitsPerSecond:6000000 } : undefined);
      this.trozos = [];
      this.rec.ondataavailable = e => { if (e.data && e.data.size) this.trozos.push(e.data); };
      this.rec.onstop = () => {
        const blob = new Blob(this.trozos, { type:'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (P.name || 'partida').replace(/[^\w\-]+/g, '_') + '.webm';
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        log('Vídeo guardado (' + Math.round(blob.size / 1024) + ' KB)', 'ok');
      };
      this.rec.start();
      this.on = true;
      $('#btnRec').classList.add('danger');
      toast('Grabando · pulsa F9 para parar');
    } catch (e) { toast('No se pudo empezar a grabar'); log('Grabadora: ' + e.message, 'er'); }
  },
  parar(){
    if (!this.rec) return;
    try { this.rec.stop(); } catch (e) {}
    this.on = false; this.rec = null;
    $('#btnRec').classList.remove('danger');
    toast('Vídeo descargado');
  }
};

/* ---------- Extensiones ---------- */
const Ext = {
  api(){
    return {
      THREE:THREE,
      registrarMecanica(def){
        if (!def || !def.id) return;
        if (BEH[def.id]) { BEHAVIORS.splice(BEHAVIORS.indexOf(BEH[def.id]), 1); }
        def.cat = def.cat || 'Extensiones';
        BEHAVIORS.push(def); BEH[def.id] = def;
        if (CATS.indexOf(def.cat) < 0) CATS.push(def.cat);
      },
      registrarBloque(def){
        if (!def || !def.op || !def.l) return;
        def.cat = def.cat || 'ctrl';
        if (!BLK[def.op]) { BLOCKS.push(def); BLK[def.op] = def; }
      },
      registrarConversion(def){ if (def && def.id) CONVERT.push(def); },
      registrarSonido(nombre, cfg){ if (nombre && cfg) Snd.presets[nombre] = cfg; },
      aviso(m){ toast(String(m)); },
      log(m){ log('[extensión] ' + m, 'in'); }
    };
  },
  ejecutar(p){
    try {
      const fn = new Function('U3D', '"use strict";' + p.code);
      fn(this.api());
      p.error = null;
      log('Extensión cargada: ' + p.name, 'ok');
      return true;
    } catch (e) {
      p.error = e.message;
      log('Error en la extensión ' + p.name + ': ' + e.message, 'er');
      return false;
    }
  },
  cargarTodas(){
    (P.plugins || []).forEach(p => { if (p.on !== false) this.ejecutar(p); });
    if ((P.plugins || []).length) { renderMechs(); renderPalette && renderPalette(); }
  },
  añadir(nombre, code){
    P.plugins = P.plugins || [];
    P.plugins.push({ id:uid(), name:nombre, code:code, on:true });
    this.ejecutar(P.plugins[P.plugins.length - 1]);
    renderAssets(); renderMechs(); markDirty();
    toast('Extensión añadida: ' + nombre);
  },
  ejemplo(){
    return "// Extensión de ejemplo de ULTIMATE3D\n" +
      "U3D.registrarMecanica({\n" +
      "  id:'girar_loco', name:'Giro loco', cat:'Extensiones',\n" +
      "  desc:'Gira en los tres ejes a velocidades distintas.',\n" +
      "  params:[{k:'vel',l:'Velocidad',t:'num',d:2}],\n" +
      "  update:function(e,p,dt){ e.o.rotation.x+=p.vel*dt; e.o.rotation.y+=p.vel*0.7*dt; e.o.rotation.z+=p.vel*0.3*dt; }\n" +
      "});\n" +
      "U3D.registrarSonido('campana',{wave:'sine',f1:900,f2:420,dur:.9,atk:.005,vol:.3,filt:5200});\n" +
      "U3D.log('lista');\n";
  }
};

    if(t==='borrar'){ const L=(x.nombres||[x.nombre]).map(buscar).filter(Boolean); if(!L.length) throw new Error('No existe '+x.nombre); L.forEach(o=>{ if(meshes[o.id]){ root.remove(meshes[o.id]); disposeDeep(meshes[o.id]); delete meshes[o.id]; } P.objects.splice(P.objects.indexOf(o),1); }); return 'Borrados '+L.length; }
    if(t==='duplicar'){ const o=buscar(x.nombre); if(!o) throw new Error('No existe '+x.nombre); const c=JSON.parse(JSON.stringify(o)); c.id=uid(); c.name=x.nuevo||o.name+' copia'; P.objects.push(c); aplicar(c,x); return 'Copia '+c.name; }
    if(t==='repetir'){ const o=buscar(x.nombre); if(!o) throw new Error('No existe '+x.nombre); const n=Math.max(1,Math.min(60,x.n||3)), dp=x.paso||[2,0,0]; for(let i=1;i<=n;i++){ const c=JSON.parse(JSON.stringify(o)); c.id=uid(); c.name=o.name+' '+(i+1); c.pos=o.pos.map((v,k)=>+(v+dp[k]*i).toFixed(3)); P.objects.push(c); rehacer(c); } return n+' copias de '+o.name; }
    if(t==='mecanica'){ const o=buscar(x.nombre); if(!o) throw new Error('No existe '+x.nombre); const b=mec(x.id,x.parametros||x.p); o.behaviors=(o.behaviors||[]).filter(y=>y.id!==b.id); o.behaviors.push(b); rehacer(o); return 'Mecánica '+b.id+' en '+o.name; }
    if(t==='quitar_mecanica'){ const o=buscar(x.nombre); if(!o) throw new Error('No existe '+x.nombre); o.behaviors=(o.behaviors||[]).filter(y=>y.id!==x.id); rehacer(o); return 'Quitada '+x.id; }
    if(t==='jugar'){ if(mode!=='scene') setMode('scene'); startGame(); return 'Jugando'; }
    if(t==='parar'){ stopGame(); return 'Parado'; }
    if(t==='encuadrar'){ const o=x.nombre&&buscar(x.nombre); if(o&&meshes[o.id]){ orbit.target.copy(meshes[o.id].position); updateEditorCam(); } return 'Encuadrado'; }
    throw new Error('Orden desconocida: '+x.op);
  }
  const r2=v=>+(+v).toFixed(2);
  const estado=()=>({proyecto:P.name,jugando:playing,mundo:P.world,modelos:(P.models||[]).map(m=>m.name+(m.skin?' (con esqueleto: '+(m.skin.clips||[]).map(c=>c.name).join(', ')+')':'')),
    objetos:P.objects.slice(0,120).map(o=>({nombre:o.name,tipo:o.type==='model'?'modelo':o.geo,pos:(o.pos||[]).map(r2),tam:(o.scl||[]).map(r2),rot:(o.rot||[]).map(r2),color:o.color,etiqueta:o.tag||undefined,mecanicas:(o.behaviors||[]).map(b=>b.id)}))});
  window.addEventListener('message',e=>{ const d=e.data||{}; if(!d.__mor) return; const ok=x=>send(Object.assign({id:d.id},x));
    if(d.cmd==='ops'){ if(mode!=='scene') try{ setMode('scene'); }catch(e){} const res=[]; for(const x of (d.ops||[]).slice(0,80)){ try{ res.push('✓ '+op(x)); }catch(err){ res.push('✗ '+(x.op||'?')+': '+err.message); } }
      try{ renderTree(); renderModelLib(); select(null); markDirty(); }catch(e){} ok({res,estado:estado()}); }
    else if(d.cmd==='estado'){ ok({estado:estado()}); }
    else if(d.cmd==='catalogo'){ ok({mecanicas:BEHAVIORS.map(b=>({id:b.id,nombre:b.name,cat:b.cat,desc:b.desc,parametros:(b.params||[]).map(p=>p.k+'='+p.d+' ('+p.l+')')}))}); }
    else if(d.cmd==='ultimoModelo'){ const m=(P.models||[])[P.models.length-1]; ok({nombre:m&&m.name,esqueleto:!!(m&&m.skin)}); } });
})();
</script>
